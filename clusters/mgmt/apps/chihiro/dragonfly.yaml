apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: chihiro-dragonfly
spec:
  replicas: 1
  resources:
    requests:
      # Measured (Mimir, 3d): peak ~11m, avg ~6m. 500m was a ~60x
      # over-reservation; 15m (~1.5x peak) frees reservation while the
      # 600m limit still absorbs any burst.
      cpu: 15m
      memory: 500Mi
    limits:
      cpu: 600m
      memory: 750Mi
