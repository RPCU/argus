# chihiro itself runs from hestia (OpenChoreo): env "production" on mgmt
# (chihiro.mgmt.rpcu.lan + LB 172.16.255.11) and env "public" on the production
# cluster (chihiro.rpcu.io). What stays here is what argus owns for it:
#   - the chihiro-system namespace, target of the Crossplane Zitadel Oidc
#     connection secret (clusters/mgmt/crossplane/zitadel/oidc-chihiro.yaml);
#   - the OIDC remap and the generated session key;
#   - chihiro-viewer-role, used by the public instance's chihiro-external SA
#     (the mgmt instance gets its own role from hestia's rbac trait);
#   - the Vault push feeding both OpenChoreo deployments.
namespace: chihiro-system
resources:
  - namespace.yaml
  - rbacs.yaml
  - session-key.yaml
  - oidc.yaml
  - external-sa.yaml
  - vault-push.yaml
