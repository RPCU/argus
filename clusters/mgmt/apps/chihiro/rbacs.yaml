# chihiro-viewer-role: what chihiro needs on mgmt (CAPI read + cluster
# lifecycle, cluster CA secrets, Sveltos ClusterSummaries). Bound to the
# chihiro-external SA (external-sa.yaml) used by the public instance. The mgmt
# instance (hestia, env production) carries the same rules in its rbac trait.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chihiro-viewer-role
rules:
  # Core API discovery permissions
  - apiGroups: [""]
    resources: [""]
    verbs: ["get"]
  - apiGroups: ["*"]
    resources: [""]
    verbs: ["get"]
  # Namespace permissions for listing namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Secret read permission for retrieving cluster CA certificates
  # (used to embed certificate-authority-data in generated kubeconfigs)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Cluster API permissions for watching and viewing clusters
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters", "machinesets", "machines", "machinedeployments"]
    verbs: ["get", "list", "watch"]
  # Cluster object modification permissions (mgmt namespace only)
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["create", "update", "patch", "delete"]
    resourceNames: []
  # Infrastructure provider resources
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Control plane provider resources
  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Bootstrap provider resources
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Sveltos add-on status (CHIHIRO_SVELTOS_ENABLED)
  - apiGroups: ["config.projectsveltos.io"]
    resources: ["clustersummaries"]
    verbs: ["get", "list", "watch"]
