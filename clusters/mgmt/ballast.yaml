apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ballast
  namespace: flux-system
spec:
  interval: 30m0s
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/ballast
  prune: true
  wait: true
  timeout: 10m
