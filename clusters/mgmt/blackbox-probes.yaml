# Probe CRs for the mgmt cluster endpoints.
#
# These are static (not Sveltos-templated) because mgmt is not a workload
# cluster — it runs its own Flux Kustomization. Probe metrics are scraped by
# the local Prometheus and remote_written to Mimir with externalLabels.cluster=mgmt.
#
# Probed endpoints:
#   grafana.mgmt.rpcu.lan   — Grafana UI (port 3000)
#   mimir.mgmt.rpcu.lan     — Mimir gateway (port 80)
#   vault.mgmt.rpcu.lan     — Vault UI/API (port 8200)
#   chihiro.mgmt.rpcu.lan   — Chihiro app (port 8080)
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-mgmt-grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: blackbox-exporter
    cluster: mgmt
spec:
  module: http_2xx
  interval: 60s
  jobLabel: blackbox
  targets:
    staticConfig:
      values:
        - https://grafana.mgmt.rpcu.lan
---
