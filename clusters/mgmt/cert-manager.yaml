apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/cert-manager
  prune: true
  wait: true
  timeout: 5m
  patches:
    # Re-enable the cert-manager ServiceMonitor. The shared base defaults it OFF
    # (the ServiceMonitor CRD is absent on monitoring-less clusters); mgmt runs
    # kube-prometheus-stack, so turn it back on here. Helm merges this inline
    # `values` over the base cert-manager-values ConfigMap, so the
    # `release: kube-prometheus-stack` label from the base is preserved (and
    # required — the mgmt serviceMonitorSelector matches on it).
    - patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: cert-manager
          namespace: cert-manager
        spec:
          values:
            prometheus:
              servicemonitor:
                enabled: true
      target:
        kind: HelmRelease
        name: cert-manager
