# chihiro's argus-owned support objects (OIDC chain, Vault push, the
# chihiro-external SA). chihiro itself is deployed by hestia/OpenChoreo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: chihiro
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./clusters/mgmt/apps/chihiro
  prune: true
  timeout: 5m
  dependsOn:
    - name: external-secrets
    # chihiro's oidc.yaml ESO remaps the Crossplane-written connection secret
    # (chihiro-oidc-conn) into chihiro-oidc; crossplane-resources owns that Oidc.
    - name: crossplane-resources
