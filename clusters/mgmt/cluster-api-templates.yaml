apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api-templates
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/cluster-api-templates
  prune: true
  # This Kustomization now holds ONLY the versioned templates
  # (OpenStackClusterTemplate / KubeadmControlPlaneTemplate / KubeadmConfigTemplate
  # / OpenStackMachineTemplate) — the ClusterClasses moved to
  # cluster-api-clusterclasses.yaml, which dependsOn this one. This guarantees a
  # NEW -vN template is applied to the API server BEFORE the ClusterClass that
  # repoints its templateRef at it. When the ClusterClass + the not-yet-created
  # template lived in the SAME Kustomization, there was no intra-set ordering
  # guarantee: the ClusterClass could reconcile against a templateRef the API
  # server did not yet have, report a topology/templateRef error, and mark the
  # WHOLE Kustomization NotReady — dragging the perfectly valid templates down
  # with it and retrying forever. Splitting lets the templates land first.
  #
  # wait: true is SAFE here (unlike on the ClusterClass) because these templates
  # are plain CRs with no controller-driven status — kstatus reports them Ready
  # as soon as they exist. Waiting on them is exactly what lets the dependent
  # ClusterClass Kustomization trust that the template is present.
  wait: true
  timeout: 10m
  dependsOn:
    - name: cluster-api-providers
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api-clusterclasses
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/cluster-api-clusterclasses
  prune: true
  # NOTE: wait is intentionally OMITTED (defaults to false). With wait: true,
  # Flux health-gates on the ClusterClass via kstatus. When the ClusterClass
  # infrastructure.templateRef is rotated to a new -vN template, the ClusterClass
  # briefly reports InProgress until the topology controller resolves the new
  # template reference; a health-wait could trip and, if the topology controller
  # wedges, never recover. Without wait, Flux applies the ClusterClass and
  # returns; CAPI converges asynchronously.
  #
  # The template it references is guaranteed present because this Kustomization
  # dependsOn cluster-api-templates (which uses wait: true), so the atomic-apply
  # ordering race is resolved at the Kustomization dependency level instead.
  timeout: 10m
  dependsOn:
    - name: cluster-api-templates
