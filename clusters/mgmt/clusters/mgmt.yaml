apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: mgmt
  namespace: mgmt
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    chihiro.io/readonly: "true"
    type: mgmt
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    serviceDomain: mgmt.local
  topology:
    classRef:
      name: openstack-default
    version: v1.36.1
    controlPlane:
      replicas: 1
      # Force the KCP to replace its machine: the topology controller patched
      # the CP OpenStackMachineTemplate IN PLACE (same name) for the
      # large -> large-16 flavor change, and KCP judges machines by the
      # template reference, so it saw nothing to roll (2026-09-28). Bump this
      # whenever a CP template change must be rolled out.
      rollout:
        after: "2026-09-28T12:50:00Z"
    workers:
      machineDeployments:
        - class: default-worker
          name: md-0
          replicas: 2
          variables:
            overrides:
              # 60 GB root disk: 30 GB cis-xlarge workers hit DiskPressure.
              - name: workerFlavor
                value: cis-xlarge-60
    variables:
      # Spread workers across hypervisors (soft-anti-affinity server group
      # capi-mgmt, Sveltos capi-server-groups). Workers only — the kubeadm
      # control plane is not touched.
      - name: workerServerGroup
        value: true
      - name: identityRef
        value:
          name: mgmt-cloud-config
          cloudName: openstack
      - name: externalNetworkId
        value: 1cfd69da-057c-4748-a0d4-de5b0ca77db2
      - name: managedSubnetCIDR
        value: 192.168.1.0/24
      - name: imageName
        value: hephaestus-kaas-26.05-v1.36.1
      # 16 GB: on `large` (8 GB) the apiserver (~5 GB with the crossplane
      # CRDs) OOM-thrashed the VM during a worker rollout (2026-09-28).
      - name: controlPlaneFlavor
        value: large-16
      - name: workerFlavor
        value: large
      - name: apiServerFloatingIP
        value: 172.16.255.212
      - name: oidc
        value:
          enabled: true
          issuerURL: https://rpcu-gabeck.eu1.zitadel.cloud
          clientID: "377050089077613929"
