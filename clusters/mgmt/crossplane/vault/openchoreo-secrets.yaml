# Vault access for OpenChoreo on the mgmt DataPlane (hestia's `production`
# environment), the same way chihiro's pushes work (chihiro-push.yaml): a
# Crossplane-managed policy + Kubernetes-auth role on the Crossplane-managed
# `clusters/mgmt` mount, used by a dedicated ClusterSecretStore.
#
# OpenChoreo reads and writes DataPlane secrets through the DataPlane's
# `secretStoreRef` (hestia platform/infra/dataplanes/mgmt.yaml → openchoreo-vault):
#   - portal secrets: a PushSecret in `openchoreo-kv-<namespace>` writes
#     `secret/<namespace>/generic/<name>`, and a SecretReference reads it back;
#   - git SecretReferences targeting mgmt read their key (today only
#     `chihiro`, pushed by clusters/mgmt/apps/chihiro/vault-push.yaml).
# The shared `vault-backend` store authenticates as the hand-made
# `kubernetes` role `external-secrets`, which is read-only on a few paths (and
# Crossplane can't change it: 403 on auth/kubernetes/role/*), so portal pushes
# to mgmt failed with 403. This store keeps OpenChoreo off that role entirely.
# A new git SecretReference targeting mgmt needs its key added below.
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: openchoreo-secrets
spec:
  forProvider:
    name: openchoreo-secrets
    policy: |
      path "secrets-mgmt/data/secret/*" {
        capabilities = ["create", "read", "update", "patch", "delete"]
      }
      path "secrets-mgmt/metadata/secret/*" {
        capabilities = ["create", "read", "update", "patch", "delete", "list"]
      }
      path "secrets-mgmt/data/chihiro" {
        capabilities = ["read"]
      }
  providerConfigRef:
    name: default
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: openchoreo-vault
spec:
  forProvider:
    backendRef:
      name: mgmt
    roleName: openchoreo-vault
    boundServiceAccountNames:
      - openchoreo-vault
    boundServiceAccountNamespaces:
      - external-secrets
    tokenPolicies:
      - openchoreo-secrets
    tokenTtl: 3600
  providerConfigRef:
    name: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openchoreo-vault
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openchoreo-vault
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secrets-mgmt"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "clusters/mgmt"
          role: "openchoreo-vault"
          serviceAccountRef:
            name: "openchoreo-vault"
            namespace: "external-secrets"
