# Vault access for OpenChoreo portal-managed secrets on the mgmt DataPlane.
#
# OpenChoreo's secret management (hestia, features.secretManagement) stores a
# portal secret by creating a PushSecret in `openchoreo-kv-<namespace>` on the
# target DataPlane cluster, through that cluster's `vault-backend` store, at
# `secret/<namespace>/generic/<name>` in its KV mount; a SecretReference reads
# it back the same way. On workload clusters the store's policy
# (secrets-<cluster>, Sveltos vault-auth) already allows writes. On mgmt the
# store authenticates as the hand-made `kubernetes` role `external-secrets`,
# whose policies only read specific paths, so pushes to mgmt failed with 403.
#
# This policy grants read/write on OpenChoreo's `secret/` prefix only. It must be
# attached to that role by hand (Crossplane's Vault identity gets 403 on
# auth/kubernetes/role/*): see infrastructure/vault/README.md, "OpenChoreo
# portal secrets".
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: openchoreo-secrets
spec:
  forProvider:
    name: openchoreo-secrets
    policy: |
      path "secrets-mgmt/data/secret/*" {
        capabilities = ["create", "read", "update", "patch", "delete"]
      }
      path "secrets-mgmt/metadata/secret/*" {
        capabilities = ["create", "read", "update", "patch", "delete", "list"]
      }
  providerConfigRef:
    name: default
