apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dike
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/dike
  prune: true
  wait: true
  timeout: 5m
  # Dike watches CAPI Cluster objects, so the CRDs must be present first.
  dependsOn:
    - name: cluster-api-providers
