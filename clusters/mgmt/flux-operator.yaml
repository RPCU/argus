---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/fluxcd/operator
  prune: false
---
# Flux controller metrics Service + ServiceMonitor. Split from flux-operator
# because the ServiceMonitor kind is a Prometheus Operator CRD that only exists
# once kube-prometheus-stack (the `monitoring` add-on) is installed. dependsOn
# monitoring guarantees the CRD + `monitoring` namespace are present first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-metrics
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/fluxcd/monitoring
  prune: true
  dependsOn:
    - name: monitoring
