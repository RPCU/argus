# Probe CRs for the openstack cluster endpoints.
#
# These are static (not Sveltos-templated) because openstack is the baremetal
# primary cluster — it runs its own Flux Kustomization. Probe metrics are
# scraped by the local Prometheus and remote_written to Mimir with
# externalLabels.cluster=openstack.
#
# All endpoints are behind the kgateway LoadBalancer at 10.0.0.240.
# DNS resolves *.rpcu.vpn to the gateway IP. TLS uses the rpcu-vpn wildcard
# cert issued by root-rpcu. BackendTLSPolicies handle re-encryption to backends.
#
# Probed endpoints:
#   keystone.rpcu.vpn   — Keystone (5001)
#   glance.rpcu.vpn     — Glance (9293)
#   nova.rpcu.vpn       — Nova (8775)
#   neutron.rpcu.vpn    — Neutron (9697)
#   cinder.rpcu.vpn     — Cinder (8777)
#   octavia.rpcu.vpn    — Octavia (9877)
#   designate.rpcu.vpn  — Designate (9002)
#   os.rpcu.vpn         — Horizon (8443)
#   vnc.rpcu.vpn        — VNC (6080)
#   placement.rpcu.vpn  — Placement (8779)
#   ceph.rpcu.vpn       — Ceph dashboard (7000)
#   s3.rpcu.vpn         — Ceph S3 (80)
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-openstack-keystone
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: blackbox-exporter
    cluster: openstack
spec:
  module: http_2xx
  interval: 60s
  jobLabel: blackbox
  targets:
    staticConfig:
      values:
        - https://keystone.rpcu.vpn
---
