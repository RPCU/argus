apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/cert-manager
  prune: true
  wait: true
  timeout: 5m
  # NOTE: the cert-manager ServiceMonitor is NOT enabled here. It is owned by the
  # monitoring add-on (infrastructure/monitoring/cert-manager-servicemonitor.yaml,
  # applied via clusters/openstack/monitoring.yaml) — the component that ships the
  # ServiceMonitor CRD. Re-enabling the chart SM here would reintroduce the
  # monitoring/cert-manager CRD-ordering coupling. See §8.
