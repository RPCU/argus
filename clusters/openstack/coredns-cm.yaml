apiVersion: v1
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes openstack.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success openstack.local
           disable denial openstack.local
        }
        loop
        reload
        loadbalance
    }
    rpcu.lan:53 {
        errors
        forward . 10.0.0.241
        cache 30
    }
    rpcu.vpn:53 {
        errors
        forward . /etc/resolv.conf
        cache 30
    }
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
