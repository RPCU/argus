# kube-prometheus-stack on the BAREMETAL openstack cluster.
#
# Uses the SAME base as mgmt and the workload clusters
# (infrastructure/monitoring), patched only for the two things that are
# per-cluster: where to remote_write, and what to call this cluster.
#
# Pattern: identical to clusters/mgmt/monitoring.yaml (shared base + patches).
#
# UNLIKE mgmt, this cluster has no local Mimir — it ships every sample to the
# central Mimir on the mgmt cluster over the PUBLIC gateway endpoint
# (https://mimir.mgmt.rpcu.lan, TLS terminated by kgateway with the
# rpcu-lan-wildcard-tls cert issued by the root-mgmt CA). That is the same
# endpoint the Sveltos `monitoring` ClusterProfile points workload clusters at
# (infrastructure/sveltos/clusterprofiles/monitoring.yaml), so all clusters land
# in one tenant and the shared Grafana dashboards can select between them with
# the `cluster` label.
#
# PREREQUISITE (manual, one-off): the `mimir-ca` secret in the `monitoring`
# namespace, holding the root-mgmt CA under key `ca.crt`. Without it the
# remote_write TLS handshake fails, because this cluster's trust bundle is the
# RPCU root CA and knows nothing about root-mgmt. Workload clusters get this
# pushed by Sveltos from the mgmt `root-mgmt` secret; the baremetal cluster is
# not Sveltos-managed, so it is placed by hand:
#
#   kubectl --context mgmt -n cert-manager get secret root-mgmt \
#     -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/root-mgmt.crt
#   kubectl --context openstack -n monitoring create secret generic mimir-ca \
#     --from-file=ca.crt=/tmp/root-mgmt.crt
#
# `wait: false` for exactly that reason: until the secret exists the Prometheus
# pod runs fine but remote_write errors, and we do not want that to block the
# Kustomization (same rationale as capo-identity / openstack-ccm-identity).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/monitoring
  prune: true
  wait: false
  timeout: 10m
  patches:
    # Inject openstack-specific remote_write + externalLabels.
    - patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kube-prometheus-stack
        spec:
          values:
            prometheus:
              prometheusSpec:
                # --- Scrape the yaook OpenStack ServiceMonitors ---------------
                # The yaook operators generate 92 ServiceMonitors + 1 PodMonitor
                # in the `yaook` namespace, but NONE of them carry the
                # `release: kube-prometheus-stack` label that the chart's default
                # selector requires — so by default NOT ONE of them was scraped
                # and the cluster produced zero OpenStack metrics.
                #
                # A LabelSelector ANDs its terms, so there is no way to say
                # "release=kube-prometheus-stack OR yaook component X". The
                # workaround is an EXCLUSION expression: `NotIn` matches an
                # object whose label value is not listed AND ALSO any object
                # that does not carry the label at all. The kube-prometheus-stack
                # monitors have no `state.yaook.cloud/component` label, so they
                # keep matching, while yaook monitors are filtered by component.
                #
                # CONSEQUENCE, deliberately accepted: this is ALLOW-BY-DEFAULT.
                # Any new ServiceMonitor — from yaook or anything else installed
                # on this cluster — is scraped unless it is added to the list
                # below. Re-check the cardinality budget when adding operators.
                #
                # What this KEEPS (verified against the live cluster, 32 yaook
                # monitors, ~30k series):
                #   11  mysql_service_monitor     Galera DBs behind every service
                #    5  amqp_service_monitor      RabbitMQ, the OpenStack message bus
                #    2  ovsdb_service_monitor     OVN Northbound/Southbound DBs
                #    1  ovn_relay_service_monitor OVN SB relay
                #    1  ovn_monitoring_pod_monitor  ovn-controller + ovs-vswitchd
                #   13  (yaook operators, no component label)
                #
                # What this DROPS and why — these are the 60 monitors that would
                # roughly TRIPLE the scrape volume for little diagnostic value:
                #   *_ssl_service_monitor       certificate-expiry blackbox probes;
                #                               cert expiry is already enforced by
                #                               cert-manager renewal
                #   haproxy_service_monitor     per-DB connection proxies; the DB
                #                               itself is monitored above
                #   mysql_backup_service_monitor    hourly backup CronJob status
                #   replication_ports_service_monitor  blackbox port checks that
                #                               duplicate the mysql exporter
                #   memcache_service_monitor    keystone token cache; failures
                #                               surface as keystone latency
                #
                # The exporters are HTTPS with per-service CA secrets living in
                # the `yaook` namespace. That works: prometheus-operator resolves
                # a ServiceMonitor's tlsConfig secrets from the ServiceMonitor's
                # OWN namespace (mounted as
                # /etc/prometheus/certs/0_yaook_<secret>_tls.crt), so no secret
                # copying into `monitoring` is required. Verified live: target
                # health=up against the cinder Galera exporter.
                serviceMonitorSelector:
                  matchExpressions: &yaookComponentFilter
                    - key: state.yaook.cloud/component
                      operator: NotIn
                      values:
                        - api_ssl_service_monitor
                        - compute_external_ssl_service_monitor
                        - compute_internal_ssl_service_monitor
                        - external_ssl_service_monitor
                        - haproxy_service_monitor
                        - internal_ssl_service_monitor
                        - memcache_service_monitor
                        - metadata_ssl_service_monitor
                        - mysql_backup_service_monitor
                        - placement_external_ssl_service_monitor
                        - placement_internal_ssl_service_monitor
                        - replication_ports_service_monitor
                        - vnc_external_ssl_service_monitor
                # Same filter for PodMonitors: this is what lets the
                # `ovn_monitoring_pod_monitor` through (ovn-controller and
                # ovs-vswitchd, the per-node OVN data plane).
                podMonitorSelector:
                  matchExpressions: *yaookComponentFilter
                externalLabels:
                  cluster: openstack
                remoteWrite:
                  # queueConfig MUST be repeated here: this patch replaces the
                  # whole remoteWrite list (a strategic-merge patch treats an
                  # unkeyed list as atomic), so omitting it would silently drop
                  # the base's queue bounds and let the shards grow unbounded.
                  - url: https://mimir.mgmt.rpcu.lan/api/v1/push
                    tlsConfig:
                      ca:
                        secret:
                          name: mimir-ca
                          key: ca.crt
                    queueConfig:
                      capacity: 2500
                      maxShards: 5
                      minShards: 1
                      maxSamplesPerSend: 1000
      target:
        kind: HelmRelease
        name: kube-prometheus-stack
        namespace: monitoring
