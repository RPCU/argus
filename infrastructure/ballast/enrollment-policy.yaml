# Enroll pods in Ballast mode `apply` and give them a stable identity label.
# Runs on pod CREATE only: running pods join at their next restart, and get
# Ballast's sizing at the restart after their profile is ready (24h).
#
# Skipped:
# - namespaces in the binding below (control plane, storage, OpenStack,
#   tenant apiservers, Vault, monitoring — sized by hand, see AGENTS.md §8);
# - any pod with a CPU limit: Ballast never removes an existing CPU limit and
#   could set a request above it (pod rejected). That covers rabbitmq and
#   Dragonfly, whose CPU limits size their threads on purpose;
# - pods not owned by a ReplicaSet/StatefulSet/DaemonSet (Jobs never reach
#   readiness, bare pods have no stable identity);
# - CloudNativePG instances (the operator owns their resources);
# - pods that already carry a mode label (explicit opt-in/out wins).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: ballast-enroll
spec:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: controller-owned
      expression: >-
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(o,
          has(o.controller) && o.controller &&
          o.kind in ["ReplicaSet", "StatefulSet", "DaemonSet"])
    - name: not-labelled
      expression: >-
        !has(object.metadata.labels) ||
        !("ballast.tightlinesoftware.com/mode" in object.metadata.labels ||
          "cnpg.io/cluster" in object.metadata.labels)
    - name: no-cpu-limit
      expression: >-
        !object.spec.containers.exists(c, has(c.resources) &&
          has(c.resources.limits) && "cpu" in c.resources.limits)
  variables:
    - name: owner
      expression: >-
        object.metadata.ownerReferences.filter(o,
          has(o.controller) && o.controller)[0]
    - name: workload
      expression: >-
        variables.owner.kind == "ReplicaSet" && variables.owner.name.contains("-")
          ? variables.owner.name.substring(0, variables.owner.name.lastIndexOf("-"))
          : variables.owner.name
    - name: id
      expression: request.namespace + "--" + variables.workload
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {
                "ballast.tightlinesoftware.com/mode": "apply",
                "ballast.rpcu.io/workload": size(variables.id) > 63
                  ? variables.id.substring(0, 62) + "x"
                  : variables.id
              }
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: ballast-enroll
spec:
  policyName: ballast-enroll
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - flux-system
            - ballast-system
            - rook-ceph
            - yaook
            - kamaji-tenants
            - vault
            - monitoring
