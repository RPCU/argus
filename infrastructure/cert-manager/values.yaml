crds:
  enabled: true
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true
prometheus:
  # `prometheus.enabled: true` exposes the cert-manager metrics endpoint /
  # Service (and adds prometheus.io/* scrape annotations). It does NOT create a
  # ServiceMonitor here.
  enabled: true
  servicemonitor:
    # ALWAYS OFF in this SHARED base — do NOT re-enable it here or via per-cluster
    # HelmRelease patches. The `ServiceMonitor` kind is a Prometheus Operator CRD
    # that only exists on clusters running kube-prometheus-stack (the `monitoring`
    # add-on). This base is installed on mgmt, openstack AND opt-in workload
    # clusters (many WITHOUT monitoring), so a chart-rendered ServiceMonitor would
    # hard-fail the HelmRelease on `no matches for kind "ServiceMonitor"`.
    #
    # The cert-manager ServiceMonitor is instead OWNED BY THE MONITORING ADD-ON
    # (infrastructure/monitoring/cert-manager-servicemonitor.yaml) — the component
    # that actually ships the ServiceMonitor CRD. That removes the coupling that
    # previously deadlocked clusters opting into BOTH add-ons (cert-manager needed
    # the CRD; the CRD came only from monitoring; monitoring dependsOn
    # cert-manager). See §8.
    enabled: false
