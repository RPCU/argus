# Kubeadm bootstrap provider — generates cloud-init/bootstrap data for nodes.
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: BootstrapProvider
metadata:
  name: kubeadm
  namespace: capi-kubeadm-bootstrap-system
spec:
  # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
  version: v1.14.2
  # 72h Mimir: mem P95 ~68Mi / max ~89Mi, CPU P95 ~4m (was BestEffort).
  # Replaces the provider manifest's container resources wholesale (no CPU
  # limit — request-only policy, §8).
  deployment:
    containers:
      - name: manager
        resources:
          requests:
            cpu: 5m
            memory: 80Mi
          limits:
            memory: 256Mi
