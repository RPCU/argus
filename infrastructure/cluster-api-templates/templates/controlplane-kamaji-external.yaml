# -----------------------------------------------------------------------------
# Control plane template (KamajiControlPlaneTemplate) — external
#
# Based on v7 but adds externalClusterReference + network.gateway for hosting
# the tenant control plane on an EXTERNAL cluster (not the mgmt cluster).
#
# Key differences from v7:
#   - deployment.externalClusterReference: deploys TCP components to a remote
#     cluster via its kubeconfig secret (ExternalClusterReference feature gate
#     required on the Kamaji controller).
#   - network.serviceType: ClusterIP (not LoadBalancer) — the API server is
#     exposed via a Gateway API TLSRoute, not a cloud LB.
#   - network.gateway: configures the TLSRoute to attach to a Gateway listener.
#
# The externalClusterReference fields are patched per-cluster by the
# ClusterClass: kubeconfigSecretName defaults to <cluster-name>-kubeconfig,
# deploymentNamespace defaults to kamaji-tenants, gateway reference defaults to
# the "https" Gateway in kgateway-system with sectionName "kcp".
# -----------------------------------------------------------------------------
apiVersion: controlplane.cluster.x-k8s.io/v1alpha2
kind: KamajiControlPlaneTemplate
metadata:
  name: openstack-kamaji-control-plane-external
  namespace: mgmt
spec:
  template:
    spec:
      dataStoreName: default
      deployment:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      kamaji.clastix.io/component: deployment
                  topologyKey: kubernetes.io/hostname
        externalClusterReference:
          deploymentNamespace: kamaji-tenants
          kubeconfigSecretName: placeholder
          kubeconfigSecretKey: value
      apiServer:
        extraArgs:
          # Stop the apiserver from reconciling the kubernetes.default Service
          # endpoint. On an external Kamaji control plane the apiserver advertises
          # its own (in-tenant, unreachable-from-workers) address 10.x.x.x:6443 as
          # the kubernetes.default endpoint. That endpoint is useless — workers
          # reach the API server through the node-local Caddy proxy + Cilium LRP
          # (see infrastructure/sveltos/clusterprofiles/kamaji-apiserver-proxy.yaml)
          # — AND it actively breaks that proxy: Cilium syncs the apiserver-managed
          # ClusterIP Service entry (10.x.x.x:6443 backend) before/independently of
          # the LRP, and on any node that joins AFTER the LRP is created the agent
          # keeps the ClusterIP backend instead of converting it to LocalRedirect,
          # so kubernetes.default:443 blackholes there. With reconciler-type=none
          # the Service carries no apiserver endpoint, leaving the LRP as the sole
          # owner of the ClusterIP on every node (including late joiners).
          # The ClusterClass oidc patch appends the --oidc-* flags after this.
          - --endpoint-reconciler-type=none
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
      controllerManager:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
      scheduler:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
      kubelet:
        preferredAddressTypes:
          - InternalIP
          - ExternalIP
          - Hostname
      network:
        # ClusterIP (not LoadBalancer): the tenant API server + konnectivity are
        # exposed via Gateway API TLSRoutes (SNI passthrough), NOT a per-tenant
        # Octavia LB. Kamaji auto-creates the apiserver TLSRoute here and, since
        # konnectivity is enabled, a second TLSRoute for the konnectivity-server
        # (hardcoded listener name "konnectivity-server", port 8132) against the
        # same gateway parentRefs — the Gateway MUST carry both listeners.
        serviceType: ClusterIP
        # certSANs: the external FQDN the tenant API server is reached by. The
        # in-cluster kubernetes.default.svc path is steered by a Cilium Local
        # Redirect Policy to a node-local SNI-rewrite proxy that forwards to the
        # Gateway with SNI=<this FQDN>; the served apiserver cert must therefore
        # be valid for it. Patched per-cluster from the gatewayHostname variable.
        certSANs:
          - placeholder.invalid
        gateway:
          name: https
          namespace: kgateway-system
          # Patched to "<fqdn>:<port>" by the ClusterClass. The port suffix is
          # mandatory: the Kamaji CAPI provider builds
          # Cluster.spec.controlPlaneEndpoint from this field only, defaulting to
          # 443 when no port is present, and that endpoint is what ends up in
          # every generated kubeconfig. It strips the suffix before using the
          # value for the TLSRoute hostname and the apiserver cert SANs.
          hostname: placeholder.invalid
          # TLSRoute ParentReference.Port — must equal the kcp listener port on
          # the target Gateway (see the Sveltos gateway-api profile).
          port: 6443
      addons:
        coreDNS: {}
        konnectivity: {}
