# -----------------------------------------------------------------------------
# v10: = v9 + the same relaxed probes on apiServer, controllerManager and
# scheduler. cluster-api-control-plane-provider-kamaji (v0.21.0,
# controllers/kamajicontrolplane_controller_tcp.go) only copies probes into the
# TenantControlPlane when deployment.probes AND all three component probes are
# set; otherwise it writes `probes: nil`. v9 set only deployment.probes, so
# every tenant still ran Kamaji's defaults (1s timeout, 3 failures): a steal/
# iowait spike on the hosting VM stalled /livez >1s, the kubelet SIGKILLed the
# single apiserver replica, Cilium answered the LB NodePort with ICMP
# unreachable and every leader-elected controller in the workload cluster
# exited on `no route to host` (production, 2026-09-28 14:51:56).
#
# -----------------------------------------------------------------------------
# v9: = previous + relaxed deployment.probes (startup up to 5min, 5s
# timeouts) and apiserver CPU request 250m (cpu.weight during startup bursts).
#
# Control plane template (KamajiControlPlane) — v8
#
# Same as v7 with the tenant control-plane containers right-sized from 72h
# Mimir history of the `production` tenant CP (hosted on mgmt, ns mgmt):
#   kube-apiserver          P95 ~1895Mi / max ~2095Mi, CPU P95 ~128m
#                           (v7 requested 1Gi with NO limit — ~half of real use)
#   kube-controller-manager P95 ~158Mi / max ~166Mi, CPU P95 ~29m
#   kube-scheduler          P95 ~33Mi / max ~38Mi, CPU P95 ~3m
# Policy: memory request ≈ P95, memory limit ≈ 2x max, CPU request-only.
# -----------------------------------------------------------------------------
apiVersion: controlplane.cluster.x-k8s.io/v1alpha2
kind: KamajiControlPlaneTemplate
metadata:
  name: openstack-kamaji-control-plane-v10
  namespace: mgmt
spec:
  template:
    spec:
      dataStoreName: default
      deployment:
        # Relaxed probes (Kamaji defaults: 1s timeout, 3x10s startup). On a
        # CPU-contended host the tenant apiserver can't finish its
        # rbac/bootstrap-roles post-start hook in 30s and crashloops forever
        # (platform tenant on production, 2026-09-28: 28 restarts/24h).
        probes:
          startup:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          liveness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readiness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      kamaji.clastix.io/component: deployment
                  topologyKey: kubernetes.io/hostname
      apiServer:
        probes:
          startup:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          liveness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readiness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        extraArgs: []
        resources:
          requests:
            cpu: 250m
            memory: 1904Mi
          limits:
            memory: 4224Mi
      controllerManager:
        probes:
          startup:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          liveness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readiness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: 30m
            memory: 160Mi
          limits:
            memory: 384Mi
      scheduler:
        probes:
          startup:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          liveness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readiness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 48Mi
          limits:
            memory: 192Mi
      kubelet:
        preferredAddressTypes:
          - InternalIP
          - ExternalIP
          - Hostname
      network:
        serviceType: LoadBalancer
      addons:
        coreDNS: {}
        konnectivity: {}
