# -----------------------------------------------------------------------------
# Control plane template (KamajiControlPlane) — v5
#
# Same as v4 but removes memory limits from all tenant control plane pods.
# Memory requests are kept for scheduling admission; CPU limits prevent a
# runaway from starving co-located pods; but memory limits are omitted
# because OOM-killing the apiserver or scheduler is worse than letting them
# burst — same rationale as OVN vswitchd and Ceph daemons.
#
# IMMUTABILITY: KamajiControlPlaneTemplate.spec.template.spec is immutable
# once referenced by a ClusterClass. To change anything here, create a NEW
# template with a bumped version suffix (e.g. -v6), point the ClusterClass
# controlPlane.templateRef at it, and let the topology controller reconcile.
# -----------------------------------------------------------------------------
apiVersion: controlplane.cluster.x-k8s.io/v1alpha2
kind: KamajiControlPlaneTemplate
metadata:
  name: openstack-kamaji-control-plane-v5
  namespace: mgmt
spec:
  template:
    spec:
      dataStoreName: default
      apiServer:
        extraArgs: []
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
      controllerManager:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
      scheduler:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
      kubelet:
        preferredAddressTypes:
          - InternalIP
          - ExternalIP
          - Hostname
      network:
        serviceType: LoadBalancer
      addons:
        coreDNS: {}
        konnectivity: {}
