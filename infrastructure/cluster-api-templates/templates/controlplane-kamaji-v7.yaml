# -----------------------------------------------------------------------------
# Control plane template (KamajiControlPlane) — v7
#
# Same as v6 but was intended to add --watch-cache-sizes=default=50 to the
# kube-apiserver extraArgs. Removed because --watch-cache-sizes does NOT work
# for CRDs (only built-in resources). This template is now identical to -v6
# and exists only because the ClusterClass already points at it.
# -----------------------------------------------------------------------------
apiVersion: controlplane.cluster.x-k8s.io/v1alpha2
kind: KamajiControlPlaneTemplate
metadata:
  name: openstack-kamaji-control-plane-v7
  namespace: mgmt
spec:
  template:
    spec:
      dataStoreName: default
      deployment:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      kamaji.clastix.io/component: deployment
                  topologyKey: kubernetes.io/hostname
      apiServer:
        extraArgs: []
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
      controllerManager:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
      scheduler:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
      kubelet:
        preferredAddressTypes:
          - InternalIP
          - ExternalIP
          - Hostname
      network:
        serviceType: LoadBalancer
      addons:
        coreDNS: {}
        konnectivity: {}
