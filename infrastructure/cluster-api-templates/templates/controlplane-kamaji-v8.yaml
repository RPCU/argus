# -----------------------------------------------------------------------------
# Control plane template (KamajiControlPlane) — v8
#
# WHAT CHANGED vs -v7:
#   1. apiServer.extraArgs: added --event-ttl=30m (down from 1h default).
#      Events are the highest-churn resource in etcd; halving their retention
#      reduces both etcd space and apiserver watch-cache pressure.
#   2. apiServer.extraArgs: added --max-requests-inflight=200 (down from 400)
#      and --max-mutating-requests-inflight=100 (down from 200). Caps concurrent
#      in-flight requests to reduce peak memory from serialization/deserialization.
#   3. apiServer.extraArgs: added --profiling=false (removes pprof endpoints,
#      minor memory/CPU savings, security hardening).
#
# IMMUTABILITY: KamajiControlPlaneTemplate.spec.template.spec is immutable
# once referenced by a ClusterClass. To change anything here, create a NEW
# template with a bumped version suffix (e.g. -v9), point the ClusterClass
# controlPlane.templateRef at it, and let the topology controller reconcile.
# -----------------------------------------------------------------------------
apiVersion: controlplane.cluster.x-k8s.io/v1alpha2
kind: KamajiControlPlaneTemplate
metadata:
  name: openstack-kamaji-control-plane-v8
  namespace: mgmt
spec:
  template:
    spec:
      dataStoreName: default
      deployment:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      kamaji.clastix.io/component: deployment
                  topologyKey: kubernetes.io/hostname
      apiServer:
        extraArgs:
          - name: event-ttl
            value: "30m"
          - name: max-requests-inflight
            value: "200"
          - name: max-mutating-requests-inflight
            value: "100"
          - name: profiling
            value: "false"
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
      controllerManager:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
      scheduler:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
      kubelet:
        preferredAddressTypes:
          - InternalIP
          - ExternalIP
          - Hostname
      network:
        serviceType: LoadBalancer
      addons:
        coreDNS: {}
        konnectivity: {}
