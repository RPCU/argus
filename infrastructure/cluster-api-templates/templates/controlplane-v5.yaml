# -----------------------------------------------------------------------------
# Control plane template (KubeadmControlPlane) — v5.
#
# WHAT CHANGED vs -v4:
#   1. Removed --watch-cache-sizes=default=50 from apiServer.extraArgs.
#      This flag is NOT effective for CRDs — it only affects built-in resources
#      (pods, services, etc.). CRD watch cache sizes are hardcoded at 100 slots
#      per resource and cannot be changed via apiserver flags. The flag caused
#      the apiserver to crash-loop on startup with "invalid value of watch cache
#      size: default=50".
#
# v5 is otherwise identical to -v3 (which added ECDSA-P256). The -v4 template
# is kept for immutability — the live object cannot be edited.
#
# IMMUTABILITY: KubeadmControlPlaneTemplate.spec.template.spec is effectively
# immutable once referenced by a running ClusterClass. To change anything here,
# create a NEW template with a bumped version suffix (e.g. -v6), point the
# ClusterClass controlPlane.templateRef at it, and let the topology controller
# roll the control-plane machines. Never edit -v5 in place on a live cluster.
# -----------------------------------------------------------------------------
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: openstack-default-control-plane-v5
  namespace: mgmt
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          encryptionAlgorithm: ECDSA-P256
          apiServer:
            extraArgs:
              - name: kubelet-preferred-address-types
                value: "InternalIP,Hostname,ExternalIP"
          controllerManager:
            extraArgs:
              - name: node-monitor-grace-period
                value: 40s
              - name: node-monitor-period
                value: 5s
        initConfiguration:
          skipPhases:
            - addon/kube-proxy
          nodeRegistration:
            kubeletExtraArgs:
              - name: provider-id
                value: openstack:///'{{ instance_id }}'
              - name: kube-reserved
                value: cpu=200m,memory=768Mi,ephemeral-storage=2Gi
              - name: system-reserved
                value: cpu=200m,memory=768Mi,ephemeral-storage=2Gi
              - name: eviction-hard
                value: memory.available<500Mi,nodefs.available<10%,imagefs.available<10%,nodefs.inodesFree<5%
              - name: eviction-soft
                value: memory.available<1Gi,nodefs.available<15%,imagefs.available<15%
              - name: eviction-soft-grace-period
                value: memory.available=2m,nodefs.available=2m,imagefs.available=2m
              - name: eviction-max-pod-grace-period
                value: "60"
              - name: image-gc-high-threshold
                value: "80"
              - name: image-gc-low-threshold
                value: "65"
            name: "{{ local_hostname }}"
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              - name: provider-id
                value: openstack:///'{{ instance_id }}'
              - name: kube-reserved
                value: cpu=200m,memory=768Mi,ephemeral-storage=2Gi
              - name: system-reserved
                value: cpu=200m,memory=768Mi,ephemeral-storage=2Gi
              - name: eviction-hard
                value: memory.available<500Mi,nodefs.available<10%,imagefs.available<10%,nodefs.inodesFree<5%
              - name: eviction-soft
                value: memory.available<1Gi,nodefs.available<15%,imagefs.available<15%
              - name: eviction-soft-grace-period
                value: memory.available=2m,nodefs.available=2m,imagefs.available=2m
              - name: eviction-max-pod-grace-period
                value: "60"
              - name: image-gc-high-threshold
                value: "80"
              - name: image-gc-low-threshold
                value: "65"
            name: "{{ local_hostname }}"
