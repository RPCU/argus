# -----------------------------------------------------------------------------
# Control plane template (KubeadmControlPlane) — v6.
#
# WHAT CHANGED vs -v5:
#   1. apiServer.extraArgs: added --event-ttl=30m (down from 1h default).
#      Events are the highest-churn resource in etcd; halving their retention
#      reduces both etcd space and apiserver watch-cache pressure.
#   2. apiServer.extraArgs: added --max-requests-inflight=200 (down from 400)
#      and --max-mutating-requests-inflight=100 (down from 200). Caps concurrent
#      in-flight requests to reduce peak memory from serialization/deserialization.
#   3. apiServer.extraArgs: added --profiling=false (removes pprof endpoints,
#      minor memory/CPU savings, security hardening).
#
# IMMUTABILITY: KubeadmControlPlaneTemplate.spec.template.spec is effectively
# immutable once referenced by a running ClusterClass. To change anything here,
# create a NEW template with a bumped version suffix (e.g. -v7), point the
# ClusterClass controlPlane.templateRef at it, and let the topology controller
# roll the control-plane machines. Never edit -v6 in place on a live cluster.
# -----------------------------------------------------------------------------
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: openstack-default-control-plane-v6
  namespace: mgmt
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          encryptionAlgorithm: ECDSA-P256
          apiServer:
            extraArgs:
              - name: kubelet-preferred-address-types
                value: "InternalIP,Hostname,ExternalIP"
              - name: event-ttl
                value: "30m"
              - name: max-requests-inflight
                value: "200"
              - name: max-mutating-requests-inflight
                value: "100"
              - name: profiling
                value: "false"
          controllerManager:
            extraArgs:
              - name: node-monitor-grace-period
                value: 40s
              - name: node-monitor-period
                value: 5s
        initConfiguration:
          skipPhases:
            - addon/kube-proxy
          nodeRegistration:
            kubeletExtraArgs:
              - name: provider-id
                value: openstack:///'{{ instance_id }}'
              - name: kube-reserved
                value: cpu=200m,memory=768Mi,ephemeral-storage=2Gi
              - name: system-reserved
                value: cpu=200m,memory=768Mi,ephemeral-storage=2Gi
              - name: eviction-hard
                value: memory.available<500Mi,nodefs.available<10%,imagefs.available<10%,nodefs.inodesFree<5%
              - name: eviction-soft
                value: memory.available<1Gi,nodefs.available<15%,imagefs.available<15%
              - name: eviction-soft-grace-period
                value: memory.available=2m,nodefs.available=2m,imagefs.available=2m
              - name: eviction-max-pod-grace-period
                value: "60"
              - name: image-gc-high-threshold
                value: "80"
              - name: image-gc-low-threshold
                value: "65"
            name: "{{ local_hostname }}"
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              - name: provider-id
                value: openstack:///'{{ instance_id }}'
              - name: kube-reserved
                value: cpu=200m,memory=768Mi,ephemeral-storage=2Gi
              - name: system-reserved
                value: cpu=200m,memory=768Mi,ephemeral-storage=2Gi
              - name: eviction-hard
                value: memory.available<500Mi,nodefs.available<10%,imagefs.available<10%,nodefs.inodesFree<5%
              - name: eviction-soft
                value: memory.available<1Gi,nodefs.available<15%,imagefs.available<15%
              - name: eviction-soft-grace-period
                value: memory.available=2m,nodefs.available=2m,imagefs.available=2m
              - name: eviction-max-pod-grace-period
                value: "60"
              - name: image-gc-high-threshold
                value: "80"
              - name: image-gc-low-threshold
                value: "65"
            name: "{{ local_hostname }}"
