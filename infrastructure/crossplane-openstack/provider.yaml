apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-openstack
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            # Resource sizing from 72h Mimir history (max/P95): mem ~403/370Mi,
            # cpu ~42/31m. request ~= P95, mem limit ~= 2x max, CPU request-only
            # (no CPU limit — see AGENTS.md Section 8 rationale).
            - name: package-runtime
              # 72h Mimir (mgmt/openstack/production): P95 ~251Mi / max ~361Mi, CPU P95 ~24m.
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 768Mi
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-openstack
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-openstack:v0.10.0
  runtimeConfigRef:
    name: provider-openstack
---

