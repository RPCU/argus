args:
  - --enable-usages
  - --enable-realtime-compositions
# Sized from 72h Mimir across mgmt/openstack/production (req ≈ P95, limit ≈
# 2x max): core CPU P95 ~68m, mem P95 ~651Mi / max ~740Mi (2.5x the old 256Mi
# request); rbac-manager P95 ~34Mi / max ~40Mi. `cpu: null` drops the chart's
# 500m/100m CPU limits (request-only policy, §8).
resourcesCrossplane:
  requests:
    cpu: 70m
    memory: 656Mi
  limits:
    cpu: null
    memory: 1536Mi
resourcesRBACManager:
  requests:
    cpu: 5m
    memory: 48Mi
  limits:
    cpu: null
    memory: 192Mi
