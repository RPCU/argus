apiVersion: apps/v1
kind: Deployment
metadata:
  name: dike-controller-manager
  namespace: dike-system
  labels:
    app.kubernetes.io/name: dike
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dike
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dike
    spec:
      serviceAccountName: dike-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: zot.rpcu.io/public/dike:v0.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # 72h Mimir: mem P95 ~82Mi / max ~114Mi (89% of the old 128Mi
            # limit), CPU P95 ~1m. No CPU limit (request-only policy).
            limits:
              memory: 256Mi
            requests:
              cpu: 5m
              memory: 96Mi
      terminationGracePeriodSeconds: 10
