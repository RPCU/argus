installCRDs: true

# Sized from 72h Mimir P95/max across mgmt/openstack/production (req ≈ P95,
# limit ≈ 2× max, no CPU limit). Chart keys: top-level `resources` = controller,
# `webhook.resources`, `certController.resources` (a nested
# `resources.controller` map is NOT a chart key — it was silently dropped,
# leaving every ESO pod BestEffort).
resources:
  requests:
    cpu: 5m
    memory: 80Mi
  limits:
    memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 5m
      memory: 96Mi
    limits:
      memory: 256Mi
certController:
  resources:
    requests:
      cpu: 5m
      memory: 80Mi
    limits:
      memory: 256Mi
