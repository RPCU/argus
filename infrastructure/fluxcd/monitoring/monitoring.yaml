# Headless Service + ServiceMonitor for Flux controller metrics.
#
# The Flux Operator creates individual Deployments for each controller
# (source-controller, kustomize-controller, helm-controller,
# notification-controller), all exposing metrics on container port 8080.
# There is no single combined Service, so we create a headless Service that
# selects all Flux pods via the standard label and a ServiceMonitor in the
# monitoring namespace that scrapes it.
#
# kube-prometheus-stack's default serviceMonitorSelector is
# matchLabels: { release: kube-prometheus-stack } — the label on the
# ServiceMonitor ensures it is picked up. On the openstack cluster the
# selector is allow-by-default (NotIn), so any ServiceMonitor is scraped.
#
# WHY THIS LIVES IN ITS OWN PATH (split out of ./infrastructure/fluxcd/operator):
# The ServiceMonitor kind is a CRD owned by the Prometheus Operator, which ships
# ONLY with the kube-prometheus-stack (the `monitoring` add-on). The Flux
# operator base is pushed to EVERY workload cluster by the mandatory
# `flux-instance` spine (infrastructure/sveltos/clusterprofiles/flux.yaml), most
# of which do NOT run kube-prometheus-stack. Shipping the ServiceMonitor there
# would hard-fail the apply with `no matches for kind "ServiceMonitor"`.
#
# So this Service + ServiceMonitor is deployed ONLY where the CRD exists:
#   - mgmt      (clusters/mgmt/flux-operator.yaml, via ../monitoring)
#   - openstack (clusters/openstack/flux-operator.yaml, via ../monitoring)
#   - workload clusters that OPT INTO monitoring (the `monitoring` Sveltos
#     ClusterProfile pushes this path once kube-prometheus-stack is present).
apiVersion: v1
kind: Service
metadata:
  name: flux-metrics
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: flux
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flux-controllers
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
