apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: flux-operator
      version: "0.61.0"
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Sized from 72h Mimir P95/max across mgmt/openstack/production: mem P95
    # ~258Mi / max ~292Mi (the 64Mi request was 4x under), CPU P95 ~8m.
    # req ≈ P95, limit ≈ 2x max; the chart's default 2000m CPU limit is nulled
    # (CPU request-only policy, §8).
    resources:
      requests:
        cpu: 10m
        memory: 272Mi
      limits:
        cpu: null
        memory: 640Mi
