apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: flux-operator
      version: "0.59.0"
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Right-sized CPU request to reclaim worker budget on the 2-worker mgmt
    # fleet (chart default 100m). Measured P95 ~11m / peak ~45m (Mimir, 3d).
    # CPU request-only; memory left at chart default.
    resources:
      requests:
        cpu: 30m
        memory: 64Mi
