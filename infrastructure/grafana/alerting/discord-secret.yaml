# Discord webhook URL for Grafana alerting, sourced from the mgmt Vault.
#
# The `vault-backend` ClusterSecretStore is defined in
# `clusters/mgmt/crossplane/vault/vault-store.yaml` and is scoped to the
# `secrets-mgmt` KV-v2 mount, so `remoteRef.key` is the path RELATIVE to that
# mount (ESO inserts the `/data/` segment for KV-v2 itself).
#
# Seed the value once, out of band:
#
#   kubectl -n vault exec -it vault-0 -- \
#     vault kv put secrets-mgmt/grafana \
#     discord-webhook-url="https://discord.com/api/webhooks/<id>/<token>"
#
# IMPORTANT: the Vault Kubernetes-auth role `external-secrets` is bound to the
# `crossplane` policy, which only grants read on `secrets-mgmt/data/crossplane*`.
# A `grafana` policy must be created and attached to that role or this
# ExternalSecret fails with a 403 — see `infrastructure/vault/README.md`
# ("Grafana alerting bootstrap").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-discord-webhook
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: grafana
        property: discord-webhook-url
