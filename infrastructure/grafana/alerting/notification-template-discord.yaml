# Custom Discord notification template for Grafana unified alerting.
#
# Replaces the verbose default Grafana template with a structured, readable format:
#   Title:  🔥 FIRING / ✅ RESOLVED — AlertName (cluster)
#   Body:   alert count summary, then per-alert blockquoted summary + description,
#           with Grafana dashboard and panel deep-links for each.
#
# Multi-alert groups show a count header (e.g. "3 alerts — 2 firing · 1 resolved")
# followed by each alert individually. Single-alert groups skip the header.
#
# The template data model (per Grafana docs):
#   .Alerts[]  — each alert has .Status, .Labels, .Annotations, .DashboardURL, .PanelURL
#   .GroupLabels — labels used for grouping (alertname, cluster, grafana_folder)
#
# Referenced from contactpoint-discord.yaml via:
#   title:   '{{ template "discord.title" . }}'
#   message: '{{ template "discord.message" . }}'
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationTemplate
metadata:
  name: discord-custom
  namespace: monitoring
spec:
  name: discord-custom
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana-central
  template: |
    {{define "discord.title" -}}
    {{- $firing := false -}}
    {{- range .Alerts -}}{{- if eq .Status "firing" -}}{{- $firing = true -}}{{- end -}}{{- end -}}
    {{- if $firing -}}🔥 FIRING{{ else -}}✅ RESOLVED{{ end -}} — {{ (index .Alerts 0).Labels.alertname }}{{ if (index .Alerts 0).Labels.cluster }} ({{ (index .Alerts 0).Labels.cluster }}){{ end }}
    {{- end}}

    {{define "discord.message" -}}
    {{- if gt (len .Alerts) 1 -}}
    **{{ len .Alerts }} alerts in this group**
    {{ end -}}
    {{- range .Alerts -}}
    {{- if eq .Status "firing" -}}
    > 🔴 **{{ .Annotations.summary }}**
    > {{ .Annotations.description }}
    {{- else -}}
    > ✅ **{{ .Annotations.summary }}**
    > {{ .Annotations.description }}
    {{- end -}}
    {{ end -}}
    {{- $first := index .Alerts 0 -}}
    {{- if $first.DashboardURL }}
    {{ "" }}
    [📊 **View in Grafana**]({{ $first.DashboardURL }})
    {{- end -}}
    {{- if $first.PanelURL }}
    [📐 **View panel**]({{ $first.PanelURL }})
    {{- end -}}
    {{- end}}
