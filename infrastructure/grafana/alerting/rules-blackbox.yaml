# Blackbox probe alert rules: URL down for >30 minutes.
#
# These are Grafana-MANAGED alerts (evaluated by Grafana against the Mimir
# datasource), following the same three-stage pattern as rules-node.yaml:
#   A -> instant PromQL: probe_success per target
#   B -> reduce(last): collapse to a single value
#   C -> threshold: fire if value < 1 (down)
#
# Because the queries run against Mimir with the cluster external label,
# ONE rule covers every cluster that remote_writes into it.
#
# noDataState is OK: if probe data is missing entirely (Mimir issue, no
# remote_write), we don't want a storm of alerts.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: blackbox-probes
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folderRef: alerts
  interval: 1m
  rules:
    - uid: argus-blackbox-url-down
      title: BlackboxURLDown
      condition: C
      for: "30m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: blackbox
      annotations:
        summary: "URL down: {{ $labels.instance }} ({{ $labels.cluster }})"
        description: "Probe target {{ $labels.instance }} in cluster {{ $labels.cluster }} has been unreachable (probe_success=0) for more than 30 minutes."
        __dashboardUid__: blackbox-status
        __panelId__: "12"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: probe_success{job="blackbox"}
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: lt
                  params:
                    - 1
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
