# cert-manager certificate expiry alert rules.
#
# These are Grafana-MANAGED alerts (evaluated by Grafana against the Mimir
# datasource), not Prometheus PrometheusRule CRs. Same rationale as all other
# rules in this directory: Mimir's ruler is disabled and the local Alertmanager
# is disabled, so Grafana unified alerting is the only delivery path.
#
# Requires cert-manager Prometheus metrics enabled in the cert-manager
# HelmRelease values (infrastructure/cert-manager/values.yaml):
#   prometheus.enabled: true
#
# The cert-manager chart creates a ServiceMonitor on port 9402 (/metrics)
# automatically. kube-prometheus-stack's default serviceMonitorSelector
# (allow-all) picks it up without extra configuration.
#
# Alert on renewal FAILURE, not proximity to expiry. cert-manager auto-renews
# at certmanager_certificate_renewal_timestamp_seconds (~2/3 lifetime); a cert
# being "close to expiry" is the normal steady state for short-lived certs (90d
# certs sit <20% lifetime for ~9d before rolling), so the old <20%/<10%-lifetime
# rules false-fired every cycle. Warning = renewal overdue; Critical = renewal
# overdue AND <10% lifetime left. Expressions use plain vector arithmetic on
# same-label metrics so namespace/name/issuer_*/cluster survive (the old
# label_join(... and on ...) stripped them, breaking every {{ $labels.* }}).
#
# DO NOT add a `cluster=~"$cluster"` selector — Grafana alert rules have no
# dashboard template variables (see rules-flux.yaml).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: certmanager-certificates
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folderRef: alerts
  interval: 5m
  rules:
    # CRITICAL: renewal overdue AND <10% lifetime left. A emits days-remaining
    # (B → $values.B.Value) only for certs matching both filters.
    - uid: argus-cert-expiring-7d
      title: CertManagerExpiringCritical
      condition: C
      for: "15m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: critical
        component: cert-manager
      annotations:
        summary: "Certificate {{ $labels.name }} expiring & renewal overdue ({{ $labels.cluster }})"
        description: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} (issuer: {{ $labels.issuer_kind }}/{{ $labels.issuer_name }}) in cluster {{ $labels.cluster }} has {{ printf "%.1f" $values.B.Value }} days remaining, cert-manager renewal is OVERDUE, and it is within the last 10% of its lifetime. Immediate action required — clients will reject this cert. Check the Issuer and the Certificate/CertificateRequest status.'
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: |
              (
                (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400
              )
              and (
                time() - certmanager_certificate_renewal_timestamp_seconds > 0
              )
              and (
                (certmanager_certificate_expiration_timestamp_seconds - time())
                /
                (certmanager_certificate_expiration_timestamp_seconds
                  - certmanager_certificate_not_before_timestamp_seconds)
                < 0.10
              )
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: "{{ namespace }}/{{ name }}"
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            # B exists only when both filters match, so any value ⇒ fire.
            conditions:
              - evaluator:
                  type: lt
                  params:
                    - 100000
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # WARNING: cert-manager renewal is overdue (time() past renewal_timestamp).
    # A healthy cert resets this into the future on every rotation, so this only
    # fires when renewal has genuinely failed. A emits days-remaining until
    # actual expiry, filtered to overdue certs.
    - uid: argus-cert-expiring-30d
      title: CertManagerRenewalOverdue
      condition: C
      for: "6h"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: cert-manager
      annotations:
        summary: "Certificate {{ $labels.name }} renewal overdue ({{ $labels.cluster }})"
        description: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} (issuer: {{ $labels.issuer_kind }}/{{ $labels.issuer_name }}) in cluster {{ $labels.cluster }} is past its cert-manager renewal time and has {{ printf "%.1f" $values.B.Value }} days remaining. Renewal has not completed — check the Issuer and the Certificate/CertificateRequest status.'
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: |
              (
                (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400
              )
              and (
                time() - certmanager_certificate_renewal_timestamp_seconds > 0
              )
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: "{{ namespace }}/{{ name }}"
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            # B exists only for overdue certs, so any value ⇒ fire.
            conditions:
              - evaluator:
                  type: lt
                  params:
                    - 100000
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when a certificate has been in Ready=False state for > 30 minutes.
    # A cert that is not ready is either failing issuance, failing renewal,
    # or has a conditions mismatch. This is distinct from expiry — a cert
    # can be far from expiry but stuck unready (e.g. DNS01 challenge failing,
    # issuer degraded).
    - uid: argus-cert-not-ready
      title: CertManagerCertificateNotReady
      condition: C
      for: "30m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: cert-manager
      annotations:
        summary: "Certificate {{ $labels.name }} not ready ({{ $labels.cluster }})"
        description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} in cluster {{ $labels.cluster }} has been in Ready=False state for 30 minutes. Check cert-manager logs and certificate status conditions."
      data:
        - refId: A
          relativeTimeRange:
            from: 900
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: certmanager_certificate_ready_status{condition="True"} == 0
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
