# cert-manager certificate expiry alert rules.
#
# These are Grafana-MANAGED alerts (evaluated by Grafana against the Mimir
# datasource), not Prometheus PrometheusRule CRs. Same rationale as all other
# rules in this directory: Mimir's ruler is disabled and the local Alertmanager
# is disabled, so Grafana unified alerting is the only delivery path.
#
# Requires cert-manager Prometheus metrics enabled in the cert-manager
# HelmRelease values (infrastructure/cert-manager/values.yaml):
#   prometheus.enabled: true
#
# The cert-manager chart creates a ServiceMonitor on port 9402 (/metrics)
# automatically. kube-prometheus-stack's default serviceMonitorSelector
# (allow-all) picks it up without extra configuration.
#
# Key metrics:
#   certmanager_certificate_expiration_timestamp_seconds
#     - Unix timestamp of the certificate's NotAfter field
#     - Labels: namespace, name, issuer_kind, issuer_name, condition, ready
#   certmanager_certificate_not_before_timestamp_seconds
#     - Unix timestamp of the certificate's NotBefore (issuance) field
#     - Labels: namespace, name, issuer_kind, issuer_name, condition, ready
#
# Expiry rules use PERCENTAGE-OF-LIFETIME thresholds, not fixed day counts.
# This avoids false alerts on short-lived certs (e.g. 72h duration certs that
# would fire a 30d warning immediately). The percentage is computed as:
#   (remaining_seconds / total_lifetime_seconds) * 100
# where total_lifetime = not_after - not_before.
#
# Thresholds:
#   Critical: <10% of lifetime remaining
#   Warning:  <20% of lifetime remaining
#
# DO NOT add a `cluster=~"$cluster"` selector to these expressions. Grafana
# alert rules have NO dashboard template variables — see rules-flux.yaml for
# the full explanation.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: certmanager-certificates
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folderRef: alerts
  interval: 5m
  rules:
    # Fires when <10% of the certificate's total lifetime remains.
    # Uses certmanager_certificate_not_before_timestamp_seconds to compute
    # the total duration (not_after - not_before), so the threshold scales
    # with every cert regardless of its configured duration.
    # Example: 72h cert → fires at ~7.2h remaining; 90d cert → fires at ~9d.
    - uid: argus-cert-expiring-7d
      title: CertManagerCertificateExpiringCritical
      condition: C
      for: "5m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: critical
        component: cert-manager
      annotations:
        summary: "Certificate {{ $labels.name }} expiring — <10% lifetime left ({{ $labels.cluster }})"
        description: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} (issuer: {{ $labels.issuer_kind }}/{{ $labels.issuer_name }}) in cluster {{ $labels.cluster }} has {{ printf "%.0f" (divf $values.B.Value 86400) }} days remaining (<10% of its lifetime). Immediate action required — clients will reject this cert.'
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: |
              label_join(
                (certmanager_certificate_expiration_timestamp_seconds - time())
                /
                (certmanager_certificate_expiration_timestamp_seconds
                  - certmanager_certificate_not_before_timestamp_seconds)
                * 100,
                "join_key", "/", "namespace", "name"
              )
              and on(join_key)
              label_join(
                (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400,
                "join_key", "/", "namespace", "name"
              )
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: "{{ namespace }}/{{ name }}"
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: lt
                  params:
                    - 10
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when <20% of the certificate's total lifetime remains.
    # Warning threshold — enough time to investigate and renew before it
    # becomes critical. cert-manager should auto-renew well before this,
    # so a firing rule here usually means the issuer is broken or the
    # Certificate resource is misconfigured.
    # Example: 72h cert → fires at ~14.4h remaining; 90d cert → fires at ~18d.
    - uid: argus-cert-expiring-30d
      title: CertManagerCertificateExpiringWarning
      condition: C
      for: "5m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: cert-manager
      annotations:
        summary: "Certificate {{ $labels.name }} expiring — <20% lifetime left ({{ $labels.cluster }})"
        description: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} (issuer: {{ $labels.issuer_kind }}/{{ $labels.issuer_name }}) in cluster {{ $labels.cluster }} has {{ printf "%.0f" (divf $values.B.Value 86400) }} days remaining (<20% of its lifetime). Check cert-manager renewal status.'
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: |
              label_join(
                (certmanager_certificate_expiration_timestamp_seconds - time())
                /
                (certmanager_certificate_expiration_timestamp_seconds
                  - certmanager_certificate_not_before_timestamp_seconds)
                * 100,
                "join_key", "/", "namespace", "name"
              )
              and on(join_key)
              label_join(
                (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400,
                "join_key", "/", "namespace", "name"
              )
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: "{{ namespace }}/{{ name }}"
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: lt
                  params:
                    - 20
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when a certificate has been in Ready=False state for > 30 minutes.
    # A cert that is not ready is either failing issuance, failing renewal,
    # or has a conditions mismatch. This is distinct from expiry — a cert
    # can be far from expiry but stuck unready (e.g. DNS01 challenge failing,
    # issuer degraded).
    - uid: argus-cert-not-ready
      title: CertManagerCertificateNotReady
      condition: C
      for: "30m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: cert-manager
      annotations:
        summary: "Certificate {{ $labels.name }} not ready ({{ $labels.cluster }})"
        description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} in cluster {{ $labels.cluster }} has been in Ready=False state for 30 minutes. Check cert-manager logs and certificate status conditions."
      data:
        - refId: A
          relativeTimeRange:
            from: 900
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: certmanager_certificate_ready_status{condition="True"} == 0
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
