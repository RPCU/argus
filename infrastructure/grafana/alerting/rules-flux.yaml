# Flux GitOps alert rules: reconciliation errors, timeouts, controller health,
# and Ready/Suspended status from kube-state-metrics.
#
# These are Grafana-MANAGED alerts (evaluated by Grafana against the Mimir
# datasource), not Prometheus PrometheusRule CRs. Same rationale as all other
# rules in this directory: Mimir's ruler is disabled and each cluster's local
# Alertmanager has no receivers configured, so Grafana unified alerting is the
# only delivery path.
#
# Uses kube-state-metrics customResourceState metrics (gotk_resource_info) for
# Ready/Suspended status, plus the native controller metrics for timing and
# error rates.
#
# Requires kube-state-metrics customResourceState enabled in the
# kube-prometheus-stack HelmRelease (infrastructure/monitoring/helmrelease.yaml).
# See: https://fluxcd.io/flux/monitoring/custom-metrics/
#
# Every expression below was executed against live Mimir before commit.
#
# DO NOT add a `cluster=~"$cluster"` selector to these expressions. Grafana
# alert rules have NO dashboard template variables — `$cluster` is only
# substituted in dashboard panels. In an alert query it stays LITERAL, so
# `cluster=~"$cluster"` matches zero series → every query returns empty → the
# rule evaluates NoData → with `noDataState: OK` the alert is silently
# suppressed and NEVER fires. This is exactly the bug that let crossplane-vault
# / crossplane-zitadel sit Ready=False for hours with no Discord alert. The
# rules already emit `cluster` as an output label via `by (cluster, ...)`, so
# per-cluster context is preserved without the selector. (The other rule files
# in this directory correctly omit `$cluster` — this file was the only one that
# copied it over from the dashboard queries.)
#
# Panel linking: rules carry __dashboardUid__ / __panelId__ annotations
# (both required, __panelId__ must be a quoted string).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: flux-reconciliations
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folderRef: alerts
  interval: 1m
  rules:
    # Fires when ANY Flux controller reports reconciliation errors.
    # controller_runtime_reconcile_total{result="error"} is incremented
    # on every failed reconcile loop.
    - uid: argus-flux-recon-errors
      title: FluxReconciliationErrors
      condition: C
      for: "5m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: critical
        component: flux
      annotations:
        summary: "Flux reconciliation errors on {{ $labels.cluster }}"
        description: 'Flux controller {{ $labels.controller }} in cluster {{ $labels.cluster }} is experiencing reconciliation errors at {{ printf "%.2f" $values.B.Value }}/s for the past 5 minutes.'
        __dashboardUid__: fluxcd-status
        __panelId__: "8"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: sum by (cluster) (rate(controller_runtime_reconcile_total{result="error"}[5m]))
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when a Flux controller accumulates reconcile timeouts.
    # controller_runtime_reconcile_timeouts_total is cumulative; any
    # increase means a reconcile loop exceeded the timeout.
    - uid: argus-flux-recon-timeouts
      title: FluxReconciliationTimeouts
      condition: C
      for: "10m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: flux
      annotations:
        summary: "Flux reconciliation timeouts on {{ $labels.cluster }}"
        description: 'Flux controller {{ $labels.controller }} in cluster {{ $labels.cluster }} is experiencing reconciliation timeouts at {{ printf "%.2f" $values.B.Value }}/s for the past 10 minutes.'
        __dashboardUid__: fluxcd-status
        __panelId__: "9"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: sum by (cluster) (rate(controller_runtime_reconcile_timeouts_total[5m]))
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when the error rate exceeds 50% of total reconcile rate for a
    # controller. A controller that is mostly failing is effectively broken.
    - uid: argus-flux-high-error-rate
      title: FluxControllerHighErrorRate
      condition: C
      for: "10m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: critical
        component: flux
      annotations:
        summary: "Flux {{ $labels.controller }} high error rate ({{ $labels.cluster }})"
        description: "Flux controller {{ $labels.controller }} in cluster {{ $labels.cluster }} has an error rate above 50% of total reconciliations for the past 10 minutes."
        __dashboardUid__: fluxcd-status
        __panelId__: "8"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: sum by (cluster, controller) (rate(controller_runtime_reconcile_total{result="error"}[5m])) / sum by (cluster, controller) (rate(controller_runtime_reconcile_total[5m])) > 0
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0.5
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when a previously-reconciling resource stops getting
    # reconciled for > 1 hour. Uses the absence of increase in
    # gotk_reconcile_duration_seconds_count as a proxy for "stuck".
    - uid: argus-flux-resource-stale
      title: FluxResourceStale
      condition: C
      for: "1h"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: flux
      annotations:
        summary: "Flux resource {{ $labels.name }} stale ({{ $labels.cluster }})"
        description: "{{ $labels.kind }}/{{ $labels.name }} in namespace {{ $labels.exported_namespace }} on cluster {{ $labels.cluster }} has had zero reconciliations for 1 hour. If this resource normally reconciles periodically, it may be stuck."
        __dashboardUid__: fluxcd-status
        __panelId__: "16"
      data:
        - refId: A
          relativeTimeRange:
            from: 3600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: increase(gotk_reconcile_duration_seconds_count[1h]) == 0
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: count
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when a Flux resource reports Ready=False via kube-state-metrics.
    # This is a direct signal from the Flux CR status conditions, not a proxy
    # based on reconcile error rates. Requires KSM customResourceState enabled.
    # NOTE: `for` is 1h5m (not 10m) deliberately. All HelmRepository sources
    # poll upstream at 1h (external/API load reduction). When a Renovate PR bumps
    # a HelmRelease chart version and is merged, the new version is not present in
    # the HelmRepository index cache until the next 1h refresh, so the HelmChart
    # (and its HelmRelease) legitimately sits Ready=False for up to ~1h. A 10m
    # window would ring this critical alert on every such merge. 1h5m gives the
    # source refresh (worst-case 1h) time to land before alerting. Tradeoff: a
    # genuinely-stuck Ready=False resource now takes 65m to alert instead of 10m.
    - uid: argus-flux-not-ready
      title: FluxResourceNotReady
      condition: C
      for: "1h5m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: critical
        component: flux
      annotations:
        summary: "Flux {{ $labels.customresource_kind }}/{{ $labels.name }} not ready ({{ $labels.cluster }})"
        description: "{{ $labels.customresource_kind }}/{{ $labels.name }} in namespace {{ $labels.exported_namespace }} on cluster {{ $labels.cluster }} has been in Ready=False state for over 1 hour."
        __dashboardUid__: fluxcd-status
        __panelId__: "12"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: count by (cluster, customresource_kind, exported_namespace, name) (gotk_resource_info{ready="False"})
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
