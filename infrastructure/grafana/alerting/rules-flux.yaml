# Flux GitOps alert rules: reconciliation errors, timeouts, controller health,
# and Ready/Suspended status from kube-state-metrics.
#
# These are Grafana-MANAGED alerts (evaluated by Grafana against the Mimir
# datasource), not Prometheus PrometheusRule CRs. Same rationale as all other
# rules in this directory: Mimir's ruler is disabled and each cluster's local
# Alertmanager has no receivers configured, so Grafana unified alerting is the
# only delivery path.
#
# Uses kube-state-metrics customResourceState metrics (gotk_resource_info) for
# Ready/Suspended status, plus the native controller metrics for timing and
# error rates.
#
# Requires kube-state-metrics customResourceState enabled in the
# kube-prometheus-stack HelmRelease (infrastructure/monitoring/helmrelease.yaml).
# See: https://fluxcd.io/flux/monitoring/custom-metrics/
#
# Every expression below was executed against live Mimir before commit.
#
# Panel linking: rules carry __dashboardUid__ / __panelId__ annotations
# (both required, __panelId__ must be a quoted string).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: flux-reconciliations
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folderRef: alerts
  interval: 1m
  rules:
    # Fires when ANY Flux controller reports reconciliation errors.
    # controller_runtime_reconcile_total{result="error"} is incremented
    # on every failed reconcile loop.
    - uid: argus-flux-recon-errors
      title: FluxReconciliationErrors
      condition: C
      for: "5m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: critical
        component: flux
      annotations:
        summary: "Flux reconciliation errors on {{ $labels.cluster }}"
        description: 'Flux controller {{ $labels.controller }} in cluster {{ $labels.cluster }} is experiencing reconciliation errors at {{ printf "%.2f" $values.B.Value }}/s for the past 5 minutes.'
        __dashboardUid__: fluxcd-status
        __panelId__: "8"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: sum by (cluster) (rate(controller_runtime_reconcile_total{cluster=~"$cluster", result="error"}[5m]))
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when a Flux controller accumulates reconcile timeouts.
    # controller_runtime_reconcile_timeouts_total is cumulative; any
    # increase means a reconcile loop exceeded the timeout.
    - uid: argus-flux-recon-timeouts
      title: FluxReconciliationTimeouts
      condition: C
      for: "10m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: flux
      annotations:
        summary: "Flux reconciliation timeouts on {{ $labels.cluster }}"
        description: 'Flux controller {{ $labels.controller }} in cluster {{ $labels.cluster }} is experiencing reconciliation timeouts at {{ printf "%.2f" $values.B.Value }}/s for the past 10 minutes.'
        __dashboardUid__: fluxcd-status
        __panelId__: "9"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: sum by (cluster) (rate(controller_runtime_reconcile_timeouts_total{cluster=~"$cluster"}[5m]))
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when the error rate exceeds 50% of total reconcile rate for a
    # controller. A controller that is mostly failing is effectively broken.
    - uid: argus-flux-high-error-rate
      title: FluxControllerHighErrorRate
      condition: C
      for: "10m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: critical
        component: flux
      annotations:
        summary: "Flux {{ $labels.controller }} high error rate ({{ $labels.cluster }})"
        description: "Flux controller {{ $labels.controller }} in cluster {{ $labels.cluster }} has an error rate above 50% of total reconciliations for the past 10 minutes."
        __dashboardUid__: fluxcd-status
        __panelId__: "8"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: sum by (cluster, controller) (rate(controller_runtime_reconcile_total{cluster=~"$cluster", result="error"}[5m])) / sum by (cluster, controller) (rate(controller_runtime_reconcile_total{cluster=~"$cluster"}[5m])) > 0
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0.5
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when a previously-reconciling resource stops getting
    # reconciled for > 1 hour. Uses the absence of increase in
    # gotk_reconcile_duration_seconds_count as a proxy for "stuck".
    - uid: argus-flux-resource-stale
      title: FluxResourceStale
      condition: C
      for: "1h"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: flux
      annotations:
        summary: "Flux resource {{ $labels.name }} stale ({{ $labels.cluster }})"
        description: "{{ $labels.kind }}/{{ $labels.name }} in namespace {{ $labels.exported_namespace }} on cluster {{ $labels.cluster }} has had zero reconciliations for 1 hour. If this resource normally reconciles periodically, it may be stuck."
        __dashboardUid__: fluxcd-status
        __panelId__: "16"
      data:
        - refId: A
          relativeTimeRange:
            from: 3600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: increase(gotk_reconcile_duration_seconds_count{cluster=~"$cluster"}[1h]) == 0
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: count
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # Fires when a Flux resource reports Ready=False via kube-state-metrics.
    # This is a direct signal from the Flux CR status conditions, not a proxy
    # based on reconcile error rates. Requires KSM customResourceState enabled.
    - uid: argus-flux-not-ready
      title: FluxResourceNotReady
      condition: C
      for: "10m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: critical
        component: flux
      annotations:
        summary: "Flux {{ $labels.customresource_kind }}/{{ $labels.name }} not ready ({{ $labels.cluster }})"
        description: "{{ $labels.customresource_kind }}/{{ $labels.name }} in namespace {{ $labels.exported_namespace }} on cluster {{ $labels.cluster }} has been in Ready=False state for 10 minutes."
        __dashboardUid__: fluxcd-status
        __panelId__: "12"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: count by (cluster, customresource_kind, exported_namespace, name) (gotk_resource_info{cluster=~"$cluster", ready="False"})
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
