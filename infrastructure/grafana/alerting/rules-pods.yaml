# Pod / workload alert rules: CrashLoopBackOff, OOMKilled, not-ready, restart storms.
#
# Grafana-MANAGED alerts (evaluated by Grafana against Mimir), same rationale as
# rules-node.yaml: Mimir's ruler is disabled and the local Alertmanager is
# disabled, so Grafana unified alerting is the only path that delivers a Discord
# notification. Because the queries run against Mimir,
# ONE rule set covers every cluster that remote_writes in (mgmt, openstack,
# production) — the `cluster` external label comes back as an alert label
# automatically, so grouping/routing is per-cluster with no per-cluster CRs.
#
# Standard three-stage shape (A instant query -> B reduce(last) -> C threshold,
# condition: C). noDataState is OK on purpose across the board: at steady state
# a healthy cluster emits NO CrashLoopBackOff series and NO positive restart
# rate, so the query legitimately returns empty. Treating empty as OK (not
# NoData) is what keeps a healthy fleet quiet instead of firing DatasourceNoData.
#
# Backing metrics (kube-state-metrics), all verified present in Mimir and NOT
# dropped by the monitoring base's cardinality relabeling:
#   kube_pod_container_status_waiting_reason{reason,namespace,pod,container,cluster}
#       — emitted ONLY while a container is actually waiting for that reason, so
#         `{reason="CrashLoopBackOff"}` appears exactly when a crash loop starts
#         and disappears when it clears. This is why the rule must key on it
#         directly rather than on `waiting == 1` (that name has no reason label).
#   kube_pod_container_status_restarts_total{...}  — cumulative restart counter.
#   kube_pod_container_status_ready / running      — 1/0 per container.
#   kube_pod_status_phase{phase}                   — Running/Pending/Succeeded/Failed.
#         Pods in Succeeded or Failed phase are excluded (completed workloads).
#
# Namespace scope: these are cluster-wide on purpose (a CrashLoopBackOff in ANY
# namespace is worth a page), but kube-system/CNI churn is not special-cased —
# if a noisy namespace needs muting later, add an object_matcher route in
# notification-policy.yaml rather than narrowing the query here.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: pod-health
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folderRef: alerts
  interval: 1m
  rules:
    # ---------------------------------------------------------------------
    # CrashLoopBackOff — the headline ask. Fires when a container has been
    # sitting in CrashLoopBackOff for 15m. Per-container series, so grouping in
    # notification-policy.yaml (by alertname+cluster) collapses a multi-pod
    # crash into one Discord message per cluster.
    # ---------------------------------------------------------------------
    - uid: argus-pod-crashloop
      title: PodCrashLoopBackOff
      condition: C
      for: "15m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: critical
        component: workload
      annotations:
        __dashboardUid__: cluster-cpu-ram-overview
        __panelId__: "10"
        summary: "CrashLoopBackOff: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }})"
        description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} on cluster {{ $labels.cluster }} has been in CrashLoopBackOff for 15m. Check `kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous`."
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: max by (cluster, namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"})
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # ---------------------------------------------------------------------
    # OOMKilled — fires when a container's last termination reason was OOM.
    # kube_pod_container_status_last_terminated_reason persists after restart,
    # so this catches both currently-OOMKilled containers and those that
    # recovered but were recently killed. A single OOM kill on a critical pod
    # (Vault, etcd, OVN) is worth a warning; a repeat will also trip the
    # PodRestartingFrequently rule below.
    # ---------------------------------------------------------------------
    - uid: argus-pod-oomkilled
      title: PodOOMKilled
      condition: C
      for: "0m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: workload
      annotations:
        __dashboardUid__: cluster-cpu-ram-overview
        __panelId__: "14"
        summary: "OOMKilled: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }})"
        description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} on cluster {{ $labels.cluster }} was OOM-killed. Its memory working set exceeded the container limit. Consider raising the memory limit or profiling the container's usage."
      data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: max by (cluster, namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"})
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # ---------------------------------------------------------------------
    # High restart rate — catches a container that keeps dying and restarting
    # but never dwells in CrashLoopBackOff long enough to trip the rule above
    # (e.g. probe-kill loops on the hyperconverged nodes — the documented OVN
    # ovsdb / PowerDNS-Galera failure signature). >=3 restarts in 15m.
    # ---------------------------------------------------------------------
    - uid: argus-pod-restarting
      title: PodRestartingFrequently
      condition: C
      for: "20m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: workload
      annotations:
        __dashboardUid__: cluster-cpu-ram-overview
        __panelId__: "10"
        summary: "Frequent restarts: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }})"
        description: 'Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} on cluster {{ $labels.cluster }} restarted {{ printf "%.0f" $values.B.Value }} times in the last 15m. On the openstack cluster this is usually a starvation-induced probe-kill loop — correlate with node CPU.'
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: sum by (cluster, namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m]))
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 3
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C

    # ---------------------------------------------------------------------
    # Container not ready — a container that is NOT ready for 30m without
    # necessarily crash-looping (stuck init, failing readiness, wedged
    # dependency). Completed/failed pods are excluded: they go NotReady on
    # normal completion or after final termination, which is not a fault.
    # Uses the raw ready metric with a lt threshold (NOT `== 0`) so the
    # series always has data and NoData==OK holds.
    #
    # Uses `and on` (set intersection) rather than `* on ... group_left`
    # to filter to Running/Pending pods — avoids a PromQL parse ambiguity
    # where the parser interprets the `(` of the RHS vector as a
    # group_left label list. Semantically identical: `and` keeps left-side
    # series where a matching right-side series exists.
    #
    # Containers in Waiting state are excluded via `unless
    # kube_pod_container_status_waiting_reason` because:
    # - Init containers before completion: not ready is expected, not a fault
    # - Containers waiting to start during rolling updates: transitional state
    # - CrashLoopBackOff: already covered by the dedicated PodCrashLoopBackOff
    #   alert, so excluding it here avoids duplicate notifications
    #
    # Terminated containers (exit 0) are excluded via `unless
    # (kube_pod_container_status_terminated == 1)` because Jobs/CronJobs
    # and one-shot yaook tasks leave `ready=0` after normal completion.
    # The `phase=Succeeded` unless alone misses a race window where
    # kube-state-metrics still reports `phase=Running` after the container
    # has already terminated.
    # ---------------------------------------------------------------------
    - uid: argus-pod-not-ready
      title: PodContainerNotReady
      condition: C
      for: "30m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: workload
      annotations:
        __dashboardUid__: cluster-cpu-ram-overview
        __panelId__: "10"
        summary: "Container not ready: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }})"
        description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} on cluster {{ $labels.cluster }} has not been Ready for 30m."
      data:
        - refId: A
          relativeTimeRange:
            from: 900
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: |
              (
                min by (cluster, namespace, pod, container) (kube_pod_container_status_ready)
                and on (cluster, namespace, pod)
                (kube_pod_status_phase{phase=~"Running|Pending"} == 1)
              )
              unless on (cluster, namespace, pod, container)
              kube_pod_container_status_waiting_reason
              unless on (cluster, namespace, pod, container)
              (kube_pod_container_status_terminated == 1)
              unless on (cluster, namespace, pod)
              kube_pod_status_phase{phase="Succeeded"}
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: lt
                  params:
                    - 1
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
