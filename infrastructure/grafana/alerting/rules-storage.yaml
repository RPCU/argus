# Persistent volume alert rules.
#
# Split from `rules-node.yaml` because a GrafanaAlertRuleGroup has a single
# evaluation `interval` for all its rules, and volume stats are only refreshed
# by the kubelet roughly once a minute and move slowly — evaluating them every
# minute like node CPU would be wasted work.
#
# Backed by `kubelet_volume_stats_*`, which the monitoring base does NOT drop
# (unlike much of the apiserver/cAdvisor surface). Verified live against Mimir.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: persistent-volumes
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folderRef: alerts
  interval: 5m
  rules:
    - uid: argus-pvc-space-low
      title: PersistentVolumeSpaceLow
      condition: C
      for: "15m"
      noDataState: OK
      execErrState: Error
      labels:
        severity: warning
        component: storage
      annotations:
        summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} almost full ({{ $labels.cluster }})"
        description: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} in cluster {{ $labels.cluster }} is {{ printf "%.1f" $values.B.Value }}% full, above the 85% threshold for 15m.'
        # -> "PVC Fill Level - Used vs Capacity" on the PVC storage dashboard.
        # NOTE: that panel is a bargauge, so it gets the notification deep-link
        # and the alert-rule association, but NOT the on-panel alert-state
        # annotation markers — those only render on time series panels.
        __dashboardUid__: cluster-pvc-storage-overview
        __panelId__: "10"
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Mimir
          model:
            datasource:
              type: prometheus
              uid: Mimir
            editorMode: code
            expr: 100 * max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            legendFormat: __auto
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            type: reduce
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            type: threshold
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 85
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  type: last
                  params: []
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
