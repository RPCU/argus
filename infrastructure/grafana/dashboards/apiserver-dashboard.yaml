# GrafanaDashboard — API Server Health Dashboard.
#
# Comprehensive dashboard to identify anything that could hurt the apiserver:
# request storms, controller LIST amplification, admission webhooks, authentication
# failures, storage/etcd issues, expensive subresource calls, and namespace-level
# traffic.
#
# Uses apiserver_request_total (kept — not dropped by the cardinality trim in
# infrastructure/monitoring/helmrelease.yaml), apiserver_current_inflight_requests,
# apiserver_admission_webhook_admission_duration_seconds_* (kept), storage_*
# metrics, authentication_attempts, and apiserver_certificates_*.
#
# NOTE: per-resource request latency (P50/P95/P99) is NOT available because
# apiserver_request_duration_seconds_{bucket,sum,count} was dropped to save
# ~120k series. This dashboard focuses on request rates, errors, and concurrency.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: apiserver-health
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folder: "Monitoring"
  json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
