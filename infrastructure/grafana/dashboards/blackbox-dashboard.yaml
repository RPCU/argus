              "legendFormat": "{{ instance }} - {{ cluster }}",
              "range": false,
              "instant": true,
              "refId": "C",
              "format": "table"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "editorMode": "code",
              "expr": "probe_success{job=~\"$job\", cluster=~\"$cluster\"}",
              "legendFormat": "{{ instance }} - {{ cluster }}",
              "range": false,
              "instant": true,
              "refId": "D",
              "format": "table"
            }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            { "id": "organize", "options": {
              "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "Time 3": true, "Time 4": true, "__name__": true, "job": true, "job 1": true, "job 2": true, "job 3": true, "job 4": true, "probe": true, "mode": true, "region": true },
              "renameByName": {
                "instance": "Target",
                "cluster": "Cluster",
                "Value #A": "Availability %",
                "Value #B": "P95 (ms)",
                "Value #C": "P99 (ms)",
                "Value #D": "Status"
              }
            }}
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 8,
          "title": "Latency Over Time",
          "type": "row"
        },
