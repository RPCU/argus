# GrafanaDashboard — Blackbox HTTP Probe Status.
#
# Displays p95/p99 latency, availability, and probe success for all probed
# HTTPRoutes across every cluster. Data comes from blackbox-exporter Probe CRs
# scraped by each cluster's Prometheus and remote_written to Mimir.
#
# METRIC PROVENANCE — queries use standard blackbox-exporter metrics:
#   probe_success{job="blackbox"}              1/0 per target
#   probe_duration_seconds_bucket{job="blackbox"}  overall probe latency histogram
#   probe_http_duration_seconds_bucket{job="blackbox"}  HTTP phase latency histogram
#   probe_http_ssl{job="blackbox"}             1 if TLS used
#   probe_http_status_code{job="blackbox"}     HTTP status code
#
# Requires: blackbox-exporter deployed + Probe CRs in monitoring namespace.
#
# SCOPE: every cluster that remote_writes into Mimir. A `$cluster` template
# variable lets you filter to a specific cluster.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: blackbox-status
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana-central
  folder: "Monitoring"
  json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["blackbox", "probes", "http", "availability"],
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "Blackbox HTTP Probes",
      "uid": "blackbox-status",
      "version": 1,
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "Mimir" },
            "definition": "label_values(probe_success{job=\"blackbox\"}, cluster)",
            "query": { "query": "label_values(probe_success{job=\"blackbox\"}, cluster)", "refId": "StandardVariableQuery" },
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "job",
            "label": "Job",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "Mimir" },
            "definition": "label_values(probe_success{cluster=~\"$cluster\"}, job)",
            "query": { "query": "label_values(probe_success{cluster=~\"$cluster\"}, job)", "refId": "StandardVariableQuery" },
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "noValue": "N/A",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 90 },
                  { "color": "green", "value": 99 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Overall Availability",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "editorMode": "code",
              "expr": "avg(probe_success{job=~\"$job\", cluster=~\"$cluster\"}) * 100",
              "legendFormat": "Availability",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Total Targets",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "editorMode": "code",
              "expr": "count(probe_success{job=~\"$job\", cluster=~\"$cluster\"})",
              "legendFormat": "Targets",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Up",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "editorMode": "code",
              "expr": "count(probe_success{job=~\"$job\", cluster=~\"$cluster\"} == 1)",
              "legendFormat": "Up",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
