            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "P95 Latency by Target",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (instance, cluster, le) (rate(probe_http_duration_seconds_bucket{job=~\"$job\", cluster=~\"$cluster\"}[$__rate_interval]))) * 1000",
              "legendFormat": "{{ instance }} ({{ cluster }})",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
