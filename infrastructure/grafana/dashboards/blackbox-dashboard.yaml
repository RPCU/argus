        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "inspect": false
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Availability %" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "decimals", "value": 1 },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red", "value": null },
                        { "color": "orange", "value": 90 },
                        { "color": "green", "value": 99 }
                      ]
                    }
                  },
                  { "id": "mappings", "value": [] }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Status" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "1": { "text": "UP", "color": "green" } } },
                      { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "P95 (ms)" },
                "properties": [
                  { "id": "unit", "value": "ms" },
                  { "id": "decimals", "value": 1 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "P99 (ms)" },
                "properties": [
                  { "id": "unit", "value": "ms" },
                  { "id": "decimals", "value": 1 }
                ]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "id": 7,
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false }
          },
          "title": "All Targets",
          "type": "table",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "editorMode": "code",
              "expr": "avg by (instance, cluster) (probe_success{job=~\"$job\", cluster=~\"$cluster\"}) * 100",
              "legendFormat": "{{ instance }} - {{ cluster }}",
              "range": false,
              "instant": true,
              "refId": "A",
              "format": "table"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (instance, cluster, le) (rate(probe_http_duration_seconds_bucket{job=~\"$job\", cluster=~\"$cluster\"}[$__rate_interval]))) * 1000",
