              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "editorMode": "code",
              "expr": "count(probe_success{job=~\"$job\", cluster=~\"$cluster\"} == 0)",
              "legendFormat": "Down",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 6,
          "title": "Target Details",
          "type": "row"
