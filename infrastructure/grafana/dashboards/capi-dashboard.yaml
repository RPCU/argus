# GrafanaDashboard — Cluster API (CAPI) Status Dashboard.
#
# Shows cluster/machine health, controller reconciliation performance,
# workqueue depth, and API client latency for CAPI core, kubeadm bootstrap/
# control-plane, and CAPO (OpenStack) infrastructure providers.
#
# Requires kube-state-metrics customResourceState enabled for CAPI CRDs
# in the kube-prometheus-stack HelmRelease (infrastructure/monitoring/helmrelease.yaml).
# Controller-runtime metrics (controller_runtime_reconcile_total, etc.) are
# scraped by default from the CAPI controller-manager pods.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: capi-status
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folder: "Monitoring"
  json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Cluster Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "count(capi_cluster_info{cluster=~\"$cluster\"})",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Clusters",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "count(capi_cluster_info{cluster=~\"$cluster\", ready=\"False\"}) or vector(0)",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Not Ready",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "count(capi_machine_info{cluster=~\"$cluster\"})",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Machines",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "count(capi_machine_info{cluster=~\"$cluster\", phase=\"Failed\"}) or vector(0)",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Failed Machines",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 6,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "count(capi_machinedeployment_info{cluster=~\"$cluster\"})",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "MachineDeployments",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 7,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "count(capi_kubeadmcontrolplane_info{cluster=~\"$cluster\"})",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Control Planes",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 8,
          "title": "Controller Health",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "errors/s",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 9,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum by (cluster, controller) (rate(controller_runtime_reconcile_errors_total{cluster=~\"$cluster\", controller=~\"cluster|machine|machineset|machinedeployment|kubeadmcontrolplane|kubeadmconfig|openstackcluster|openstackmachine|openstackmachinetemplate\"}[5m]))",
              "legendFormat": "{{ cluster }} / {{ controller }}",
              "refId": "A"
            }
          ],
          "title": "Reconcile Errors",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "reconciles/s",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 10,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum by (cluster, controller, result) (rate(controller_runtime_reconcile_total{cluster=~\"$cluster\", controller=~\"cluster|machine|machineset|machinedeployment|kubeadmcontrolplane|kubeadmconfig|openstackcluster|openstackmachine|openstackmachinetemplate\"}[5m]))",
              "legendFormat": "{{ cluster }} / {{ controller }} / {{ result }}",
              "refId": "A"
            }
          ],
          "title": "Reconcile Rate by Result",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "seconds (p99)",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "id": 11,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "histogram_quantile(0.99, sum by (le, cluster, controller) (rate(controller_runtime_reconcile_time_seconds_bucket{cluster=~\"$cluster\", controller=~\"cluster|machine|machineset|machinedeployment|kubeadmcontrolplane|kubeadmconfig|openstackcluster|openstackmachine|openstackmachinetemplate\"}[5m])))",
              "legendFormat": "{{ cluster }} / {{ controller }}",
              "refId": "A"
            }
          ],
          "title": "Reconcile Duration (p99)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "active",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "id": 12,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "controller_runtime_active_workers{cluster=~\"$cluster\", controller=~\"cluster|machine|machineset|machinedeployment|kubeadmcontrolplane|kubeadmconfig|openstackcluster|openstackmachine|openstackmachinetemplate\"}",
              "legendFormat": "{{ cluster }} / {{ controller }}",
              "refId": "A"
            }
          ],
          "title": "Active Workers",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "id": 13,
          "title": "Workqueue & API Client",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "depth",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "id": 14,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "workqueue_depth{cluster=~\"$cluster\", name=~\"cluster|machine|machineset|machinedeployment|kubeadmcontrolplane|kubeadmconfig|openstackcluster|openstackmachine|openstackmachinetemplate\"}",
              "legendFormat": "{{ cluster }} / {{ name }}",
              "refId": "A"
            }
          ],
          "title": "Workqueue Depth",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "retries/s",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "id": 15,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "rate(workqueue_retries_total{cluster=~\"$cluster\", name=~\"cluster|machine|machineset|machinedeployment|kubeadmcontrolplane|kubeadmconfig|openstackcluster|openstackmachine|openstackmachinetemplate\"}[5m])",
              "legendFormat": "{{ cluster }} / {{ name }}",
              "refId": "A"
            }
          ],
          "title": "Workqueue Retries",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "req/s",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "id": 16,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum by (cluster, verb, code) (rate(rest_client_requests_total{cluster=~\"$cluster\", job=~\"capi-*|capo-*|kubeadm-*\"}[5m])) > 0",
              "legendFormat": "{{ cluster }} / {{ verb }} {{ code }}",
              "refId": "A"
            }
          ],
          "title": "API Client Requests",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "seconds (p99)",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
          "id": 17,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "histogram_quantile(0.99, sum by (le, cluster, verb) (rate(rest_client_request_duration_seconds_bucket{cluster=~\"$cluster\", job=~\"capi-*|capo-*|kubeadm-*\"}[5m])))",
              "legendFormat": "{{ cluster }} / {{ verb }}",
              "refId": "A"
            }
          ],
          "title": "API Client Latency (p99)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 39 },
          "id": 18,
          "title": "Cluster Status",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "Running": { "color": "green", "index": 1, "text": "Running" } }, "type": "value" },
                { "options": { "Provisioned": { "color": "green", "index": 2, "text": "Provisioned" } }, "type": "value" },
                { "options": { "Provisioning": { "color": "yellow", "index": 3, "text": "Provisioning" } }, "type": "value" },
                { "options": { "Deleting": { "color": "orange", "index": 4, "text": "Deleting" } }, "type": "value" },
                { "options": { "Failed": { "color": "red", "index": 5, "text": "Failed" } }, "type": "value" },
                { "options": { "Pending": { "color": "blue", "index": 6, "text": "Pending" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "id": 19,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "layout": "grid",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "capi_cluster_info{cluster=~\"$cluster\"}",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Cluster Phase",
          "transformations": [
            {
