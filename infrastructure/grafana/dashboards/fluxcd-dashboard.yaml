# GrafanaDashboard — FluxCD GitOps Status Dashboard.
#
# Uses kube-state-metrics customResourceState metrics (gotk_resource_info)
# for Ready/Suspended status of all Flux CRs, plus the native controller
# metrics (gotk_reconcile_duration_seconds_*, controller_runtime_reconcile_total)
# for reconciliation timing and error rates.
#
# Requires kube-state-metrics customResourceState enabled in the
# kube-prometheus-stack HelmRelease (infrastructure/monitoring/helmrelease.yaml).
# See: https://fluxcd.io/flux/monitoring/custom-metrics/
#
# Based on the official Flux monitoring example:
# https://github.com/fluxcd/flux2-monitoring-example
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: fluxcd-status
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folder: "Monitoring"
  json: |
