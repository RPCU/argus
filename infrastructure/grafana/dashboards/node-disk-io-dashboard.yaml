# Node disk I/O monitoring (throughput, IOPS, latency, utilization).
#
# Sourced from node-exporter (node_disk_*), covering the REAL block devices
# of every monitored machine — especially the baremetal openstack hypervisors
# (lucy/makise/quinn) which carry Nova VMs and Ceph OSDs.
#
# NOTE: container-level disk I/O metrics (container_fs_reads_bytes_total,
# container_fs_writes_bytes_total, container_blkio_device_usage_total) are
# intentionally dropped by the monitoring base's cAdvisor relabelings to cut
# ~5k+ series. This dashboard therefore shows NODE-level I/O only, which is
# where the real signal lives for capacity planning, Ceph OSD diagnostics,
# and Nova cold-migration throughput.
#
# Loop devices are excluded (no real signal). Device-mapper (dm-*) devices
# are KEPT — on NixOS hosts dm-0 is the LVM root volume and its I/O is the
# dominant signal for capacity planning.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-disk-io-overview
  namespace: monitoring
spec:
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      dashboards: grafana-central
  folder: "Monitoring"
  json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "title": "Node Disk I/O",
      "uid": "node-disk-io-overview",
      "tags": ["disk", "io", "nodes", "hypervisor"],
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "1m",
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum(rate(node_disk_read_bytes_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]))",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Total Read Throughput",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum(rate(node_disk_written_bytes_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]))",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Total Write Throughput",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum(rate(node_disk_reads_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]))",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Total Read IOPS",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum(rate(node_disk_writes_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]))",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Total Write IOPS",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "mode": "gradient",
                  "type": "gauge"
                },
                "filterable": false,
                "inspect": false
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 4 },
          "id": 5,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Utilization" }]
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "100 * avg by (cluster, node) (rate(node_disk_io_time_seconds_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]))",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Disk I/O Utilization (avg) by Node",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "cluster": "Cluster",
                  "node": "Node",
                  "Value": "Utilization"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 8 },
          "id": 6,
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum(rate(node_disk_read_time_seconds_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])) / sum(rate(node_disk_reads_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])) > 0",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Avg Read Latency",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 8 },
          "id": 7,
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum(rate(node_disk_write_time_seconds_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])) / sum(rate(node_disk_writes_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])) > 0",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Avg Write Latency",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "fillOpacity": 10, "lineWidth": 2 }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 12 },
          "id": 8,
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "rate(node_disk_read_bytes_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])",
              "legendFormat": "{{cluster}} / {{node}} {{device}}",
              "refId": "A"
            }
          ],
          "title": "Read Throughput per Device",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "fillOpacity": 10, "lineWidth": 2 }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 12 },
          "id": 9,
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "rate(node_disk_written_bytes_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])",
              "legendFormat": "{{cluster}} / {{node}} {{device}}",
              "refId": "A"
            }
          ],
          "title": "Write Throughput per Device",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "iops",
              "custom": { "fillOpacity": 10, "lineWidth": 2 }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 21 },
          "id": 10,
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "rate(node_disk_reads_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])",
              "legendFormat": "{{cluster}} / {{node}} {{device}}",
              "refId": "A"
            }
          ],
          "title": "Read IOPS per Device",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "iops",
              "custom": { "fillOpacity": 10, "lineWidth": 2 }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 21 },
          "id": 11,
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "rate(node_disk_writes_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])",
              "legendFormat": "{{cluster}} / {{node}} {{device}}",
              "refId": "A"
            }
          ],
          "title": "Write IOPS per Device",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "fillOpacity": 10, "lineWidth": 2 },
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 30 },
          "id": 12,
          "description": "ARTIFACT — read (read_time/reads_completed). read_time is /proc/diskstats field 7, weighted by queue occupancy, NOT a per-request timer, so brief queue bursts spike this to seconds while the disk is fast. Kept for reference only; do NOT alert on it (the corresponding alert was removed). Use 'Disk Service Time per Device' below for a trustworthy signal, and — for Ceph OSDs — the OSD Commit/Apply Latency panels on the Ceph Storage dashboard.",
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "rate(node_disk_read_time_seconds_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]) / rate(node_disk_reads_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]) > 0",
              "legendFormat": "{{cluster}} / {{node}} {{device}}",
              "refId": "A"
            }
          ],
          "title": "Read Latency per Device (queue-weighted artifact — see note)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "fillOpacity": 10, "lineWidth": 2 },
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 30 },
          "id": 13,
          "description": "ARTIFACT — write (write_time/writes_completed). write_time is /proc/diskstats field 11, weighted by queue occupancy, NOT a per-request timer, so a brief Ceph OSD fsync/flush burst spikes this to 5,000–13,000ms while io_time utilization is ~50%, queue depth 0 and IOPS ~550 (verified live). Kept for reference only; do NOT alert on it (the corresponding alert was removed). Use 'Disk Service Time per Device' below, and — for Ceph OSDs — the OSD Commit/Apply Latency panels on the Ceph Storage dashboard.",
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "rate(node_disk_write_time_seconds_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]) / rate(node_disk_writes_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]) > 0",
              "legendFormat": "{{cluster}} / {{node}} {{device}}",
              "refId": "A"
            }
          ],
          "title": "Write Latency per Device (queue-weighted artifact — see note)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "fillOpacity": 10, "lineWidth": 2 },
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 39 },
          "id": 14,
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "rate(node_disk_io_time_seconds_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])",
              "legendFormat": "{{cluster}} / {{node}} {{device}}",
              "refId": "A"
            }
          ],
          "title": "Disk I/O Utilization per Device",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Average device service time = io_time / (reads+writes completed). io_time is the wall-clock the device had ANY I/O in flight, so dividing by completed ops gives a physically-bounded mean busy-time per op — the trustworthy replacement for the queue-weighted read/write 'latency' panels above (it does not spike to seconds on a queue burst). Red line at 50ms. For Ceph OSDs prefer the OSD Commit/Apply Latency panels on the Ceph Storage dashboard.",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": { "fillOpacity": 10, "lineWidth": 2, "drawStyle": "line", "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.05 }] },
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 48 },
          "id": 15,
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "rate(node_disk_io_time_seconds_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]) / (rate(node_disk_reads_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m]) + rate(node_disk_writes_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*\"}[5m])) > 0",
              "legendFormat": "{{cluster}} / {{node}} {{device}}",
              "refId": "A"
            }
          ],
          "title": "Disk Service Time per Device (io_time / ops)",
          "type": "timeseries"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "Mimir" },
            "query": "label_values(node_disk_read_bytes_total, cluster)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "Mimir" },
            "query": "label_values(node_disk_read_bytes_total{cluster=~\"$cluster\"}, node)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      }
    }
