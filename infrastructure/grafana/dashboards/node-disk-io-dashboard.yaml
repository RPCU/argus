              "expr": "rate(node_disk_write_time_seconds_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*|dm-0\"}[5m]) / rate(node_disk_writes_completed_total{cluster=~\"$cluster\", node=~\"$node\", device!~\"loop.*|dm-0\"}[5m]) > 0",
