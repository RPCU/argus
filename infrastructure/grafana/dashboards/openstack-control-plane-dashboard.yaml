# GrafanaDashboard — OpenStack Control Plane (openstack cluster ONLY).
#
# SCOPE: single-cluster on purpose. Every query is pinned to
# `cluster="openstack"`; there is no $cluster selector. This dashboard answers
# "how is the OpenStack cloud itself behaving?" — services, virtual machines,
# the RPC bus and the service databases — NOT "how is the Kubernetes underneath
# it doing?" (that is the cluster-overview / node dashboards). The previous
# version mixed in generic baremetal-Kubernetes panels (node CPU, pod restarts,
# top-pods-by-cpu); those were moved out so this dashboard is purely OpenStack
# components.
#
# METRIC PROVENANCE — every metric was verified to EXIST and RETURN DATA by
# scraping the live exporters before the panel was written:
#
#   openstack_*   prometheus-openstack-exporter (infrastructure/openstack-exporter)
#                 — queries the OpenStack APIs with the yaook admin creds. Verified
#                 live: 8 services up, 11 total VMs, per-tenant instance counts,
#                 nova/neutron/cinder agent states, octavia LB status, glance/
#                 designate/cinder resource counts.
#   rabbitmq_*    yaook amqp_service_monitor   (RabbitMQ prometheus plugin)
#   mysql_*       yaook mysql_service_monitor  (mysqld_exporter)
#
# WHAT WAS REMOVED AND WHY:
#   - The OVS/OVN data-plane row (socket_up / flow_limit). Confirmed ZERO series
#     in Mimir: the yaook ovn_monitoring PodMonitor is broken upstream (it
#     references container ports `prometheus`/`ovs-vswitchd-metrics` that the pods
#     don't expose), so those panels were permanently blank. Removed rather than
#     left dead. If that PodMonitor is fixed upstream, restore an OVS row here.
#   - The generic baremetal-Kubernetes rows (node CPU/mem/load, pod restarts,
#     top pods by cpu/mem). Not OpenStack-component metrics — they belong on the
#     node/cluster dashboards.
#   - Hypervisor-capacity nova metrics (openstack_nova_running_vms / vcpus_used /
#     memory_used_bytes). Confirmed ABSENT: this cloud's placement/nova setup does
#     not expose the os-hypervisors detail the exporter reads, so those return
#     nothing. VM counts come from openstack_nova_total_vms (cluster) and
#     openstack_nova_limits_instances_used (per tenant), which DO return data.
#
# VM ERROR SEMANTICS: openstack_nova_server_status carries a `status` string
# label and a numeric value from the exporter's status map — 0=ACTIVE, 4=ERROR,
# 11=SHUTOFF (see exporters/nova.go knownServerStatuses). The VM panels and the
# rules-openstack.yaml alerts key on that.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: openstack-control-plane
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana-central
  folder: Infrastructure & Clusters
  json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["openstack", "yaook", "nova"],
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "OpenStack Control Plane",
      "uid": "openstack-control-plane",
      "version": 1,
      "weekStart": "",
      "templating": {
        "list": [
          {
            "name": "tenant",
            "label": "Tenant",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "Mimir" },
            "query": "label_values(openstack_nova_limits_instances_used{cluster=\"openstack\"}, tenant)",
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Service Health",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Reachable OpenStack API services out of the 8 the exporter probes (nova, neutron, cinder, glance, keystone/identity, octavia/load-balancer, designate, placement). Any value below 8 means an API is down — clicks in Horizon and every automation against it will fail.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 7 }, { "color": "green", "value": 8 }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 2,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [
            { "expr": "openstack_identity_up{cluster=\"openstack\"} + openstack_nova_up{cluster=\"openstack\"} + openstack_neutron_up{cluster=\"openstack\"} + openstack_cinder_up{cluster=\"openstack\"} + openstack_glance_up{cluster=\"openstack\"} + openstack_loadbalancer_up{cluster=\"openstack\"} + openstack_designate_up{cluster=\"openstack\"} + openstack_placement_up{cluster=\"openstack\"}", "legendFormat": "services up", "refId": "A" }
          ],
          "title": "Services Up (of 8)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Total virtual machines across all tenants (openstack_nova_total_vms). The headline capacity number for the cloud.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "thresholds" }, "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "openstack_nova_total_vms{cluster=\"openstack\"}", "legendFormat": "VMs", "refId": "A" } ],
          "title": "Total VMs",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "VMs NOT in ACTIVE state (status != ACTIVE). ERROR/SHUTOFF/UNKNOWN VMs count here. Green 0 is healthy; any non-zero warrants a look at the VM Status table below.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "thresholds" }, "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 3 }] } }
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 4,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "count(openstack_nova_server_status{cluster=\"openstack\"} != 0) or vector(0)", "legendFormat": "not active", "refId": "A" } ],
          "title": "VMs Not Active",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "VMs in ERROR state (status value 4). This is the direct 'a VM is broken' signal — non-zero means Nova failed to build, migrate, or reboot an instance.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "thresholds" }, "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 5,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "count(openstack_nova_server_status{cluster=\"openstack\"} == 4) or vector(0)", "legendFormat": "error", "refId": "A" } ],
          "title": "VMs in ERROR",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "nova-compute agents reporting up, one per hypervisor (lucy/makise/quinn). Below 3 means a hypervisor's compute service is down — no VMs can be scheduled or managed there.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "thresholds" }, "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 2 }, { "color": "green", "value": 3 }] } }
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 6,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "sum(openstack_nova_agent_state{cluster=\"openstack\",exported_service=\"nova-compute\"})", "legendFormat": "compute up", "refId": "A" } ],
          "title": "nova-compute Up",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "RabbitMQ ready-message backlog across the whole bus. The leading indicator of an OpenStack stall: a growing backlog means RPC consumers (nova-compute, neutron/cinder agents) are not keeping up or are dead.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "thresholds" }, "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 100 }, { "color": "red", "value": 1000 }] } }
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 7,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "sum(rabbitmq_queue_messages_ready{cluster=\"openstack\"})", "legendFormat": "ready", "refId": "A" } ],
          "title": "RPC Backlog",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Per-service API reachability over time (1 = up). Each OpenStack service exporter publishes its own _up; a dip pinpoints exactly which API went unavailable and when.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 15, "showPoints": "never", "spanNulls": true },
              "unit": "short", "max": 1, "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 5 },
          "id": 8,
          "options": { "legend": { "calcs": ["min", "lastNotNull"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "openstack_identity_up{cluster=\"openstack\"}", "legendFormat": "keystone", "refId": "A" },
            { "expr": "openstack_nova_up{cluster=\"openstack\"}", "legendFormat": "nova", "refId": "B" },
            { "expr": "openstack_neutron_up{cluster=\"openstack\"}", "legendFormat": "neutron", "refId": "C" },
            { "expr": "openstack_cinder_up{cluster=\"openstack\"}", "legendFormat": "cinder", "refId": "D" },
            { "expr": "openstack_glance_up{cluster=\"openstack\"}", "legendFormat": "glance", "refId": "E" },
            { "expr": "openstack_loadbalancer_up{cluster=\"openstack\"}", "legendFormat": "octavia", "refId": "F" },
            { "expr": "openstack_designate_up{cluster=\"openstack\"}", "legendFormat": "designate", "refId": "G" },
            { "expr": "openstack_placement_up{cluster=\"openstack\"}", "legendFormat": "placement", "refId": "H" }
          ],
          "title": "API Service Availability",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "id": 10,
          "title": "Virtual Machines (Nova)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Every VM with its current status. status=ACTIVE (green) is healthy; ERROR/SHUTOFF/etc. stand out. Joined columns: name, tenant, availability zone, and the raw status. This is the authoritative 'which VM is broken' list.",
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Status" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } },
                  { "id": "mappings", "value": [ { "type": "value", "options": { "ACTIVE": { "color": "green", "index": 0 }, "ERROR": { "color": "red", "index": 1 }, "SHUTOFF": { "color": "yellow", "index": 2 }, "BUILD": { "color": "blue", "index": 3 } } } ] }
                ]
              }
            ]
          },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 14 },
          "id": 11,
          "options": { "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Status" }] },
          "targets": [
            { "expr": "openstack_nova_server_status{cluster=\"openstack\"}", "format": "table", "instant": true, "refId": "A" }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true, "__name__": true, "cluster": true, "container": true, "endpoint": true, "instance": true, "job": true, "namespace": true, "pod": true, "service": true, "Value": true,
                  "id": true, "uuid": true, "user_id": true, "host_id": true, "address_ipv4": true, "address_ipv6": true, "flavor_id": true, "instance_libvirt": true, "hypervisor_hostname": true
                },
                "renameByName": {
                  "name": "VM", "status": "Status", "tenant_id": "Tenant", "availability_zone": "AZ"
                }
              }
            }
          ],
          "title": "VM Status (all tenants)",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Instances used per tenant (openstack_nova_limits_instances_used) vs the tenant's max (-1 = unlimited, shown as no cap). Shows where the VMs actually live and which tenant is approaching its quota.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "id": 12,
          "options": {
            "displayMode": "gradient", "orientation": "horizontal", "showUnfilled": true,
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            { "expr": "openstack_nova_limits_instances_used{cluster=\"openstack\",tenant=~\"$tenant\"}", "legendFormat": "{{tenant}}", "refId": "A" }
          ],
          "title": "Instances Used per Tenant",
          "type": "bargauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "VM count by status over time. A rising ERROR line, or ACTIVE dropping while SHUTOFF rises, is the shape of a hypervisor incident (e.g. the documented nova cold-migration wedge left VMs SHUTOFF/ERROR).",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 20, "showPoints": "never", "stacking": { "mode": "normal" }, "spanNulls": true },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "id": 13,
          "options": { "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "count by (status) (openstack_nova_server_status{cluster=\"openstack\"})", "legendFormat": "{{status}}", "refId": "A" }
          ],
          "title": "VMs by Status",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Nova service agents (compute/conductor/scheduler) up state per host. A 0 here is a down agent — nova-compute down = that hypervisor is out of the scheduling pool; conductor/scheduler down = control-plane degraded.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 15, "showPoints": "never", "spanNulls": true },
              "unit": "short", "max": 1, "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 31 },
          "id": 14,
          "options": { "legend": { "calcs": ["min", "lastNotNull"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "openstack_nova_agent_state{cluster=\"openstack\"}", "legendFormat": "{{exported_service}} @ {{hostname}}", "refId": "A" }
          ],
          "title": "Nova Agent State",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 39 },
          "id": 20,
          "title": "Message Bus (RabbitMQ) — OpenStack RPC",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Ready (undelivered) messages per OpenStack service bus. A queue that climbs and does not drain identifies WHICH component is stuck.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true }, "unit": "short" }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "id": 21,
          "options": { "legend": { "calcs": ["max", "lastNotNull"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum by (job) (rabbitmq_queue_messages_ready{cluster=\"openstack\"})", "legendFormat": "{{job}}", "refId": "A" }
          ],
          "title": "Queue Backlog — Ready Messages by Service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Unacknowledged messages: delivered to a consumer but not yet acked. Persistently high means a consumer took work and never finished it (hung agent).",
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true }, "unit": "short" }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 40 },
          "id": 22,
          "options": { "legend": { "calcs": ["max", "lastNotNull"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum by (job) (rabbitmq_queue_messages_unacked{cluster=\"openstack\"})", "legendFormat": "{{job}}", "refId": "A" }
          ],
          "title": "Unacknowledged Messages by Service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "RabbitMQ memory against its own high-watermark limit. Crossing the watermark blocks publishers, which manifests as OpenStack API calls hanging rather than erroring.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true }, "unit": "percent", "max": 100, "min": 0 }
          },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 48 },
          "id": 23,
          "options": { "legend": { "calcs": ["max", "lastNotNull"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "100 * rabbitmq_process_resident_memory_bytes{cluster=\"openstack\"} / clamp_min(rabbitmq_resident_memory_limit_bytes{cluster=\"openstack\"}, 1)", "legendFormat": "{{job}}", "refId": "A" }
          ],
          "title": "RabbitMQ Memory vs Watermark",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 55 },
          "id": 30,
          "title": "Service Databases (MariaDB)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Per-database health. up = exporter reachable.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "text" },
              "custom": { "align": "auto", "cellOptions": { "type": "color-text" } }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "up" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "color", "value": { "mode": "thresholds" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } }
                ]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 56 },
          "id": 31,
          "options": { "showHeader": true },
          "targets": [
            { "expr": "mysql_up{cluster=\"openstack\"}", "format": "table", "instant": true, "refId": "A" }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true, "cluster": true, "endpoint": true, "namespace": true, "service": true, "container": true, "pod": true, "instance": true, "prometheus": true, "prometheus_replica": true },
                "renameByName": { "Value #A": "up", "job": "database" }
              }
            }
          ],
          "title": "Database Status",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Connection pool utilisation per database. OpenStack services open long-lived pools; hitting max_connections makes API calls fail with 500s that look like application bugs.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true }, "unit": "percent", "max": 100, "min": 0 }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 56 },
          "id": 32,
          "options": { "legend": { "calcs": ["max", "lastNotNull"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "100 * mysql_global_status_threads_connected{cluster=\"openstack\"} / clamp_min(mysql_global_variables_max_connections{cluster=\"openstack\"}, 1)", "legendFormat": "{{job}}", "refId": "A" }
          ],
          "title": "Connection Pool Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Aborted connection attempts. Spikes coincide with the ssl-terminator sidecar restarting — the exact failure that took PowerDNS/Galera down and broke rpcu.lan resolution cluster-wide.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 0, "showPoints": "never", "spanNulls": true }, "unit": "reqps" }
          },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 64 },
          "id": 33,
          "options": { "legend": { "calcs": ["max"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum by (job) (rate(mysql_global_status_aborted_connects{cluster=\"openstack\"}[5m]))", "legendFormat": "{{job}}", "refId": "A" }
          ],
