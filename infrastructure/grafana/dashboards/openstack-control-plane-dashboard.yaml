        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "CPU utilisation per hypervisor. THE most important panel here: these nodes run the OpenStack control plane, Ceph OSDs and tenant VMs on the same cores. Every documented outage on this cluster (OVN raft loss, PowerDNS SERVFAIL) began with a node pinned near 100% starving BestEffort pods.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true },
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 46 },
          "id": 41,
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "100 * (1 - avg by (node) (rate(node_cpu_seconds_total{cluster=\"openstack\",mode=\"idle\",node=~\"$node\"}[5m])))",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ],
          "title": "Node CPU Utilisation",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Run-queue pressure relative to core count. A value above 1.0 means more runnable work than cores - processes are waiting. This is the metric that read 5.75 (load 69 on 12 cores) during the OVN collapse, while plain CPU% looked merely 'busy'.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 46 },
          "id": 42,
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum by (node) (node_load1{cluster=\"openstack\",node=~\"$node\"}) / clamp_min(count by (node) (node_cpu_seconds_total{cluster=\"openstack\",mode=\"idle\",node=~\"$node\"}), 1)",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
