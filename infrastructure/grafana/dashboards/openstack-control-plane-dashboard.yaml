# GrafanaDashboard — OpenStack Control Plane (openstack cluster ONLY).
#
# SCOPE: this dashboard is deliberately SINGLE-CLUSTER. Every query is pinned to
# `cluster="openstack"` and there is NO $cluster template variable — it exists to
# answer "how is OpenStack behaving, and what is the baremetal Kubernetes
# underneath it doing?", not to compare clusters. Cross-cluster views belong in
# the cluster-overview dashboard.
#
# WHAT IT REPLACED: the previous version of this file was a generic multi-cluster
# Kubernetes dashboard with a `$cluster` selector and a single empty "OpenStack
# Control Plane" row. It contained no OpenStack metrics at all, and several of
# its panels were permanently blank because they queried
# `apiserver_request_duration_seconds_bucket`, which infrastructure/monitoring
# drops for cardinality reasons.
#
# METRIC PROVENANCE — every metric used below was verified to EXIST on the live
# openstack cluster by scraping the exporter before the panel was written. This
# matters: the failure mode being fixed here is dashboards built on plausible-
# looking metric names that never resolve.
#
#   rabbitmq_*  yaook amqp_service_monitor    (RabbitMQ prometheus plugin)
#   mysql_*     yaook mysql_service_monitor   (mysqld_exporter, incl. Galera wsrep)
#   socket_up   yaook ovn_monitoring pods, port 9999/8008
#   flow_limit  yaook ovn_monitoring pods, port 9999/8008
#   node_*      node-exporter
#   kube_*      kube-state-metrics
#   container_* cAdvisor (only the two families kept after the cardinality trim)
#
# DELIBERATE OMISSIONS:
#   - No `openstack_*` panels (nova hypervisors, VM counts, quotas). Those come
#     from prometheus-openstack-exporter, which is NOT deployed. Adding panels
#     for them would just create more empty graphs.
#   - OVS coverage is thin (socket_up, flow_limit) because that is genuinely all
#     the yaook ovn-monitoring DaemonSet exports. Its PodMonitor is ALSO broken
#     upstream: it references container ports named `prometheus` /
#     `ovs-vswitchd-metrics`, but the pods actually expose `metrics` (8008) and
#     `ovs-metrics` (8007), so it selects no targets at all. Until that is fixed
#     the two gauges below are best-effort.
#   - No apiserver latency histograms — dropped upstream for cardinality.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: openstack-control-plane
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana-central
  folder: Infrastructure & Clusters
  json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "1m",
      "tags": ["openstack", "yaook", "baremetal"],
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "OpenStack Control Plane",
      "uid": "openstack-control-plane",
      "templating": {
        "list": [
          {
            "name": "node",
            "label": "Baremetal node",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "Mimir" },
            "query": "label_values(kube_node_info{cluster=\"openstack\"}, node)",
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Health Summary",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Galera/MariaDB instances backing the OpenStack services that are reachable by their exporter. Any value below the total means a service database is down - OpenStack API calls against that service will fail.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(mysql_up{cluster=\"openstack\"})",
              "legendFormat": "up",
              "refId": "A"
            }
          ],
          "title": "Databases Up",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Galera nodes reporting wsrep_ready=1, i.e. able to accept writes. A node that is connected but NOT ready is still syncing (SST/IST) and will reject queries.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(mysql_global_status_wsrep_ready{cluster=\"openstack\"})",
              "legendFormat": "ready",
              "refId": "A"
            }
          ],
          "title": "Galera Write-Ready",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Total messages sitting READY (undelivered) across every RabbitMQ queue. This is THE leading indicator of an OpenStack stall: agents publish RPC into the bus and a growing backlog means consumers (nova-compute, neutron agents, cinder-volume) are not keeping up or are dead.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 100 },
                  { "color": "red", "value": 1000 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rabbitmq_queue_messages_ready{cluster=\"openstack\"})",
              "legendFormat": "ready",
              "refId": "A"
            }
          ],
          "title": "Message Backlog",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Active RabbitMQ resource alarms (memory watermark, disk watermark, file-descriptor limit). ANY non-zero value means RabbitMQ has BLOCKED publishers - OpenStack will appear to hang rather than error.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rabbitmq_alarms_memory_used_watermark{cluster=\"openstack\"}) + sum(rabbitmq_alarms_free_disk_space_watermark{cluster=\"openstack\"}) + sum(rabbitmq_alarms_file_descriptor_limit{cluster=\"openstack\"})",
              "legendFormat": "alarms",
              "refId": "A"
            }
          ],
          "title": "RabbitMQ Alarms",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "ovs-vswitchd sockets reachable, one per hypervisor. If this drops below the node count, that node's data plane is degraded and VMs on it lose connectivity.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(socket_up{cluster=\"openstack\"})",
              "legendFormat": "vswitchd",
              "refId": "A"
            }
          ],
          "title": "OVS vswitchd Up",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Highest CPU utilisation across the three hypervisors. These hosts are HYPERCONVERGED - they run the OpenStack control plane, Ceph OSDs and tenant VMs together. Sustained high values are the documented root cause of both the OVN control-plane collapse and the PowerDNS/Galera restart loop, because BestEffort pods get cpu.weight=1 and are starved.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 7,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "max(100 * (1 - avg by (node) (rate(node_cpu_seconds_total{cluster=\"openstack\",mode=\"idle\"}[5m]))))",
              "legendFormat": "peak",
              "refId": "A"
            }
          ],
          "title": "Peak Node CPU",
          "type": "stat"
        },

        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 10,
          "title": "Message Bus (RabbitMQ) — OpenStack RPC",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Ready (undelivered) messages per OpenStack service bus. A queue that climbs and does not drain identifies WHICH component is stuck - e.g. a rising nova queue with healthy neutron points at nova-compute, not at RabbitMQ.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 11,
          "options": {
            "legend": { "calcs": ["max", "lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum by (job) (rabbitmq_queue_messages_ready{cluster=\"openstack\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Queue Backlog — Ready Messages by Service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Unacknowledged messages: delivered to a consumer but not yet acked. Persistently high means a consumer took work and never finished it (hung agent), which is different from a backlog of undelivered work.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 12,
          "options": {
            "legend": { "calcs": ["max", "lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum by (job) (rabbitmq_queue_messages_unacked{cluster=\"openstack\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Unacknowledged Messages by Service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Publish vs deliver rate across the bus. Healthy OpenStack keeps these two curves close together; a sustained gap is the bus falling behind.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 0, "showPoints": "never", "spanNulls": true },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 14 },
          "id": 13,
          "options": {
            "legend": { "calcs": ["mean"], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(rate(rabbitmq_queue_messages_published_total{cluster=\"openstack\"}[5m]))",
              "legendFormat": "published",
              "refId": "A"
            },
            {
              "expr": "sum(rate(rabbitmq_queue_messages_delivered_total{cluster=\"openstack\"}[5m]))",
              "legendFormat": "delivered",
              "refId": "B"
            },
            {
              "expr": "sum(rate(rabbitmq_queue_messages_redelivered_total{cluster=\"openstack\"}[5m]))",
              "legendFormat": "redelivered",
              "refId": "C"
            }
          ],
          "title": "Bus Throughput",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "RabbitMQ memory against its own high-watermark limit. Crossing the watermark blocks publishers, which manifests as OpenStack API calls hanging.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true },
              "unit": "percent",
              "max": 100,
              "min": 0
            }
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 14 },
          "id": 14,
          "options": {
            "legend": { "calcs": ["max", "lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "100 * rabbitmq_process_resident_memory_bytes{cluster=\"openstack\"} / clamp_min(rabbitmq_resident_memory_limit_bytes{cluster=\"openstack\"}, 1)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "RabbitMQ Memory vs Watermark",
          "type": "timeseries"
        },

        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 },
          "id": 20,
          "title": "Service Databases (Galera / MariaDB)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Per-database health. `up` = exporter reachable; `wsrep_ready` = accepting writes; `wsrep_connected` = joined to the cluster. A row where up=1 but ready=0 is a database that is running but refusing queries.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "custom": { "align": "auto", "cellOptions": { "type": "color-background" } }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "id": 21,
          "options": { "showHeader": true },
          "targets": [
            {
              "expr": "mysql_up{cluster=\"openstack\"}",
              "format": "table",
              "instant": true,
              "legendFormat": "up",
              "refId": "A"
            },
            {
              "expr": "mysql_global_status_wsrep_ready{cluster=\"openstack\"}",
              "format": "table",
              "instant": true,
              "legendFormat": "ready",
              "refId": "B"
            },
            {
              "expr": "mysql_global_status_wsrep_connected{cluster=\"openstack\"}",
              "format": "table",
              "instant": true,
              "legendFormat": "connected",
              "refId": "C"
            }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true, "cluster": true, "endpoint": true, "namespace": true, "service": true, "container": true, "pod": true },
                "renameByName": { "Value #A": "up", "Value #B": "wsrep_ready", "Value #C": "wsrep_connected", "job": "database" }
              }
            }
          ],
          "title": "Database Status",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Connection pool utilisation per database. OpenStack services open long-lived pools; hitting max_connections makes API calls fail with 500s that look like application bugs.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "showPoints": "never", "spanNulls": true },
              "unit": "percent",
              "max": 100,
              "min": 0
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "id": 22,
          "options": {
            "legend": { "calcs": ["max", "lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "100 * mysql_global_status_threads_connected{cluster=\"openstack\"} / clamp_min(mysql_global_variables_max_connections{cluster=\"openstack\"}, 1)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Connection Pool Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Query throughput per database. Useful for spotting a service hot-looping against its DB (a common yaook operator misconfiguration signature).",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 0, "showPoints": "never", "spanNulls": true },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 30 },
          "id": 23,
          "options": {
            "legend": { "calcs": ["mean"], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum by (job) (rate(mysql_global_status_queries{cluster=\"openstack\"}[5m]))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Query Rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Slow queries. On this hyperconverged cluster a rise here usually tracks Ceph latency or CPU starvation rather than bad SQL.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 0, "showPoints": "never", "spanNulls": true },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 30 },
          "id": 24,
          "options": {
            "legend": { "calcs": ["max"], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum by (job) (rate(mysql_global_status_slow_queries{cluster=\"openstack\"}[5m]))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Slow Query Rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Aborted connection attempts. Spikes here coincide with the ssl-terminator sidecar restarting - the exact failure that took PowerDNS down and broke rpcu.lan resolution cluster-wide.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 0, "showPoints": "never", "spanNulls": true },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 30 },
          "id": 25,
          "options": {
            "legend": { "calcs": ["max"], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum by (job) (rate(mysql_global_status_aborted_connects{cluster=\"openstack\"}[5m]))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Aborted Connections",
          "type": "timeseries"
        },

        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 37 },
          "id": 30,
          "title": "Network Data Plane (OVS / OVN)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Per-hypervisor ovs-vswitchd socket reachability. A zero here means that node cannot program flows: existing VMs may keep running on cached flows while all NEW port binds fail, which surfaces as VMs that boot but never get network.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "fillOpacity": 30, "showPoints": "never", "spanNulls": true },
              "unit": "short",
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 38 },
          "id": 31,
          "options": {
            "legend": { "calcs": ["min", "lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "socket_up{cluster=\"openstack\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "ovs-vswitchd Socket Up",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "vswitchd flow limit per node. ovs-vswitchd lowers this automatically when it is under pressure and cannot keep up with flow setups - a falling value is an early warning of data-plane CPU starvation.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 0, "showPoints": "never", "spanNulls": true },
              "unit": "short"
            }
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 38 },
          "id": 32,
          "options": {
            "legend": { "calcs": ["min", "lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "flow_limit{cluster=\"openstack\"}",
              "legendFormat": "{{pod}}",
