# GrafanaDashboard — Palworld dedicated server.
#
# Metric source: the `exporter` sidecar in the atlas repo
# (clusters/production/palworld/deploy.yaml) running
# docker.io/banhcanh/palworld-exporter — https://github.com/Banh-Canh/palworld-exporter-go
# It scrapes the server REST API (/v1/api) plus the save directory on disk.
# Scraped by the production cluster's kube-prometheus-stack (ServiceMonitor in
# atlas, clusters/production/palworld/servicemonitor.yaml) and remote_written to
# central Mimir on mgmt, tagged cluster="production".
#
# Panel groups:
#   Server Health          palworld_up / fps / frame_time / players / uptime / info
#   Performance            FPS + frame time + concurrency + per-player session lanes
#   Container & Storage    cAdvisor + kubelet volume stats for the gaming/palworld pod
#   Players                /players endpoint: level, ping, buildings, coordinates
#   Pals & World           /game-data endpoint — needs ENABLE_GAMEDATA_API=true on
#                          the server (set in atlas clusters/production/palworld/cm.yaml);
#                          these panels stay empty without it
#   Saves & Settings       save-file sizes/mtimes + /settings game rates
#
# Datasource UID is "Mimir" (see ../mimir-datasource.yaml).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: palworld-server
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana-central"
  folder: "Gaming"
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
