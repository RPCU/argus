      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Server Health",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "Mimir"
          },
          "description": "palworld_up — 1 when the exporter's last scrape of the server REST API succeeded.",
