            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Palworld dedicated server — health, performance and world stats from Banh-Canh/palworld-exporter-go (REST API + save files), plus pod/PVC health from kube-prometheus-stack.",
