            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "Mimir"
              },
              "editorMode": "code",
              "expr": "palworld_up{cluster=~\"$cluster\"}",
              "range": true,
              "instant": false,
              "refId": "A"
