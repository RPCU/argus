apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cluster-pvc-storage-overview
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      dashboards: grafana-central
  folder: "Monitoring"
  json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Global Storage Totals",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "count(kube_persistentvolumeclaim_info{cluster=~\"$cluster\", namespace=~\"$namespace\"})",
              "legendFormat": "Total PVCs",
              "refId": "A"
            }
          ],
          "title": "Total PVC Count",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "purple", "value": null }]
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{cluster=~\"$cluster\", namespace=~\"$namespace\"})",
              "legendFormat": "Max Capacity",
              "refId": "A"
            }
          ],
          "title": "Total Requested Capacity",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "orange", "value": null }]
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum(max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{cluster=~\"$cluster\", namespace=~\"$namespace\"}))",
              "legendFormat": "Space Used",
              "refId": "A"
            }
          ],
          "title": "Total Space Used",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{cluster=~\"$cluster\", namespace=~\"$namespace\"}) - sum(max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{cluster=~\"$cluster\", namespace=~\"$namespace\"}))",
              "legendFormat": "Space Available",
              "refId": "A"
            }
          ],
          "title": "Total Free Space Available",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Mimir" },
          "description": "Per-PVC fill level: used / capacity as reported by the kubelet. Red at 90%, amber at 75%. NOTE for RWX volumes backed by the shared CephFS NFS export, BOTH used and capacity are statfs() on the whole export, so the figure is the export's fill level rather than that single claim's.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 6 },
          "id": 10,
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 18,
            "minVizWidth": 8,
            "orientation": "horizontal",
            "showUnfilled": true,
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "valueMode": "color",
            "namePlacement": "left",
            "sizing": "auto"
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Mimir" },
              "expr": "100 * (kubelet_volume_stats_used_bytes{cluster=~\"$cluster\", namespace=~\"$namespace\"} / kubelet_volume_stats_capacity_bytes{cluster=~\"$cluster\", namespace=~\"$namespace\"})",
              "instant": true,
              "legendFormat": "{{cluster}} / {{namespace}} / {{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "title": "PVC Fill Level - Used vs Capacity (red >90%, amber >75%)",
          "type": "bargauge"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["storage", "pvc", "inventory", "capacity"],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "Mimir" },
            "definition": "label_values(kubelet_volume_stats_capacity_bytes, cluster)",
            "includeAll": true,
            "label": "Cluster Filter",
            "multi": true,
            "name": "cluster",
            "options": [],
            "query": {
              "query": "label_values(kubelet_volume_stats_capacity_bytes, cluster)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "Mimir" },
            "definition": "label_values(kubelet_volume_stats_capacity_bytes{cluster=~\"$cluster\"}, namespace)",
            "includeAll": true,
            "label": "Namespace Filter",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(kubelet_volume_stats_capacity_bytes{cluster=~\"$cluster\"}, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"] },
      "timezone": "browser",
      "title": "Cluster PVC Inventory & Detailed Storage Capacity",
      "uid": "cluster-pvc-storage-overview"
    }
