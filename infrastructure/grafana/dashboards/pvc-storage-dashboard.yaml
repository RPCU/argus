apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cluster-pvc-storage-overview
  namespace: monitoring
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana-central
  folder: "Monitoring"
  json:
    "{\n  \"annotations\": {\n    \"list\": []\n  },\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [],\n  \"liveNow\": false,\n  \"panels\"\
    : [\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"id\": 1,\n      \"title\": \"Global Storage\
    \ Totals\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"Mimir\"\n      },\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"mappings\": [],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\"\
    : [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"unit\": \"short\"\n        }\n      },\n      \"\
    gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 1\n      },\n      \"id\": 2,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"\
    area\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\"\
    : \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n    \
    \        \"uid\": \"Mimir\"\n          },\n          \"expr\": \"count(kube_persistentvolumeclaim_info{cluster=~\\\"$cluster\\\", namespace=~\\\"$namespace\\\"})\",\n          \"legendFormat\": \"Total\
    \ PVCs\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Total PVC Count\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\"\
    ,\n        \"uid\": \"Mimir\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"mappings\": [],\n\
    \          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"purple\",\n                \"value\": null\n              }\n\
    \            ]\n          },\n          \"unit\": \"bytes\"\n        }\n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 1\n      },\n      \"\
    id\": 3,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\"\
    : {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\"\
    : [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"Mimir\"\n          },\n          \"expr\": \"sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{cluster=~\\\
    \"$cluster\\\", namespace=~\\\"$namespace\\\"})\",\n          \"legendFormat\": \"Max Capacity\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Total Max Capacity\",\n      \"\
    type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"Mimir\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\"\
    : {\n            \"mode\": \"thresholds\"\n          },\n          \"mappings\": [],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n  \
    \              \"color\": \"orange\",\n                \"value\": null\n              }\n            ]\n          },\n          \"unit\": \"bytes\"\n        }\n      },\n      \"gridPos\": {\n     \
    \   \"h\": 4,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 1\n      },\n      \"id\": 4,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n      \
    \  \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n    \
    \      \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\"\
    : \"Mimir\"\n          },\n          \"expr\": \"sum(max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{cluster=~\\\"$cluster\\\", namespace=~\\\"$namespace\\\"}))\"\
    ,\n          \"legendFormat\": \"Space Used\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Total Space Used\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\"\
    : {\n        \"type\": \"prometheus\",\n        \"uid\": \"Mimir\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n      \
    \    },\n          \"mappings\": [],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n           \
    \     \"value\": null\n              }\n            ]\n          },\n          \"unit\": \"bytes\"\n        }\n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 18,\n\
    \        \"y\": 1\n      },\n      \"id\": 5,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\",\n        \"orientation\"\
    : \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\"\
    : \"auto\"\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"Mimir\"\n          },\n          \"expr\": \"sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{cluster=~\\\
    \"$cluster\\\", namespace=~\\\"$namespace\\\"}) - sum(max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{cluster=~\\\"$cluster\\\", namespace=~\\\"$namespace\\\"}))\"\
    ,\n          \"legendFormat\": \"Space Available\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Total Free Space Available\",\n      \"type\": \"stat\"\n    },\n    {\n    \
    \  \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 5\n      },\n      \"id\": 6,\n      \"title\": \"Full PVC Listing (Capacity\
    \ vs Used vs Free)\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"Mimir\"\n      },\n      \"fieldConfig\": {\n        \"\
    defaults\": {\n          \"custom\": {\n            \"align\": \"auto\",\n            \"cellOptions\": {\n              \"type\": \"auto\"\n            },\n            \"inspect\": true\n          }\n\
    \        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"Max Capacity\"\n            },\n            \"properties\"\
    : [\n              {\n                \"id\": \"unit\",\n                \"value\": \"bytes\"\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"\
    id\": \"byName\",\n              \"options\": \"Used Space\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"unit\",\n                \"value\": \"bytes\"\n\
    \              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"Available Space\"\n            },\n          \
    \  \"properties\": [\n              {\n                \"id\": \"unit\",\n                \"value\": \"bytes\"\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n\
    \              \"id\": \"byName\",\n              \"options\": \"Usage Gauge\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"unit\",\n                \"\
    value\": \"percent\"\n              },\n              {\n                \"id\": \"custom.cellOptions\",\n                \"value\": {\n                  \"mode\": \"basic\",\n                  \"type\"\
    : \"gauge\"\n                }\n              },\n              {\n                \"id\": \"thresholds\",\n                \"value\": {\n                  \"mode\": \"absolute\",\n                \
    \  \"steps\": [\n                    {\n                      \"color\": \"green\",\n                      \"value\": null\n                    },\n                    {\n                      \"color\"\
    : \"yellow\",\n                      \"value\": 70\n                    },\n                    {\n                      \"color\": \"red\",\n                      \"value\": 85\n                  \
    \  }\n                  ]\n                }\n              }\n            ]\n          }\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 14,\n        \"w\": 24,\n        \"x\": 0,\n    \
    \    \"y\": 6\n      },\n      \"id\": 7,\n      \"options\": {\n        \"footer\": {\n          \"countRows\": true,\n          \"fields\": \"\",\n          \"reducer\": [\n            \"sum\"\n \
    \         ],\n          \"show\": true\n        },\n        \"showHeader\": true,\n        \"sortBy\": [\n          {\n            \"desc\": true,\n            \"displayName\": \"Used Space\"\n    \
    \      }\n        ]\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"Mimir\"\n          },\n          \"expr\":\
    \ \"kubelet_volume_stats_capacity_bytes{cluster=~\\\"$cluster\\\", namespace=~\\\"$namespace\\\"}\",\n          \"format\": \"table\",\n          \"instant\": true,\n          \"legendFormat\": \"\"\
    ,\n          \"refId\": \"Capacity\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"Mimir\"\n          },\n          \"expr\": \"\
    kubelet_volume_stats_used_bytes{cluster=~\\\"$cluster\\\", namespace=~\\\"$namespace\\\"}\",\n          \"format\": \"table\",\n          \"instant\": true,\n          \"legendFormat\": \"\",\n    \
    \      \"refId\": \"Used Space\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"Mimir\"\n          },\n          \"expr\": \"(kubelet_volume_stats_used_bytes{cluster=~\\\
    \"$cluster\\\", namespace=~\\\"$namespace\\\"} / kubelet_volume_stats_capacity_bytes{cluster=~\\\"$cluster\\\", namespace=~\\\"$namespace\\\"}) * 100\",\n          \"format\": \"table\",\n         \
    \ \"instant\": true,\n          \"legendFormat\": \"\",\n          \"refId\": \"Usage Gauge\"\n        }\n      ],\n      \"title\": \"Complete PVC Inventory Listing (All Clusters & Namespaces)\",\n\
    \      \"transformations\": [\n        {\n          \"id\": \"seriesToColumns\",\n          \"options\": {\n            \"byField\": \"persistentvolumeclaim\"\n          }\n        },\n        {\n \
    \         \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n              \"Time\": true,\n              \"Time 1\": true,\n              \"Time 2\": true,\n       \
    \       \"__name__\": true,\n              \"endpoint\": true,\n              \"job\": true,\n              \"metrics_path\": true,\n              \"service\": true,\n              \"cluster 1\": true,\n\
    \              \"cluster 2\": true,\n              \"namespace 1\": true,\n              \"namespace 2\": true,\n              \"persistentvolumeclaim 1\": true,\n              \"persistentvolumeclaim\
    \ 2\": true,\n              \"instance\": true,\n              \"job 1\": true,\n              \"job 2\": true,\n              \"endpoint 1\": true,\n              \"endpoint 2\": true,\n          \
    \    \"instance 1\": true,\n              \"instance 2\": true\n            },\n            \"indexByName\": {},\n            \"renameByName\": {\n              \"Value #Capacity\": \"Max Capacity\"\
    ,\n              \"Value #Used Space\": \"Used Space\",\n              \"Value #Usage Gauge\": \"Usage Gauge\",\n              \"cluster\": \"Cluster\",\n              \"namespace\": \"Namespace\",\n\
    \              \"persistentvolumeclaim\": \"PVC Name\"\n            }\n          }\n        }\n      ],\n      \"type\": \"table\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\"\
    ,\n        \"uid\": \"Mimir\"\n      },\n      \"description\": \"Per-PVC fill level: used / capacity as reported by the kubelet. Red at 90%, amber at 75%. NOTE for RWX volumes backed by the shared\
    \ CephFS NFS export, BOTH used and capacity are statfs() on the whole export, so the figure is the export's fill level rather than that single claim's.\",\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n     \
    \       \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n              \
    \  \"color\": \"#EAB839\",\n                \"value\": 75\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 90\n              }\n            ]\n   \
    \       }\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 20\n      },\n      \"id\": 10,\n      \"options\"\
    : {\n        \"displayMode\": \"gradient\",\n        \"minVizHeight\": 18,\n        \"minVizWidth\": 8,\n        \"orientation\": \"horizontal\",\n        \"showUnfilled\": true,\n        \"reduceOptions\"\
    : {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"valueMode\": \"color\",\n        \"namePlacement\"\
    : \"left\",\n        \"sizing\": \"auto\"\n      },\n      \"pluginVersion\": \"11.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n     \
    \       \"uid\": \"Mimir\"\n          },\n          \"expr\": \"100 * (kubelet_volume_stats_used_bytes{cluster=~\\\"$cluster\\\", namespace=~\\\"$namespace\\\"} / kubelet_volume_stats_capacity_bytes{cluster=~\\\
    \"$cluster\\\", namespace=~\\\"$namespace\\\"})\",\n          \"instant\": true,\n          \"legendFormat\": \"{{cluster}} / {{namespace}} / {{persistentvolumeclaim}}\",\n          \"refId\": \"A\"\
    \n        }\n      ],\n      \"title\": \"PVC Fill Level - Used vs Capacity (red >90%, amber >75%)\",\n      \"type\": \"bargauge\"\n    }\n  ],\n  \"refresh\": \"30s\",\n  \"schemaVersion\": 38,\n\
    \  \"style\": \"dark\",\n  \"tags\": [\n    \"storage\",\n    \"pvc\",\n    \"inventory\",\n    \"capacity\"\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"allValue\": \".*\",\n   \
    \     \"current\": {\n          \"selected\": true,\n          \"text\": \"All\",\n          \"value\": \"$__all\"\n        },\n        \"datasource\": {\n          \"type\": \"prometheus\",\n     \
    \     \"uid\": \"Mimir\"\n        },\n        \"definition\": \"label_values(kubelet_volume_stats_capacity_bytes, cluster)\",\n        \"includeAll\": true,\n        \"label\": \"Cluster Filter\",\n\
    \        \"multi\": true,\n        \"name\": \"cluster\",\n        \"options\": [],\n        \"query\": {\n          \"query\": \"label_values(kubelet_volume_stats_capacity_bytes, cluster)\",\n    \
    \      \"refId\": \"StandardVariableQuery\"\n        },\n        \"refresh\": 1,\n        \"regex\": \"\",\n        \"skipUrlSync\": false,\n        \"sort\": 1,\n        \"type\": \"query\"\n     \
    \ },\n      {\n        \"allValue\": \".*\",\n        \"current\": {\n          \"selected\": true,\n          \"text\": \"All\",\n          \"value\": \"$__all\"\n        },\n        \"datasource\"\
    : {\n          \"type\": \"prometheus\",\n          \"uid\": \"Mimir\"\n        },\n        \"definition\": \"label_values(kubelet_volume_stats_capacity_bytes{cluster=~\\\"$cluster\\\"}, namespace)\"\
    ,\n        \"includeAll\": true,\n        \"label\": \"Namespace Filter\",\n        \"multi\": true,\n        \"name\": \"namespace\",\n        \"options\": [],\n        \"query\": {\n          \"query\"\
    : \"label_values(kubelet_volume_stats_capacity_bytes{cluster=~\\\"$cluster\\\"}, namespace)\",\n          \"refId\": \"StandardVariableQuery\"\n        },\n        \"refresh\": 1,\n        \"regex\"\
    : \"\",\n        \"skipUrlSync\": false,\n        \"sort\": 1,\n        \"type\": \"query\"\n      }\n    ]\n  },\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"timepicker\"\
    : {\n    \"refresh_intervals\": [\n      \"5s\",\n      \"10s\",\n      \"30s\",\n      \"1m\",\n      \"5m\"\n    ]\n  },\n  \"timezone\": \"browser\",\n  \"title\": \"Cluster PVC Inventory & Detailed\
    \ Storage Capacity\",\n  \"uid\": \"cluster-pvc-storage-overview\"\n}"
