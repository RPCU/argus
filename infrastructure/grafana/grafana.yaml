# Grafana — centralised monitoring UI on mgmt managed by Grafana Operator v5.
#
# Declarative Grafana instance definition (DaaS root).
# Connects to Mimir via GrafanaDatasource and authenticates users via Zitadel OIDC.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: "grafana-central"
spec:
  # Grafana configuration (grafana.ini)
  config:
    server:
      root_url: https://grafana.mgmt.rpcu.lan
    users:
      auto_assign_org_role: Admin
    auth.generic_oauth:
      enabled: "true"
      name: "Zitadel"
      allow_sign_up: "true"
      scopes: "openid profile email groups"
      auth_url: "https://rpcu-gabeck.eu1.zitadel.cloud/oauth/v2/authorize"
      token_url: "https://rpcu-gabeck.eu1.zitadel.cloud/oauth/v2/token"
      api_url: "https://rpcu-gabeck.eu1.zitadel.cloud/oauth/v2/userinfo"
      use_pkce: "true"
      role_attribute_path: "'Admin'"
      role_attribute_strict: "false"

  # Deployment specification & env vars for Zitadel OIDC secret
  deployment:
    spec:
      # Recreate avoids Multi-Attach errors on every rollout: the PVC is RWO,
      # so RollingUpdate tries to attach the volume to the new pod before the
      # old pod releases it. Recreate kills the old pod first, then creates the
      # new one with a clean volume attach.
      strategy:
        type: Recreate
      template:
        spec:
          securityContext:
            fsGroup: 472
            runAsNonRoot: true
            runAsUser: 472
          # Mount the PVC declared under spec.persistentVolumeClaim below.
          # grafana-operator v5 CREATES that PVC but does NOT wire it into the
          # Deployment — the generated pod defaults `grafana-data` to an
          # emptyDir, so without this override Grafana ran entirely ephemerally
          # while a 5Gi Cinder volume sat bound and unused (and invisible to the
          # PVC dashboard, since kubelet_volume_stats_* only reports MOUNTED
          # volumes). Overriding the volume by name replaces that emptyDir.
          #
          # Dashboards/datasources are declarative (GrafanaDashboard /
          # GrafanaDatasource CRs) so they always survive a restart; what this
          # actually preserves is the sqlite DB — users/orgs, preferences,
          # annotations and alert state.
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
          containers:
            - name: grafana
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc-conn
                      key: attribute.client_id
                      optional: true
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc-conn
                      key: attribute.client_secret
                      optional: true
              resources:
                requests:
                  # Measured over 7d (Mimir): avg ~29m, P95 ~104m, max ~187m —
                  # dashboard rendering is genuinely bursty. Request set to 120m
                  # (just above P95) so it's not CPU-starved under contention;
                  # trimmed from the original 250m. 1000m limit kept for bursts.
                  cpu: 120m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 2Gi

  # Persistent storage for Grafana state
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
