apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kamaji
spec:
  interval: 5m
  dependsOn:
    - name: kamaji-crds
  chart:
    spec:
      chart: kamaji
      version: "0.0.0+latest"
      sourceRef:
        kind: HelmRepository
        name: kamaji
        namespace: kamaji-system
  # Without an explicit remediation block, retries default to 0: a single
  # failed install leaves the HelmRelease `Stalled`/`RetriesExceeded` forever
  # ("cannot remediate failed release") and only a human running
  # `flux reconcile helmrelease kamaji --force` unsticks it. Observed on the
  # production cluster 2026-08-09: the install timed out on
  # "waiting for: [DataStore/default status: 'NotFound']" and never retried.
  #
  # install.remediation only ever fires when there is NO deployed release yet
  # (fresh cluster bootstrap), so it cannot uninstall a healthy mgmt kamaji.
  # upgrade.remediation uses the default `rollback` strategy.
  #
  # timeout 10m (default 5m): on a cold cluster Helm must wait for cert-manager
  # to issue 5 certificates, a 3-member etcd StatefulSet to become Ready, and
  # the DataStore CR — 5m is marginal.
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: kamaji-values
  # Ballast measures only, never sizes (see AGENTS.md, Ballast). It cut the
  # memory limit to 152-213Mi from 26.9.x usage; 26.10.x watches more kinds
  # and was OOMKilled ~20s after becoming leader (2026-11-08). The chart has no
  # podLabels value, so the label is added by post-render.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kamaji
            patch: |
              - op: add
                path: /spec/template/metadata/labels/ballast.tightlinesoftware.com~1mode
                value: measure
