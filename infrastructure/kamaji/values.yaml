# Kamaji chart values.
#
# ⚠️ The kamaji chart has NO top-level `etcd:`, `datastore:` or `gatewayAPI:`
# keys — everything etcd/datastore related lives under the `kamaji-etcd:`
# SUBCHART (see `condition: kamaji-etcd.deploy` in the chart's Chart.yaml).
# Helm silently ignores unknown top-level keys, so this file used to carry
# three dead blocks that looked authoritative but rendered nothing:
#   etcd.deploy                     -> kamaji-etcd.deploy
#   etcd.persistence.storageClassName -> kamaji-etcd.persistentVolumeClaim.storageClassName
#   datastore.{enabled,name}        -> kamaji-etcd.datastore.{enabled,name}
#   gatewayAPI.enabled              -> does not exist in this chart at all
# Always check `helm show values kamaji/kamaji` before adding a key here.
image:
  # renovate: datasource=docker depName=docker.io/clastix/kamaji
  tag: 26.9.5-edge
replicaCount: 1
resources:
  requests:
    # Kamaji CONTROLLER manager (not etcd). replicaCount: 1 (single reconciler).
    # 72h Mimir (mgmt/production): CPU P95 ~4m, mem P95 ~121Mi / max ~217Mi,
    # 4 restarts → limit ≈ 2.5x max. No CPU limit (request-only policy, §8).
    cpu: 5m
    memory: 128Mi
  limits:
    cpu: null # drop the chart-default 200m CPU limit
    memory: 576Mi
kamaji-etcd:
  deploy: true
  clusterDomain: "mgmt.local"
  # The `default` DataStore CR the tenant control planes bind to. Matches the
  # parent chart's `defaultDatastoreName`. NOTE: this object gets a kamaji
  # finalizer, so tearing the HelmRelease down leaves it stuck Terminating
  # (no controller left to clear the finalizer). A later reinstall then ADOPTS
  # the terminating object and Helm's --wait fails with
  # "timeout waiting for: [DataStore/default status: 'NotFound']".
  # Recovery: `kubectl patch datastore default --type=merge -p
  # '{"metadata":{"finalizers":null}}'` then force-reconcile the HelmRelease.
  datastore:
    enabled: true
    name: default
  # persistentVolumeClaim.storageClassName is DELIBERATELY left unset.
  # A StatefulSet's volumeClaimTemplates are IMMUTABLE, and the live
  # kamaji-etcd StatefulSets on BOTH mgmt and production were created without
  # it (they inherit the cluster-default SC, csi-cinder-sc-delete). Setting it
  # now would make every Helm upgrade fail with "updates to statefulset spec
  # for fields other than 'replicas', ... are forbidden" — and mgmt's etcd
  # holds every tenant control plane's data, including production's own.
  # Only set it when bootstrapping a cluster whose default SC is not Cinder.
  resources:
    requests:
      # Measured (Mimir, 3d): peak ~132m across mgmt+production members,
      # steady-state avg ~40-50m. 500m was ~4x peak and blocked scheduling
      # on a 2-node fleet; 150m is ~1.1x peak with headroom. Memory: 72h
      # P95 ~358Mi / max ~408Mi (above the old 256Mi request); no memory
      # limit on purpose — an OOMKilled member drops every tenant CP's quorum.
      cpu: 150m
      memory: 368Mi
  # Raft timings for slow, shared storage (2026-10-22). etcd's defaults (100ms
  # heartbeat / 1s election) are tuned for local SSDs; these members fsync to
  # Ceph RBD (Cinder) from VMs on CPU-saturated hypervisors. mgmt logged ~8000
  # applies >100ms/h (max ~1s), ~100 slow fdatasync/h and 14 leader elections/h;
  # each election stalled every tenant apiserver (production's included) long
  # enough to fail /livez and lose controller leases. Election timeout stays at
  # 10x heartbeat (etcd guidance). Changing it rolls the StatefulSet one member
  # at a time (PDB maxUnavailable 1); mixed timings during the roll are fine.
  extraArgs:
    - --heartbeat-interval=500
    - --election-timeout=5000
  # Spread the 3 etcd members across distinct nodes. Without this, node
  # churn (CAPI remediation) packed 2/3 members onto ONE worker (observed
  # 2026-07-07), so a single node degraded EVERY tenant control plane.
  #
  # PREFERRED (not required): the mgmt fleet is currently 2 workers, and
  # `required` left the 3rd member Pending forever. `preferred` lets all 3
  # members fit on 2 nodes (two may co-locate). TRADEOFF: losing the node
  # that hosts 2 members drops etcd below quorum (2/3) until reschedule —
  # accepted for a 2-node fleet. Restore `required` when a 3rd worker exists.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - kamaji-etcd
            topologyKey: "kubernetes.io/hostname"
  # The preferred anti-affinity alone still let ALL 3 mgmt members land on one
  # worker (observed 2026-10-22: every member fsyncing from the same VM on the
  # busiest hypervisor). A hard skew of 1 forces 2+1 on a 2-node fleet while
  # still allowing 3 members on 2 nodes. nodeTaintsPolicy: Honor keeps the
  # tainted mgmt control-plane node out of the domain count — otherwise it is
  # an empty domain and the 3rd member could never be scheduled.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: kamaji-etcd
          app.kubernetes.io/instance: kamaji
