apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: https
  namespace: kgateway-system
  annotations:
    cert-manager.io/cluster-issuer: root-rpcu
    kgateway.dev/per-connection-buffer-limit: "128Mi"
spec:
  gatewayClassName: kgateway
  allowedListeners:
    namespaces:
      from: All
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: gwp-static-ip
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      hostname: "*.rpcu.vpn"
      allowedRoutes:
        namespaces:
          from: All
    - protocol: HTTPS
      port: 443
      name: https
      hostname: "*.rpcu.vpn"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: rpcu-vpn-wildcard-tls
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: gwp-static-ip
  namespace: kgateway-system
spec:
  kube:
    deployment:
      replicas: 3
    envoyContainer:
      resources:
        limits:
          memory: 4Gi
        requests:
          # Envoy dataplane. 7d mem (Mimir): openstack (busiest) ~195Mi max,
          # mgmt 29-153Mi, production 26-72Mi. 1Gi request was ~5x the busiest
          # pod; trimmed to 256Mi (~1.3x peak). Limit kept at 4Gi for burst
          # headroom (config reloads / connection floods).
          memory: 256Mi
    service:
      type: LoadBalancer
      extraAnnotations:
        lbipam.cilium.io/ips: "10.0.0.240"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: kgateway-system # Namespace of the Gateway
  # annotations:
  #   external-dns.alpha.kubernetes.io/controller: ignore # Only if ExternalDNS is enabled
spec:
  parentRefs:
    - name: https
      sectionName: http
      namespace: kgateway-system
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
