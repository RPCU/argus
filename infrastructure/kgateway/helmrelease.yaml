apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: kgateway-system
spec:
  interval: 1m
  dependsOn:
    - name: kgateway-crds
  chart:
    spec:
      chart: kgateway
      version: v2.4.5
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: kgateway-system
  values:
    # kgateway control-plane (controller) container resources. Sized from 72h
    # Mimir history across mgmt/openstack/production (P95/max): mem ~150/156Mi,
    # cpu ~9m. request ~= P95, mem limit ~= 2x max, CPU request-only (no CPU
    # limit — see AGENTS.md Section 8 rationale).
    resources:
      requests:
        cpu: 10m
        memory: 160Mi
      limits:
        memory: 384Mi
