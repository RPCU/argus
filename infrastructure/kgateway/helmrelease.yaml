apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: kgateway-system
spec:
  interval: 1m
  dependsOn:
    - name: kgateway-crds
  chart:
    spec:
      chart: kgateway
      version: 2.4.3
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: kgateway-system
  values:
    # kgateway control-plane (controller) container resources. Sized from 72h
    # Mimir history (max/P95): mem ~168/167Mi, cpu ~14/14m. request ~= observed,
    # mem limit ~= 2x max, CPU request-only (no CPU limit — see AGENTS.md
    # Section 8 rationale). The live pod previously ran with resources: {}
    # (QoS BestEffort).
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
