apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 5m
  releaseName: kyverno
  chart:
    spec:
      chart: kyverno
      # renovate: datasource=helm depName=kyverno registryUrl=https://kyverno.github.io/kyverno/
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Single-replica admission controller — these are opt-in workload clusters,
    # not the platform. HA (3 replicas) would need 3 nodes with podAntiAffinity.
    admissionController:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    backgroundController:
      replicas: 1
      # The oidc-cluster-admin-crd-roles GeneratingPolicy watches every
      # CustomResourceDefinition (full schemas, ~180 on a workload cluster):
      # 256Mi was OOM-killed on test while generating the per-CRD roles.
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 1Gi
    reportsController:
      replicas: 1
      # Ballast measures only, never sizes (see AGENTS.md, Ballast): it sized
      # the CPU request at ~930m (real use, the Kyverno watcher loop), which
      # fits no production node, so the pod stayed Pending and the 3.9.2
      # upgrade stalled (2026-11-08). Back to the 10m request until the CPU
      # use itself is fixed.
      podLabels:
        ballast.tightlinesoftware.com/mode: measure
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    cleanupController:
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    # Webhook scope stays at the chart defaults (kube-system, kyverno and
    # Nodes excluded, the usual resourceFilters). The OIDC guardrails that
    # cover kube-system and Nodes are generated as native
    # ValidatingAdmissionPolicies, which the API server evaluates itself and
    # which ignore these filters; the only Kyverno webhooks left are the add-on
    # lookup (OIDC requests only, failurePolicy Ignore) and the CRD role
    # generator (always Ignore). Kyverno can't wedge the platform this way.
