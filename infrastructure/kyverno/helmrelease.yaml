apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 5m
  releaseName: kyverno
  chart:
    spec:
      chart: kyverno
      # renovate: datasource=helm depName=kyverno registryUrl=https://kyverno.github.io/kyverno/
      version: "3.9.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Single-replica admission controller — these are opt-in workload clusters,
    # not the platform. HA (3 replicas) would need 3 nodes with podAntiAffinity.
    admissionController:
      replicas: 1
    backgroundController:
      replicas: 1
    reportsController:
      replicas: 1
    cleanupController:
      replicas: 1
    # The admission webhook's resourceFilters decide which admission requests are
    # even sent to Kyverno. Keep the chart defaults (which already exclude the
    # kyverno namespace and a long list of controller-owned resources), but ALSO
    # exclude the namespaces that run the platform's own reconcilers so a
    # misbehaving policy can never wedge them. Our OIDC-user guard policies match
    # on the subject's groups, so these are belt-and-suspenders.
    config:
      excludeGroups:
        - system:nodes
        - system:serviceaccounts
      resourceFiltersExcludeNamespaces:
        - kube-system
        - flux-system
        - projectsveltos
        - kyverno
