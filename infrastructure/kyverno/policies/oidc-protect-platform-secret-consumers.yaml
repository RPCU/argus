# Secrets pushed by Sveltos can't be read by OIDC users (no Secret access in
# namespaces holding one, see oidc-tenant-secret-access). Some of them live in
# shared namespaces (default, kamaji-tenants, rpcu) where users may run pods,
# so also close the indirect paths there:
#   - no Pod / workload template that mounts or references (volume, projected
#     volume, env, envFrom) a Sveltos-pushed Secret of its namespace;
#   - no exec / attach / port-forward / ephemeral debug container into a pod
#     that does.
# Needs lookups (the namespace's Sveltos Secrets, the target pod), so it is a
# Kyverno webhook. OIDC humans only; failurePolicy Fail — if Kyverno is down,
# OIDC users can't create pods or exec until it is back (nothing else is
# affected). Namespaces without a Sveltos Secret cost one cached list.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: oidc-protect-platform-secret-consumers
  annotations:
    policies.kyverno.io/title: No indirect access to Sveltos-pushed Secrets for OIDC users
    policies.kyverno.io/category: Argus Platform
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 5
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE, CONNECT]
        resources:
          - pods
          - pods/ephemeralcontainers
          - pods/exec
          - pods/attach
          - pods/portforward
          - replicationcontrollers
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    # OIDC humans only (see kustomization.yaml).
    - name: oidc-user
      # The API server prefixes non-email OIDC usernames with "<issuer>#"
      # (an empty --oidc-username-prefix counts as unset); a bare numeric id
      # is accepted too in case the prefix is ever set to "-".
      expression: >-
        request.userInfo.username.startsWith('https://rpcu-gabeck.eu1.zitadel.cloud#') ||
        request.userInfo.username.matches('^[0-9]+$')
    - name: not-break-glass
      expression: >-
        !has(request.userInfo.groups) ||
        !request.userInfo.groups.exists(g, g in ['system:masters', 'kubeadm:cluster-admins'])
  variables:
    - name: platformSecrets
      expression: >-
        dyn(resource.List('v1', 'secrets', request.namespace,
          {'projectsveltos.io/reason': 'Resources'}).items).filter(i, i.metadata.?labels.orValue({})[?'projectsveltos.io/reason'].orValue('') == 'Resources').map(s, s.metadata.name)
    # exec/attach/port-forward carry options, not the pod: look the pod up.
    - name: podSpec
      expression: >-
        request.?subResource.orValue('') in ['exec', 'attach', 'portforward'] ?
          dyn(resource.Get('v1', 'pods', request.namespace, request.name)).spec :
        request.resource.resource == 'pods' ? object.spec :
        request.resource.resource == 'cronjobs' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        dyn(variables.podSpec.containers) +
        dyn(variables.podSpec.?initContainers.orValue([])) +
        dyn(variables.podSpec.?ephemeralContainers.orValue([]))
    - name: usesPlatformSecret
      expression: >-
        variables.platformSecrets.size() > 0 && (
          variables.podSpec.?volumes.orValue([]).exists(v,
            v.?secret.?secretName.orValue('') in variables.platformSecrets ||
            v.?projected.?sources.orValue([]).exists(s, s.?secret.?name.orValue('') in variables.platformSecrets)) ||
          variables.containers.exists(c,
            c.?env.orValue([]).exists(e, e.?valueFrom.?secretKeyRef.?name.orValue('') in variables.platformSecrets) ||
            c.?envFrom.orValue([]).exists(f, f.?secretRef.?name.orValue('') in variables.platformSecrets)))
  validations:
    - expression: "!variables.usesPlatformSecret"
      messageExpression: >-
        request.?subResource.orValue('') in ['exec', 'attach', 'portforward'] ?
          'This pod uses a Secret managed by the platform (pushed by Sveltos): OIDC users may not exec, attach or port-forward into it.' :
          'This workload would use a Secret managed by the platform (pushed by Sveltos), which OIDC users may not read.'
