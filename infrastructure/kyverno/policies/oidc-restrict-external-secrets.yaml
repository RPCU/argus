# External Secrets reads its cluster-wide stores (ClusterSecretStore
# `vault-backend` → the mgmt Vault) with the platform's credentials, so an
# ExternalSecret an OIDC user points at one would copy platform secrets into
# their namespace. OIDC users may only use SecretStores of their own
# namespace (which authenticate with that namespace's credentials):
#   - no ExternalSecret / PushSecret referencing a ClusterSecretStore or a
#     ClusterGenerator;
#   - no writes to the cluster-scoped ESO kinds (ClusterSecretStore,
#     ClusterExternalSecret, ClusterPushSecret, ClusterGenerator).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: oidc-restrict-external-secrets
  annotations:
    policies.kyverno.io/title: OIDC users may not use the platform's secret stores
    policies.kyverno.io/category: Argus Platform
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  autogen:
    validatingAdmissionPolicy:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: ["externalsecrets", "pushsecrets"]
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources:
          [
            "clustersecretstores",
            "clusterexternalsecrets",
            "clusterpushsecrets",
          ]
      - apiGroups: ["generators.external-secrets.io"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: ["clustergenerators"]
  matchConditions:
    # OIDC humans only (see kustomization.yaml).
    - name: oidc-user
      # The API server prefixes non-email OIDC usernames with "<issuer>#"
      # (an empty --oidc-username-prefix counts as unset); a bare numeric id
      # is accepted too in case the prefix is ever set to "-".
      expression: >-
        request.userInfo.username.startsWith('https://rpcu-gabeck.eu1.zitadel.cloud#') ||
        request.userInfo.username.matches('^[0-9]+$')
    - name: not-break-glass
      expression: >-
        !has(request.userInfo.groups) ||
        !request.userInfo.groups.exists(g, g in ['system:masters', 'kubeadm:cluster-admins'])
  variables:
    - name: clusterScopedKind
      expression: >-
        request.resource.resource in ['clustersecretstores', 'clusterexternalsecrets', 'clusterpushsecrets', 'clustergenerators']
    - name: usesClusterStore
      expression: >-
        !variables.clusterScopedKind && (
          object.spec.?secretStoreRef.?kind.orValue('') == 'ClusterSecretStore' ||
          object.spec.?data.orValue([]).exists(d, d.?sourceRef.?storeRef.?kind.orValue('') == 'ClusterSecretStore') ||
          object.spec.?dataFrom.orValue([]).exists(d,
            d.?sourceRef.?storeRef.?kind.orValue('') == 'ClusterSecretStore' ||
            d.?sourceRef.?generatorRef.?kind.orValue('') == 'ClusterGenerator') ||
          object.spec.?secretStoreRefs.orValue([]).exists(r, r.?kind.orValue('') == 'ClusterSecretStore'))
  validations:
    - expression: "!variables.clusterScopedKind"
      messageExpression: >-
        request.resource.resource + ' are platform-wide and managed by the
        platform: OIDC users may not create, change or delete them.'
    - expression: "!variables.usesClusterStore"
      message: >-
        ClusterSecretStores and ClusterGenerators use the platform's
        credentials: OIDC users may only use a SecretStore of their own
        namespace.
