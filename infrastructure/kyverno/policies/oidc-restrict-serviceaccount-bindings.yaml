# ServiceAccounts are never subject to the guardrails (the platform runs as
# ServiceAccounts), so a human must not be able to give one cluster-wide
# rights and act through it. Deny OIDC humans ClusterRoleBindings whose
# subjects are ServiceAccounts or system:* users/groups. Namespaced
# RoleBindings to ServiceAccounts stay allowed: they only grant rights inside
# that namespace, and RoleBindings in platform namespaces are already denied.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: oidc-restrict-serviceaccount-bindings
  annotations:
    policies.kyverno.io/title: No cluster-wide ServiceAccount bindings from OIDC users
    policies.kyverno.io/category: Argus Platform
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  autogen:
    validatingAdmissionPolicy:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: ["clusterrolebindings"]
  matchConditions:
    # OIDC humans only (see kustomization.yaml).
    - name: oidc-user
      # The API server prefixes non-email OIDC usernames with "<issuer>#"
      # (an empty --oidc-username-prefix counts as unset); a bare numeric id
      # is accepted too in case the prefix is ever set to "-".
      expression: >-
        request.userInfo.username.startsWith('https://rpcu-gabeck.eu1.zitadel.cloud#') ||
        request.userInfo.username.matches('^[0-9]+$')
    - name: not-break-glass
      expression: >-
        !has(request.userInfo.groups) ||
        !request.userInfo.groups.exists(g, g in ['system:masters', 'kubeadm:cluster-admins'])
  validations:
    - expression: >-
        !has(object.subjects) || !object.subjects.exists(s,
          s.kind == 'ServiceAccount' || s.name.startsWith('system:'))
      message: >-
        OIDC users may not bind ServiceAccounts or system:* identities
        cluster-wide. Use a namespaced RoleBinding instead.
