# Safety net for oidc-tenant-secret-access: if Sveltos later pushes a Secret
# into a namespace where OIDC users were granted Secret access, delete that
# grant (RoleBinding `oidc-cluster-admin:secrets`) within two minutes.
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: oidc-revoke-tenant-secret-access
  annotations:
    policies.kyverno.io/title: Revoke OIDC Secret access where platform Secrets appear
    policies.kyverno.io/category: Argus Platform
spec:
  schedule: "*/2 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["*"]
        resources: ["rolebindings"]
  conditions:
    - name: is-tenant-secret-grant
      expression: >-
        object.metadata.name == 'oidc-cluster-admin:secrets' &&
        object.metadata.?labels.orValue({})[?'rbac.argus.rpcu.io/oidc-tenant-secrets'].orValue('') == 'true'
    - name: namespace-holds-platform-secret
      expression: >-
        dyn(resource.List('v1', 'secrets', object.metadata.namespace,
          {'projectsveltos.io/reason': 'Resources'}).items).filter(i, i.metadata.?labels.orValue({})[?'projectsveltos.io/reason'].orValue('') == 'Resources').size() > 0
