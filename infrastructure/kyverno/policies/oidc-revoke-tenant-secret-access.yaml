# Safety net for oidc-tenant-secret-access: if Sveltos later pushes a Secret
# into a namespace where OIDC users were granted Secret access (or the
# namespace belongs to a Helm release in a platform namespace), delete that
# grant (RoleBinding `oidc-cluster-admin:secrets`) within two minutes.
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: oidc-revoke-tenant-secret-access
  annotations:
    policies.kyverno.io/title: Revoke OIDC Secret access where platform Secrets appear
    policies.kyverno.io/category: Argus Platform
spec:
  schedule: "*/2 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["*"]
        resources: ["rolebindings"]
  conditions:
    - name: is-tenant-secret-grant
      expression: >-
        object.metadata.name == 'oidc-cluster-admin:secrets' &&
        object.metadata.?labels.orValue({})[?'rbac.argus.rpcu.io/oidc-tenant-secrets'].orValue('') == 'true'
    # Revoke where a Sveltos Secret appeared, or where the namespace turns out
    # to belong to a Helm release in a platform namespace.
    - name: namespace-not-eligible
      expression: >-
        dyn(resource.List('v1', 'secrets', object.metadata.namespace,
          {'projectsveltos.io/reason': 'Resources'}).items).filter(i, i.metadata.?labels.orValue({})[?'projectsveltos.io/reason'].orValue('') == 'Resources').size() > 0 ||
        dyn(resource.Get('v1', 'namespaces', '', object.metadata.namespace)).metadata.?annotations.orValue({})[?'meta.helm.sh/release-namespace'].orValue('') in
          ['kube-system', 'kube-public', 'kube-node-lease', 'flux-system', 'projectsveltos', 'kyverno']
