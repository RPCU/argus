# oidc-cluster-admin has no cluster-wide Secret access (admission can't stop
# reads, so RBAC must). This grants it back per namespace: for every
# namespace that is NOT a platform namespace, NOT a Sveltos add-on namespace
# and holds NO Secret pushed by Sveltos, a RoleBinding
# `oidc-cluster-admin:secrets` → ClusterRole oidc-cluster-admin:secrets for
# the OIDC groups listed in kube-system/oidc-access-groups (pushed by the
# oidc-rbac Sveltos profile: kube-admin + the cluster's chihiro access
# groups).
#
# Two triggers, same grant:
#   - a Namespace is created/updated → grant it (new namespaces within
#     seconds);
#   - oidc-access-groups changes (access groups edited in chihiro) → rewrite
#     the grant in EVERY eligible namespace with the current groups, so a
#     removed group loses Secret access and an added one gains it.
# oidc-revoke-tenant-secret-access removes a grant when a Sveltos Secret shows
# up later.
#
# GeneratingPolicy webhooks are always failurePolicy Ignore and generation
# happens in the background controller: never in the platform's way.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: oidc-tenant-secret-access
  annotations:
    policies.kyverno.io/title: Per-namespace Secret access for OIDC users outside platform namespaces
    policies.kyverno.io/category: Argus Platform
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  webhookConfiguration:
    timeoutSeconds: 5
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces", "configmaps"]
  matchConditions:
    # Only Namespaces and the one groups ConfigMap (offloaded to the API
    # server, so no other ConfigMap write ever reaches Kyverno).
    - name: namespace-or-groups
      expression: >-
        object.kind == 'Namespace' ||
        (object.kind == 'ConfigMap' && object.metadata.namespace == 'kube-system' &&
         object.metadata.name == 'oidc-access-groups')
  variables:
    - name: platformNamespaces
      expression: "['kube-system', 'kube-public', 'kube-node-lease', 'flux-system', 'projectsveltos', 'kyverno']"
    # The current OIDC groups (empty until Sveltos pushed the ConfigMap).
    - name: groupsData
      expression: >-
        object.kind == 'ConfigMap' ? [object.data.?groups.orValue('')] :
        dyn(resource.List('v1', 'configmaps', 'kube-system').items)
          .filter(c, c.metadata.name == 'oidc-access-groups')
          .map(c, c.data.?groups.orValue(''))
    - name: groups
      expression: >-
        variables.groupsData.size() == 0 ? [] :
        variables.groupsData[0].split(',').map(g, g.trim()).filter(g, g != '')
    - name: subjects
      expression: >-
        variables.groups.map(g, {"apiGroup": "rbac.authorization.k8s.io", "kind": "Group", "name": g})
    # Namespace trigger: that namespace; groups trigger: all of them.
    - name: candidates
      expression: >-
        object.kind == 'Namespace' ? [object] : dyn(resource.List('v1', 'namespaces', '').items)
    # Not platform, not a Sveltos add-on (same rule as oidc-protect-addons),
    # no Sveltos-pushed Secret inside.
    - name: eligible
      expression: >-
        variables.candidates.filter(ns,
          !(ns.metadata.name in variables.platformNamespaces) &&
          !('projectsveltos.io/reason' in ns.metadata.?labels.orValue({})) &&
          !(ns.metadata.?annotations.orValue({})[?'meta.helm.sh/release-namespace'].orValue('') in variables.platformNamespaces) &&
          !(ns.metadata.?labels.orValue({})[?'kustomize.toolkit.fluxcd.io/name'].orValue('') != '' &&
            dyn(resource.List('kustomize.toolkit.fluxcd.io/v1', 'kustomizations',
              ns.metadata.?labels.orValue({})[?'kustomize.toolkit.fluxcd.io/namespace'].orValue(''),
              {'projectsveltos.io/reason': 'Resources'}).items)
              .filter(i, i.metadata.?labels.orValue({})[?'projectsveltos.io/reason'].orValue('') == 'Resources')
              .exists(k, k.metadata.name == ns.metadata.labels['kustomize.toolkit.fluxcd.io/name'])) &&
          dyn(resource.List('v1', 'secrets', ns.metadata.name,
            {'projectsveltos.io/reason': 'Resources'}).items)
            .filter(i, i.metadata.?labels.orValue({})[?'projectsveltos.io/reason'].orValue('') == 'Resources')
            .size() == 0)
    - name: binding
      expression: >-
        {
          "apiVersion": dyn("rbac.authorization.k8s.io/v1"),
          "kind": dyn("RoleBinding"),
          "metadata": dyn({
            "name": "oidc-cluster-admin:secrets",
            "labels": {"rbac.argus.rpcu.io/oidc-tenant-secrets": "true"}
          }),
          "roleRef": dyn({
            "apiGroup": "rbac.authorization.k8s.io",
            "kind": "ClusterRole",
            "name": "oidc-cluster-admin:secrets"
          }),
          "subjects": dyn(variables.subjects)
        }
  generate:
    - expression: >-
        variables.subjects.size() == 0 ||
        variables.eligible.all(ns, generator.Apply(ns.metadata.name, [variables.binding]))
