# oidc-cluster-admin has no cluster-wide Secret access (admission can't stop
# reads, so RBAC must). This grants it back per namespace: for every
# namespace that is NOT a platform namespace, NOT a Sveltos add-on namespace
# and holds NO Secret pushed by Sveltos, a RoleBinding
# `oidc-cluster-admin:secrets` → ClusterRole oidc-cluster-admin:secrets for
# the same OIDC groups oidc-cluster-admin is bound to (read from its
# ClusterRoleBindings). Namespaces users create get it within seconds.
# oidc-revoke-tenant-secret-access removes it when a Sveltos Secret shows up
# later.
#
# GeneratingPolicy webhooks are always failurePolicy Ignore and generation
# happens in the background controller: never in the platform's way.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: oidc-tenant-secret-access
  annotations:
    policies.kyverno.io/title: Per-namespace Secret access for OIDC users outside platform namespaces
    policies.kyverno.io/category: Argus Platform
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  webhookConfiguration:
    timeoutSeconds: 5
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: not-platform-namespace
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'flux-system', 'projectsveltos', 'kyverno']) &&
        !('projectsveltos.io/reason' in object.metadata.?labels.orValue({})) &&
        !(object.metadata.?annotations.orValue({})[?'meta.helm.sh/release-namespace'].orValue('') in
          ['kube-system', 'kube-public', 'kube-node-lease', 'flux-system', 'projectsveltos', 'kyverno'])
  variables:
    - name: namespace
      expression: object.metadata.name
    - name: labels
      expression: object.metadata.?labels.orValue({})
    # A namespace created by a Flux Kustomization that Sveltos pushed is an
    # add-on namespace (same rule as oidc-protect-addons).
    - name: isAddonNamespace
      expression: >-
        variables.labels[?'kustomize.toolkit.fluxcd.io/name'].orValue('') != '' &&
        dyn(resource.List('kustomize.toolkit.fluxcd.io/v1', 'kustomizations',
          variables.labels[?'kustomize.toolkit.fluxcd.io/namespace'].orValue(''),
          {'projectsveltos.io/reason': 'Resources'}).items).filter(i, i.metadata.?labels.orValue({})[?'projectsveltos.io/reason'].orValue('') == 'Resources').exists(k,
            k.metadata.name == variables.labels['kustomize.toolkit.fluxcd.io/name'])
    - name: holdsPlatformSecret
      expression: >-
        dyn(resource.List('v1', 'secrets', variables.namespace,
          {'projectsveltos.io/reason': 'Resources'}).items).filter(i, i.metadata.?labels.orValue({})[?'projectsveltos.io/reason'].orValue('') == 'Resources').size() > 0
    - name: subjects
      expression: >-
        dyn(resource.List('rbac.authorization.k8s.io/v1', 'clusterrolebindings', '').items)
          .filter(b, b.metadata.name.startsWith('oidc-cluster-admin:') && has(b.subjects))
          .map(b, b.subjects[0])
    - name: binding
      expression: >-
        {
          "apiVersion": dyn("rbac.authorization.k8s.io/v1"),
          "kind": dyn("RoleBinding"),
          "metadata": dyn({
            "name": "oidc-cluster-admin:secrets",
            "namespace": variables.namespace,
            "labels": {"rbac.argus.rpcu.io/oidc-tenant-secrets": "true"}
          }),
          "roleRef": dyn({
            "apiGroup": "rbac.authorization.k8s.io",
            "kind": "ClusterRole",
            "name": "oidc-cluster-admin:secrets"
          }),
          "subjects": dyn(variables.subjects)
        }
  generate:
    - expression: >-
        !variables.isAddonNamespace && !variables.holdsPlatformSecret && variables.subjects.size() > 0 ?
          generator.Apply(variables.namespace, [variables.binding]) :
          generator.Apply(variables.namespace, [])
