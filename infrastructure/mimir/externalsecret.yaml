# Ceph S3 credentials for Mimir's blocks_storage backend.
#
# The bucket + its RGW user are provisioned on the OPENSTACK cluster by the
# ObjectBucketClaim in infrastructure/rook/configs/mimir-bucket.yaml, which
# writes AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY into the `mimir-bucket`
# Secret (rook-ceph ns) there. Mimir runs HERE (mgmt), so those two values are
# copied once into the mgmt Vault and pulled back via this ExternalSecret.
#
# The `vault-backend` ClusterSecretStore is scoped to the `secrets-mgmt` KV-v2
# mount, so `remoteRef.key` is relative to it (ESO inserts the KV-v2 `/data/`
# segment itself). The rendered Secret `mimir-s3` is consumed by the Mimir chart
# via `global.extraEnvFrom` (helmrelease.yaml); Mimir's `-config.expand-env=true`
# then expands ${AWS_ACCESS_KEY_ID}/${AWS_SECRET_ACCESS_KEY} in structuredConfig.
#
# NOTE: the ESO Kubernetes-auth role `external-secrets` must include a `mimir`
# policy alongside `crossplane` and `grafana`, and the secret must be seeded —
# see infrastructure/vault/README.md ("Mimir S3 bucket bootstrap"). Until then
# this ExternalSecret is NotReady and Mimir cannot flush blocks to S3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-s3
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mimir-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: mimir
        property: access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: mimir
        property: secret-key
