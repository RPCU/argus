# Grafana Mimir — centralised TSDB receiving remote_write from all clusters.
#
# Deployed in MONOLITHIC mode (single binary, 1 replica) with filesystem
# storage. This is sufficient for 2-3 clusters and can be upgraded to Swift or
# S3-compatible storage later.
#
# The nginx gateway is enabled to provide a single entrypoint for both
# remote_write (POST /api/v1/push) and Prometheus-compatible queries
# (GET /prometheus/...). Grafana connects to mimir-gateway:80/prometheus.
#
# Workload clusters remote_write to https://mimir.mgmt.rpcu.lan/api/v1/push
# (via the mgmt Gateway; see httproute.yaml). The mgmt cluster writes locally
# to http://mimir-gateway.monitoring.svc:80/api/v1/push.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: mimir-distributed
      version: 6.1.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    # --- Global Cluster Domain for mgmt cluster ---
    global:
      clusterDomain: "mgmt.local."

    # --- Top-level Nginx config ---
    nginx:
      config:
        resolver: "10.96.0.10 valid=10s"

    # --- Ingest-storage (Kafka) architecture: DISABLED ---
    # Chart 6.x defaults BOTH `kafka.enabled: true` and the templated
    # `ingest_storage.enabled: true`, so the Renovate major bump to v6 (8f5ff7f)
    # silently switched Mimir onto the experimental Kafka-backed write path and
    # added a whole Kafka StatefulSet (+5Gi PVC) nobody asked for. For a central
    # TSDB serving 2-3 small clusters this is pure overhead: it buys durability
    # and replay semantics that only matter at multi-tenant scale, in exchange
    # for an extra stateful component to run, size and keep alive.
    #
    # Disabling it reverts to the classic distributor -> ingester gRPC path.
    # NOTE: this changes the ingester topology (it drops the partitions ring),
    # so the ingester is recreated on rollout.
    kafka:
      enabled: false

    # --- Minimal lightweight deployment (1 replica per component) ---
    ingester:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      persistentVolume:
        enabled: true
        # KEEP AT 5Gi. A StatefulSet's volumeClaimTemplates are IMMUTABLE, so
        # raising this number does NOT resize an existing PVC — it makes the
        # Helm upgrade fail outright with "updates to statefulset spec for
        # fields other than 'replicas' ... are forbidden", wedging the release.
        #
        # The live STS template already carries 5Gi; the PVC was created earlier
        # at 2Gi and filled up, which is what put the ingester into
        # CrashLoopBackOff ("open /data/tsdb/anonymous/wal/00000256: no space
        # left on device"). The fix is to expand the PVC IN PLACE to match this
        # value (csi-cinder-sc-delete has allowVolumeExpansion: true):
        #
        #   kubectl patch pvc storage-mimir-ingester-0 -n monitoring \
        #     -p '{"spec":{"resources":{"requests":{"storage":"5Gi"}}}}'
        #
        # 5Gi is ample now: the kube-apiserver histogram drop plus the 60s
        # scrape interval cut ingestion roughly 4x.
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 2Gi

    store_gateway:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      readinessProbe:
        initialDelaySeconds: 60
      persistentVolume:
        enabled: true
        size: 2Gi
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
        limits:
          memory: 1Gi

    distributor:
      replicas: 1
      resources:
        requests:
          cpu: 30m
          memory: 64Mi
        limits:
          memory: 512Mi

    querier:
      replicas: 1
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
        limits:
          memory: 1Gi

    query_frontend:
      replicas: 1
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi

    compactor:
      replicas: 1
      readinessProbe:
        initialDelaySeconds: 60
      persistentVolume:
        enabled: true
        size: 2Gi
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
        limits:
          memory: 1Gi

    # --- Filesystem storage & clean memberlist ring for single replica ---
    mimir:
      structuredConfig:
        # Disable the Kafka-backed write path templated in by chart 6.x. Must be
        # set here as well as `kafka.enabled: false` above: that flag only stops
        # the Kafka StatefulSet being deployed, while this is what stops Mimir
        # itself trying to produce to it (otherwise the ingester starts the
        # partitions-ring modules and fails to reach a broker that isn't there).
        ingest_storage:
          enabled: false
        limits:
          # Lowered from 500k. The mgmt Prometheus alone was pushing 313k active
          # series before the kube-apiserver histogram drop; a limit far above
          # what the cluster should ever legitimately emit is not a safety net,
          # it just lets a cardinality explosion land in the ingester's memory
          # before anything complains. 200k is comfortably above the expected
          # post-drop steady state (~150k across all clusters) and low enough to
          # fail loudly and early.
          max_global_series_per_user: 200000
          compactor_blocks_retention_period: 72h
        memberlist:
          join_members:
            - mimir-gossip-ring.monitoring.svc.mgmt.local.
        ingester:
          # REQUIRED when ingest_storage is disabled above. Chart 6.x hardcodes
          # `ingester.push_grpc_method_enabled: false` because the ingest-storage
          # architecture expects every write to arrive via Kafka rather than the
          # Push gRPC API. Turning ingest_storage off without re-enabling this
          # leaves Mimir with no write path at all, and it refuses to start:
          #   "cannot disable Push gRPC method in ingester, while ingest storage
          #    (-ingest-storage.enabled) is not enabled"
          push_grpc_method_enabled: true
          ring:
            unregister_on_shutdown: true
            replication_factor: 1
        common:
          storage:
            backend: filesystem
        compactor:
          data_dir: /data/compactor-data
        blocks_storage:
          backend: filesystem
          filesystem:
            dir: /data/blocks

    # --- Disable heavy/optional subcharts ---
    query_scheduler:
      enabled: false
    ruler:
      enabled: false
    alertmanager:
      enabled: false
    overrides_exporter:
      enabled: false

    # --- Disable built-in MinIO ---
    minio:
      enabled: false

    # --- Disable rollout operator ---
    rollout_operator:
      enabled: false

    # --- nginx gateway for routing ---
    gateway:
      enabledNonEnterprise: true
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      nginx:
        config:
          resolver: "10.96.0.10 valid=10s"
