# Grafana Mimir — centralised TSDB receiving remote_write from all clusters.
#
# Deployed with 1 replica per component and S3 (Ceph RGW) block storage.
#
# WHY S3, NOT FILESYSTEM: the filesystem backend is NOT a shared object store.
# The chart runs ingester/compactor/store-gateway as separate pods, each with
# its OWN PVC, so with `backend: filesystem` the ingester ships blocks to a
# "bucket" only IT can see. The compactor then reports `discovered users ...
# users=0`, never compacts and never applies `compactor_blocks_retention_period`
# — so the ingester PVC grows UNBOUNDED (verified live Aug 2026: 355 uncompacted
# level-1 blocks back 34 days on a 50Gi PVC at 91% full, +~3GB/day) and
# long-term queries return nothing (store-gateway loads 0 blocks). Ceph S3 is a
# real shared bucket: all components see it, compaction + 72h retention work,
# and the ingester PVC shrinks to just head+WAL.
#
# The bucket lives on the openstack cluster's Ceph RGW; mgmt reaches it over the
# VPN at https://s3.rpcu.vpn. Credentials come from the `mimir-s3` Secret
# (externalsecret.yaml) injected via `global.extraEnvFrom` and expanded into the
# config by Mimir's `-config.expand-env=true` (${AWS_ACCESS_KEY_ID}/…).
#
# The nginx gateway is enabled to provide a single entrypoint for both
# remote_write (POST /api/v1/push) and Prometheus-compatible queries
# (GET /prometheus/...). Grafana connects to mimir-gateway:80/prometheus.
#
# Workload clusters remote_write to https://mimir.mgmt.rpcu.lan/api/v1/push
# (via the mgmt Gateway; see httproute.yaml). The mgmt cluster writes locally
# to http://mimir-gateway.monitoring.svc:80/api/v1/push.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: mimir-distributed
      version: 6.2.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    # --- Global Cluster Domain for mgmt cluster ---
    global:
      clusterDomain: "mgmt.local."
      # Inject the Ceph S3 bucket credentials into EVERY Mimir pod. The
      # `mimir-s3` Secret is rendered by externalsecret.yaml from the mgmt Vault
      # and carries AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY; Mimir expands
      # ${AWS_ACCESS_KEY_ID}/${AWS_SECRET_ACCESS_KEY} in the S3 config below via
      # the chart's default `-config.expand-env=true`.
      extraEnvFrom:
        - secretRef:
            name: mimir-s3

    # --- Top-level Nginx config ---
    nginx:
      config:
        resolver: "10.96.0.10 valid=10s"

    # --- Ingest-storage (Kafka) architecture: DISABLED ---
    # Chart 6.x defaults BOTH `kafka.enabled: true` and the templated
    # `ingest_storage.enabled: true`, so the Renovate major bump to v6 (8f5ff7f)
    # silently switched Mimir onto the experimental Kafka-backed write path and
    # added a whole Kafka StatefulSet (+5Gi PVC) nobody asked for. For a central
    # TSDB serving 2-3 small clusters this is pure overhead: it buys durability
    # and replay semantics that only matter at multi-tenant scale, in exchange
    # for an extra stateful component to run, size and keep alive.
    #
    # Disabling it reverts to the classic distributor -> ingester gRPC path.
    # NOTE: this changes the ingester topology (it drops the partitions ring),
    # so the ingester is recreated on rollout.
    kafka:
      enabled: false

    # --- Minimal lightweight deployment (1 replica per component) ---
    ingester:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      persistentVolume:
        enabled: true
        # With S3 block storage the ingester PVC holds ONLY the TSDB head + WAL
        # (blocks are shipped to Ceph S3, not kept locally), so it no longer
        # grows with retention. Measured head+WAL is ~2-3Gi; 10Gi is headroom
        # for WAL-replay spikes on restart. This is a REDUCTION from the old
        # 50Gi filesystem-store volume.
        #
        # SHRINKING is not an in-place operation: a StatefulSet's
        # volumeClaimTemplates are immutable and CSI cannot shrink a bound PVC.
        # After this lands, the old 50Gi volume keeps serving until the
        # StatefulSet + its PVC are recreated. One-time migration (data on the
        # old PVC is disposable — it is WAL/head that re-replays from the
        # remote_write senders):
        #   kubectl -n monitoring delete statefulset mimir-ingester --cascade=orphan
        #   kubectl -n monitoring delete pod mimir-ingester-0
        #   kubectl -n monitoring delete pvc storage-mimir-ingester-0
        #   flux -n flux-system reconcile kustomization mimir --with-source
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 2Gi

    store_gateway:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      readinessProbe:
        initialDelaySeconds: 60
      persistentVolume:
        enabled: true
        # Holds only per-block index-headers downloaded from S3 (not full
        # blocks); small but scales with block count. 5Gi is ample headroom.
        size: 5Gi
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
        limits:
          memory: 1Gi

    distributor:
      replicas: 1
      resources:
        requests:
          cpu: 30m
          memory: 64Mi
        limits:
          memory: 512Mi

    querier:
      replicas: 1
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
        limits:
          memory: 1Gi

    query_frontend:
      replicas: 3
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 512Mi

    compactor:
      replicas: 1
      readinessProbe:
        initialDelaySeconds: 60
      persistentVolume:
        enabled: true
        # Scratch space: the compactor downloads source blocks from S3 to /data
        # to merge them locally, then uploads the result. Must fit several
        # source blocks + the output at once; 2Gi was fine only because
        # compaction never ran. 10Gi for the real workload.
        size: 10Gi
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
        limits:
          memory: 1Gi

    # --- S3 storage & clean memberlist ring for single replica ---
    mimir:
      structuredConfig:
        # Disable the Kafka-backed write path templated in by chart 6.x. Must be
        # set here as well as `kafka.enabled: false` above: that flag only stops
        # the Kafka StatefulSet being deployed, while this is what stops Mimir
        # itself trying to produce to it (otherwise the ingester starts the
        # partitions-ring modules and fails to reach a broker that isn't there).
        ingest_storage:
          enabled: false
        limits:
          # Guard rail against a cardinality explosion, NOT a target. Must stay
          # comfortably ABOVE the real series count or Mimir rejects writes with
          # 400 err-mimir-max-series-per-user and the whole pipeline silently
          # stops storing data.
          #
          # Do NOT size this from the projected post-relabel count. Dropping a
          # metric only stops NEW samples: the existing series stay in the
          # Prometheus head until the ~2h head-block rotation, so for a couple of
          # hours after a relabel change the pushed series count is still the OLD
          # one. Setting 200k against a projected ~108k did exactly this and put
          # remote_write into 81% failure (2.19M of 2.70M samples rejected) while
          # the head was still at 323k.
          #
          # CRITICAL: this is enforced against the ingester's MEMORY series
          # (cortex_ingester_memory_series), NOT its ACTIVE series
          # (cortex_ingester_active_series). Those diverge hugely during a
          # transition: measured 144,039 active but 412,417 in memory, because
          # Prometheus replays its remote-write WAL backlog (re-pushing the very
          # series we just dropped) and idle series are not purged until head
          # compaction ~2h later. Sizing against the active count is what made
          # both 200k and 400k reject writes.
          #
          # 600k is headroom for that transient peak plus the other clusters
          # writing into this same tenant. Steady state is ~144k, so this still
          # fails loudly long before the ingester exhausts its PVC.
          max_global_series_per_user: 600000
          compactor_blocks_retention_period: 72h
        memberlist:
          join_members:
            - mimir-gossip-ring.monitoring.svc.mgmt.local.
        ingester:
          # REQUIRED when ingest_storage is disabled above. Chart 6.x hardcodes
          # `ingester.push_grpc_method_enabled: false` because the ingest-storage
          # architecture expects every write to arrive via Kafka rather than the
          # Push gRPC API. Turning ingest_storage off without re-enabling this
          # leaves Mimir with no write path at all, and it refuses to start:
          #   "cannot disable Push gRPC method in ingester, while ingest storage
          #    (-ingest-storage.enabled) is not enabled"
          push_grpc_method_enabled: true
          ring:
            unregister_on_shutdown: true
            replication_factor: 1
        # --- S3 (Ceph RGW) shared object store ---
        # `common.storage` sets the default backend for blocks/ruler/alertmanager
        # so every component talks to the SAME bucket. Ceph RGW is reached over
        # the VPN at https://s3.rpcu.vpn (gateway TLS on 443). Credentials come
        # from ${AWS_*} env (global.extraEnvFrom -> mimir-s3).
        #
        # TLS knobs, do NOT confuse the two:
        #   insecure: false           -> keep HTTPS (the endpoint is on 443).
        #   http.insecure_skip_verify -> skip cert verification (mgmt has no
        #                                RPCU trust bundle; same choice as every
        #                                other internal-VPN client in this repo).
        # `insecure: true` would switch to PLAINTEXT http and fail against the
        # HTTPS gateway.
        #
        # bucket_lookup_type: path  -> Ceph RGW serves path-style buckets, not
        #                              AWS virtual-host subdomains.
        # dualstack_enabled: false  -> the AWS IPv6 dualstack endpoint rewrite
        #                              is meaningless for Ceph and breaks DNS.
        # Only `common.storage` is set: Mimir propagates it to blocks_storage
        # (and ruler/alertmanager) automatically, so every component reads and
        # writes the SAME bucket. Do not also pin blocks_storage.s3 — a partial
        # override there would shadow the common block per-field and is easy to
        # get subtly wrong.
        common:
          storage:
            backend: s3
            s3:
              endpoint: s3.rpcu.vpn
              bucket_name: mimir
              access_key_id: ${AWS_ACCESS_KEY_ID}
              secret_access_key: ${AWS_SECRET_ACCESS_KEY}
              insecure: false
              bucket_lookup_type: path
              dualstack_enabled: false
              http:
                insecure_skip_verify: true

    # --- Disable heavy/optional subcharts ---
    # query_scheduler MUST stay enabled. Chart 6.x unconditionally templates
    #   frontend.scheduler_address        = mimir-query-scheduler-headless...
    #   frontend_worker.scheduler_address = mimir-query-scheduler-headless...
    # into the Mimir config REGARDLESS of this flag. Disabling it therefore does
    # not remove the dependency, it just deletes the Service the config points
    # at, and both the query-frontend and the querier then spin forever on
    #   "failed DNS A record lookup: mimir-query-scheduler-headless...
    #    no such host"
    # Queriers never register for work, so EVERY query hangs until the caller
    # gives up - which surfaces in Grafana as "upstream request timeout" and
    # dashboards that are permanently empty even though ingestion is healthy.
    #
    # It is one small pod; that is the price of a working read path. If it ever
    # needs removing again, the scheduler_address keys must be blanked out and
    # frontend_worker pointed at the query-frontend directly.
    query_scheduler:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
    ruler:
      enabled: false
    alertmanager:
      enabled: false
    overrides_exporter:
      enabled: false

    # --- Disable built-in MinIO ---
    minio:
      enabled: false

    # --- Disable rollout operator ---
    rollout_operator:
      enabled: false

    # --- nginx gateway for routing ---
    gateway:
      enabledNonEnterprise: true
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      nginx:
        config:
          resolver: "10.96.0.10 valid=10s"
