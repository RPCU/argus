# kube-prometheus-stack HelmRelease — shared base for mgmt and workload clusters.
#
# This base is deployed:
#   - On mgmt: via clusters/mgmt/monitoring.yaml (Flux Kustomization with patches)
#   - On workloads: via the monitoring Sveltos ClusterProfile (pushes a Flux
#     Kustomization pointing here, with per-cluster patches)
#
# Per-cluster customisation (remoteWrite URL, externalLabels) is applied via
# Flux Kustomization patches on the HelmRelease values — NOT in this file.
# This keeps the base DRY: one set of manifests, N clusters.
#
# Grafana is DISABLED here — it is deployed separately on the mgmt cluster only
# (infrastructure/grafana). Workload clusters only run Prometheus + exporters
# and remote_write all metrics to the centralised Mimir on mgmt.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.1.4
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  # Upgrade strategy: force to handle CRD changes gracefully.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # --- Grafana: disabled (deployed separately on mgmt only) ---
    grafana:
      enabled: false

    # --- Default alerting/recording rules ---
    # The kube-apiserver SLO rule groups are DISABLED because they are built on
    # apiserver_request_duration_seconds_bucket, which we drop below (see the
    # cardinality note). Leaving them enabled would evaluate rules against a
    # metric that no longer exists — permanently empty recording rules and
    # alerts that can never fire. Disabling them is also a memory saving in
    # itself: the burnrate group alone is ~30 recording rules over the highest
    # cardinality series in the cluster.
    defaultRules:
      rules:
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
        # These two recording-rule groups are built directly on cAdvisor
        # metrics we drop below (container_memory_cache, container_memory_swap),
        # so they would evaluate to nothing forever. Same rationale as the
        # kubeApiserver* groups above: an empty recording rule is pure cost.
        #
        # NOTE container_memory_swap was ALREADY unusable before this change —
        # the chart's own default cAdvisor relabelings drop
        # `container_memory_(mapped_file|swap)`, so k8s.rules.container_memory_swap
        # has been evaluating against a non-existent metric all along.
        k8sContainerMemoryCache: false
        k8sContainerMemorySwap: false

    # --- kube-apiserver scrape: drop the high-cardinality histograms ---
    # MEASURED on mgmt (6 nodes): the Prometheus head held 313,505 active series,
    # of which these nine bucket metrics alone were ~164,000 — 53% of the total.
    # A Prometheus head costs roughly 2-4 KB per active series, so those buckets
    # were on their own worth ~0.5 GB of RSS, which is why a 1Gi limit could only
    # ever OOM-loop. They are per-(resource x verb x le) histograms and explode
    # on a CAPI management cluster because of the CRD count.
    #
    # This REPLACES the chart's own default metricRelabelings, which only dropped
    # selected `le` values of a few of these. Dropping the whole metric is a
    # superset of that rule, so nothing is lost by replacing it.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          # (1) Whole histogram FAMILIES (_bucket + _sum + _count). Dropping the
          # buckets but keeping _sum/_count would leave the two most expensive
          # offenders' tails behind (etcd_request_duration_seconds_sum/_count
          # were 3,926 series each) for data nothing queries once the SLO rule
          # groups are off.
          - action: drop
            sourceLabels: [__name__]
            regex: (apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_slo_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|apiserver_request_body_size_bytes|apiserver_response_sizes|etcd_request_duration_seconds)_(bucket|sum|count)
          # (2) Metrics that are simply not pertinent here:
          #   kubernetes_feature_enabled            2,178 - a STATIC list of
          #     feature-gate names/stages. It never changes at runtime; it is
          #     configuration, not telemetry.
          #   apiextensions_openapi_v2/v3_regen     4,263 - per-CRD OpenAPI spec
          #     regeneration counters. Pure apiserver-internal bookkeeping, and
          #     they scale with CRD count, which is exactly what is large here.
          #   apiserver_{storage,cache}_list_*     ~11,200 - six near-identical
          #     per-resource list-accounting families. Useful when debugging
          #     apiserver LIST amplification; dead weight the other 99% of time.
          #   etcd_requests_total                   3,926 - per-(operation x type)
          #     counter already covered by the kubeEtcd job for alerting.
          - action: drop
            sourceLabels: [__name__]
            regex: (kubernetes_feature_enabled|etcd_requests_total|apiextensions_openapi_v2_regeneration_count|apiextensions_openapi_v3_regeneration_count|apiserver_storage_list_.*|apiserver_cache_list_.*|apiserver_resource_objects)
    # kubelet: prober_probe_duration_seconds is a per-(pod x container x probe)
    # histogram (2,736 series) reporting how long liveness/readiness probes take.
    # Probe FAILURES surface as pod restarts and events, which are already
    # covered; probe latency is not something anyone alerts on here.
    # --- kubelet ---
    # MEASURED on the openstack cluster (3 nodes, ~1,866 containers): the
    # kubelet ServiceMonitor was 115,314 of 198,679 total series — 58% of the
    # entire head — split across its three endpoints:
    #
    #   /metrics/cadvisor   82,526
    #   /metrics/probes     16,550
    #   /metrics            16,238
    #
    # The kubelet ServiceMonitor scrapes THREE separate endpoints and the chart
    # exposes a SEPARATE relabeling list for each. Putting a rule in the wrong
    # one silently does nothing — see the probes note below.
    #
    # A target-level `relabelings` adds the `node` label (Kubernetes node name)
    # to every kubelet time series, matching what node-exporter already does.
    # This is required for dashboards that filter cAdvisor metrics by node
    # (e.g. pod-io-overview).
    kubelet:
      serviceMonitor:
        # Target-level relabeling: add `node` label (Kubernetes node name) to
        # ALL kubelet endpoints (/metrics, /metrics/cadvisor, /metrics/probes).
        # Without this, cAdvisor metrics only carry `instance` (IP:port) and
        # `pod`, so dashboards that filter by `node=~"$node"` (e.g.
        # pod-io-overview) would show nothing. node-exporter already adds this
        # via its own relabeling; this mirrors the same for kubelet.
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: node
        # ---- endpoint 1: /metrics ----
        metricRelabelings:
          # KEEP the chart's own default first — setting metricRelabelings
          # REPLACES it wholesale, and dropping this by accident would quietly
          # re-inflate kubelet storage-operation bucket cardinality.
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        # ---- endpoint 2: /metrics/probes ----
        # BUGFIX: the prober_probe_duration_seconds drop used to live in
        # `metricRelabelings` above, which only applies to the /metrics
        # endpoint. That metric is served by /metrics/probes, so the rule NEVER
        # FIRED and the metric kept being ingested — 12,960 series measured on
        # the openstack cluster, 6.5% of the whole head, while AGENTS.md
        # recorded it as dropped. Probe FAILURES surface as pod restarts and
        # events, which are already covered; probe LATENCY is not something
        # anyone alerts on here.
        probesMetricRelabelings:
          - action: drop
            sourceLabels: [__name__]
            regex: prober_probe_duration_seconds_(bucket|sum|count)
        # ---- endpoint 3: /metrics/cadvisor ----
        # cAdvisor emits ~45 metric families for EVERY container, so its cost
        # scales with container count, not with anything anyone looks at. On
        # the openstack cluster that is 82,526 series to support exactly two
        # metrics that our dashboards and the chart's alerts actually use
        # (container_cpu_usage_seconds_total, container_memory_working_set_bytes).
        #
        # The first SEVEN rules are the chart's OWN defaults, reproduced
        # verbatim: setting cAdvisorMetricRelabelings REPLACES the default list
        # wholesale, so omitting them would UNDO existing drops and INCREASE
        # cardinality — the opposite of the intent. Everything after the
        # `--- additions ---` marker is new.
        #
        # KEPT deliberately: container_cpu_usage_seconds_total,
        # container_memory_working_set_bytes, container_memory_rss,
        # container_memory_usage_bytes, container_oom_events_total,
        # container_network_{receive,transmit}_bytes_total,
        # container_cpu_cfs_{periods,throttled_periods}_total (throttling),
        # container_start_time_seconds, and the machine_* facts.
        cAdvisorMetricRelabelings:
          # --- chart defaults (do not remove) ---
          - action: drop
            sourceLabels: [__name__]
            regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
          - action: drop
            sourceLabels: [__name__]
            regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
          - action: drop
            sourceLabels: [__name__]
            regex: container_memory_(mapped_file|swap)
          - action: drop
            sourceLabels: [__name__]
            regex: container_(file_descriptors|tasks_state|threads_max)
          - action: drop
            sourceLabels: [__name__, scope]
            regex: container_memory_failures_total;hierarchy
          - action: drop
            sourceLabels: [__name__, interface]
            regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
          - action: drop
            sourceLabels: [__name__]
            regex: container_spec.*
          # --- additions ---
          # Per-DEVICE block IO, one series per (container x device x operation).
          # Largest single offender at 5,268 series. Real disk behaviour is
          # answered by node-exporter at the node/device level, which is where
          # anyone actually looks when Ceph or a VM is slow.
          #
          # NOTE: container_fs_reads_total and container_fs_writes_total (IOPS
          # counters) are deliberately KEPT — they power the Pod I/O dashboard
          # (pod-io-overview) which identifies which pod is driving load on a
          # congested device. Throughput bytes (container_fs_read_bytes_total /
          # container_fs_write_bytes_total) are still dropped — node-level
          # throughput is on the Node Disk I/O dashboard.
          - action: drop
            sourceLabels: [__name__]
            regex: container_blkio_device_usage_total|container_fs_(read|write)_bytes_total
          # PSI pressure: SIX families x 1,866 containers = 11,196 series.
          # Node-level PSI from node-exporter is the useful signal; per-container
          # PSI is not queried anywhere in this repo.
          - action: drop
            sourceLabels: [__name__]
            regex: container_pressure_(cpu|io|memory)_(waiting|stalled)_seconds_total
          # cgroup memory internals. working_set/rss/usage are kept above and are
          # what every dashboard and alert uses; these are the accounting
          # breakdowns behind them. ~11k series.
          # (This also catches the scope=container half of
          # container_memory_failures_total that the chart default leaves behind.)
          - action: drop
            sourceLabels: [__name__]
            regex: container_memory_(cache|failcnt|kernel_usage|max_usage_bytes|total_active_file_bytes|total_inactive_file_bytes|failures_total)
          # Process/task accounting — never referenced by any dashboard or alert.
          - action: drop
            sourceLabels: [__name__]
            regex: container_(threads|processes|sockets|ulimits_soft)
          # container_last_seen and container_health_state are cAdvisor
          # bookkeeping; pod health comes from kube-state-metrics.
          # cpu_load_d_average_10s is a 10s sample that is useless at a 60s
          # scrape interval.
          - action: drop
            sourceLabels: [__name__]
            regex: container_(last_seen|health_state|cpu_load_d_average_10s)
          # Keep BYTES for network; drop packet counters and per-interface
          # error/drop counters (6 families, ~9k series). NIC errors that matter
          # are visible on the host via node-exporter.
          - action: drop
            sourceLabels: [__name__]
            regex: container_network_(receive|transmit)_(errors_total|packets_total|packets_dropped_total)

    # --- Prometheus ---
    prometheus:
      prometheusSpec:
        # This Prometheus is a SHIPPER, not a store: every sample is
        # remote_written to the central Mimir, which owns long-term retention
        # (compactor_blocks_retention_period). Local retention therefore only
        # needs to cover remote-write buffering and short "what is happening
        # right now" queries, so it is deliberately short. Cutting 72h -> 6h
        # shrinks the on-disk blocks and, more importantly, the number of
        # memory-mapped head chunks Prometheus keeps resident.
        retention: 6h
        retentionSize: 3GB
        # walCompression is the chart default but pinned explicitly: it roughly
        # halves WAL size/IO, which matters on Cinder-backed PVCs.
        walCompression: true
        # 30s -> 60s halves the ingestion rate (measured 10,903 samples/sec).
        # This is the deliberate "sacrifice a bit of responsiveness" trade: the
        # worst case is noticing a change up to 60s later.
        scrapeInterval: 60s
        evaluationInterval: 60s
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
        # Sized from the post-drop series count (~150k), not guessed. Requests
        # are what the scheduler reserves; the limit is headroom for WAL replay
        # and query spikes. No CPU limit on purpose — CFS throttling a scrape
        # loop causes missed scrapes, and the same rationale is already applied
        # to the Ceph and OVN daemons elsewhere in this repo.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi
        # GOMEMLIMIT is the key to "resilient instead of OOM-looping". A cgroup
        # memory limit alone is a CLIFF: Go happily grows the heap until the
        # kernel SIGKILLs it, so the pod dies, replays the WAL, and dies again.
        # GOMEMLIMIT is a SOFT limit that makes the Go GC progressively more
        # aggressive as the heap approaches it, trading CPU for memory instead
        # of being killed. Set to ~80% of the hard limit so there is room for
        # non-heap memory (mmapped chunks, stacks) under the cgroup cap.
        containers:
          - name: prometheus
            env:
              - name: GOMEMLIMIT
                value: "1200MiB"
        externalLabels:
          cluster: mgmt
        remoteWrite:
          - url: http://mimir-gateway.monitoring.svc:80/api/v1/push
            # Bound the remote-write buffers. Unbounded shards are a common
            # hidden source of Prometheus memory growth when the remote is slow
            # or down (as Mimir has been): each shard holds an in-memory queue,
            # so a backlog silently inflates RSS. Capping shards makes the
            # failure mode "remote-write falls behind" rather than "Prometheus
            # OOMs because the remote is unhealthy".
            queueConfig:
              capacity: 2500
              maxShards: 5
              minShards: 1
              maxSamplesPerSend: 1000

    # --- AlertManager ---
    alertmanager:
      enabled: true
      alertmanagerSpec:
        retention: 24h
        storage: {}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    # --- Exporters ---
    nodeExporter:
      enabled: true
    # prometheus-adapter needs a `node` label on node-exporter metrics to map
    # Prometheus time-series to Kubernetes node names. node-exporter only emits
    # `instance` (IP:port) and `nodename` (kernel hostname), not `node`. The
    # kubelet SD meta label `__meta_kubernetes_pod_node_name` carries the
    # Kubernetes node name and is available as a relabel source.
    #
    # NOTE: the node-exporter subchart lives under the `prometheus-node-exporter`
    # key (not `nodeExporter`, which only controls enabled/forceDeployDashboards).
    prometheus-node-exporter:
      prometheus:
        monitor:
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: node
            # Keep the chart's own metrics_path relabeling (the chart adds it
            # by default but replaces it wholesale if we set relabelings).
            - action: replace
              sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
    kubeStateMetrics:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    # kube-state-metrics subchart values — note the hyphenated key, not camelCase.
    # kube-prometheus-stack uses two separate keys: `kubeStateMetrics` (on/off
    # toggle for the parent chart) and `kube-state-metrics` (actual subchart
    # values). The customResourceState config MUST go under the hyphenated key.
    kube-state-metrics:
      # KSM pod resources. The parent-chart `kubeStateMetrics.resources` key
      # above is NOT applied to the pod (it's a toggle namespace) — the actual
      # container resources MUST be set here under the hyphenated subchart key,
      # or the pod runs with resources: {} (QoS BestEffort), which is what the
      # live pod did. Sized from 72h Mimir history (max/P95): mem ~248/175Mi,
      # cpu ~26/24m. request ~= observed, mem limit ~= 2x max, CPU request-only.
      resources:
        requests:
          cpu: 25m
          memory: 192Mi
        limits:
          memory: 384Mi
      # Flux CRD RBAC: the customResourceState auto-generated rules cover the
      # resource types in config.spec.resources, but some chart versions don't
      # wire them into the ClusterRole correctly. Adding the same rules to the
      # top-level rbac.extraRules is a belt-and-suspenders fix — they land in
      # the main kube-state-metrics ClusterRole which is always bound to the SA.
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
              - image.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - buckets
              - helmrepositories
              - helmcharts
              - ocirepositories
              - kustomizations
              - helmreleases
              - alerts
              - providers
              - receivers
              - imagerepositories
              - imagepolicies
              - imageupdateautomations
            verbs: ["list", "watch"]
          - apiGroups:
              - cluster.x-k8s.io
            resources:
              - clusters
              - machines
              - machinedeployments
              - machinesets
            verbs: ["list", "watch"]
          - apiGroups:
              - controlplane.cluster.x-k8s.io
            resources:
              - kubeadmcontrolplanes
            verbs: ["list", "watch"]
          - apiGroups:
              - infrastructure.cluster.x-k8s.io
            resources:
              - openstackclusters
              - openstackmachines
            verbs: ["list", "watch"]
      # kube-state-metrics custom resource state for Flux CRDs.
      # Generates gotk_resource_info metrics with ready/suspended/status labels
      # for Kustomizations, HelmReleases, GitRepositories, HelmRepositories,
      # OCIRepositories, HelmCharts, Buckets, Alerts, Providers, Receivers,
      # ImageRepositories, ImagePolicies, and ImageUpdateAutomations.
      # See: https://fluxcd.io/flux/monitoring/custom-metrics/
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_app_version: [status, history, "0", appVersion]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Bucket resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
              # --- Cluster API (CAPI) CRD metrics ---
              # Generates capi_cluster_info, capi_machine_info, etc. for
              # dashboards and alerts on cluster/machine health and phase.
              - groupVersionKind:
                  group: cluster.x-k8s.io
                  version: v1beta1
                  kind: Cluster
                metricNamePrefix: capi
                metrics:
                  - name: "cluster_info"
                    help: "The current state of a CAPI Cluster resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      phase: [status, phase]
                      ready: [status, conditions, "[type=Ready]", status]
                      controlPlaneReady:
                        [status, conditions, "[type=ControlPlaneReady]", status]
                      infrastructureReady:
                        [
                          status,
                          conditions,
                          "[type=InfrastructureReady]",
                          status,
                        ]
              - groupVersionKind:
                  group: cluster.x-k8s.io
                  version: v1beta1
                  kind: Machine
                metricNamePrefix: capi
                metrics:
                  - name: "machine_info"
                    help: "The current state of a CAPI Machine resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      phase: [status, phase]
                      ready: [status, conditions, "[type=Ready]", status]
                      providerID: [spec, providerID]
              - groupVersionKind:
                  group: cluster.x-k8s.io
                  version: v1beta1
                  kind: MachineDeployment
                metricNamePrefix: capi
                metrics:
                  - name: "machinedeployment_info"
                    help: "The current state of a CAPI MachineDeployment resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      replicas: [status, replicas]
                      readyReplicas: [status, readyReplicas]
                      updatedReplicas: [status, updatedReplicas]
                      availableReplicas: [status, availableReplicas]
                      unavailableReplicas: [status, unavailableReplicas]
              - groupVersionKind:
                  group: cluster.x-k8s.io
                  version: v1beta1
                  kind: MachineSet
                metricNamePrefix: capi
                metrics:
                  - name: "machineset_info"
                    help: "The current state of a CAPI MachineSet resource."
                    each:
                      type: Info
