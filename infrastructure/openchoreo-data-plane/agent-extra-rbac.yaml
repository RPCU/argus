# Extra permissions for the OpenChoreo cluster agent, for resource kinds our
# hestia traits render that the chart's built-in ClusterRole
# (cluster-agent-dataplane-openchoreo-data-plane) does not cover. The chart has
# no hook to extend its rules, hence a separate ClusterRole bound to the same SA.
#
#   - dragonflydb.io/dragonflies: hestia `dragonfly` trait (session stores).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openchoreo-agent-extra
rules:
  - apiGroups: ["dragonflydb.io"]
    resources: ["dragonflies"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openchoreo-agent-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openchoreo-agent-extra
subjects:
  - kind: ServiceAccount
    name: cluster-agent-dataplane
    namespace: openchoreo-data-plane
