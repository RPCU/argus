# prometheus openstack-exporter — exports openstack_* metrics (nova VM counts &
# per-VM status, cinder/neutron/octavia/glance/designate/keystone health &
# quotas) by querying the OpenStack APIs with admin credentials.
#
# Deployed as a plain Deployment (not the upstream Helm chart) because that chart
# is not published to any Helm repo — only packaged locally in the
# openstack-exporter/helm-charts GitHub repo — so it cannot back a Flux
# HelmRelease. Direct manifests are the same approach this repo already uses for
# ORC and gateway-api. Single replica: the exporter is a stateless read-only
# scraper and a second replica would just double the OpenStack API load.
#
# `--endpoint-type internal` matches the clouds.yaml identity_interface so every
# service is reached via in-cluster catalog endpoints. `--disable-slow-metrics` is NOT
# set — the per-tenant limits metrics are wanted for quota panels, and this cloud
# is small (single region, a handful of projects).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstack-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: openstack-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openstack-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openstack-exporter
    spec:
      serviceAccountName: openstack-exporter-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: openstack-exporter
          image: ghcr.io/openstack-exporter/openstack-exporter:1.6.0
          args:
            - "--os-client-config=/etc/openstack/clouds.yaml"
            - "--endpoint-type=internal"
            - "--web.listen-address=:9180"
            - "openstack"
          ports:
            - name: metrics
              containerPort: 9180
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cloud-config
              mountPath: /etc/openstack
              readOnly: true
      volumes:
        - name: cloud-config
          secret:
            secretName: openstack-exporter-cloud-config
---
apiVersion: v1
kind: Service
metadata:
  name: openstack-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: openstack-exporter
spec:
  selector:
    app.kubernetes.io/name: openstack-exporter
  ports:
    - name: metrics
      port: 9180
      targetPort: metrics
      protocol: TCP
---
# Scraped by the openstack kube-prometheus-stack. That Prometheus uses an
# ALLOW-BY-DEFAULT `NotIn` serviceMonitorSelector keyed on
# `state.yaook.cloud/component` (clusters/openstack/monitoring.yaml), so this
# ServiceMonitor — which carries no such yaook label — is picked up
# automatically. The `release: kube-prometheus-stack` label is added anyway so it
# also works on any cluster using the chart's default (label-based) selector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openstack-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: openstack-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openstack-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 55s
