# Renders the os-client-config `clouds.yaml` the exporter reads at
# /etc/openstack/clouds.yaml, from the yaook `keystone-admin` secret.
#
# auth_url is the INTERNAL keystone service (https://keystone.yaook.svc:5000/v3)
# — verified reachable (HTTP 200) from inside the cluster. `verify: false`
# because keystone presents the RPCU bundle CA which the exporter image does not
# trust out of the box; the endpoint is cluster-internal so this is acceptable
# (same `insecure: true` choice the crossplane-provider-openstack ExternalSecret
# makes for the identical endpoint). region_name is `hetzner`
# (KeystoneDeployment.spec.region.name). identity_interface: internal keeps the
# exporter using in-cluster service catalog endpoints, not the public gateway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openstack-exporter-cloud-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: yaook-keystone-admin
    kind: SecretStore
  target:
    name: openstack-exporter-cloud-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        clouds.yaml: |
          clouds:
            openstack:
              region_name: hetzner
              identity_api_version: 3
              identity_interface: internal
              verify: false
              auth:
                username: "{{ .username }}"
                password: "{{ .password }}"
                project_name: "{{ .project_name }}"
                project_domain_name: "{{ .project_domain_name }}"
                user_domain_name: "{{ .user_domain_name }}"
                auth_url: "https://keystone.yaook.svc:5000/v3"
  data:
    - secretKey: username
      remoteRef:
        key: keystone-admin
        property: OS_USERNAME
    - secretKey: password
      remoteRef:
        key: keystone-admin
        property: OS_PASSWORD
    - secretKey: project_name
      remoteRef:
        key: keystone-admin
        property: OS_PROJECT_NAME
    - secretKey: project_domain_name
      remoteRef:
        key: keystone-admin
        property: OS_PROJECT_DOMAIN_NAME
    - secretKey: user_domain_name
      remoteRef:
        key: keystone-admin
        property: OS_USER_DOMAIN_NAME
