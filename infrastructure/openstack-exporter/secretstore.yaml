# ESO plumbing to let the openstack-exporter (ns monitoring) read the yaook
# `keystone-admin` credentials (ns yaook) and render them into a clouds.yaml.
#
# The exporter needs OpenStack ADMIN credentials to enumerate every project's
# servers/quotas (it lists servers with AllTenants=true). yaook already stores
# those as the `keystone-admin` secret in the `yaook` namespace (the
# `yaook-sys-maint` admin user). Rather than copy it by hand, this cross-namespace
# SecretStore reads it — the same pattern as capo-identity / openstack-ccm-identity
# (a monitoring-namespace SA granted read on exactly one secret in another ns).
#
# Scope is deliberately narrow: the Role grants get/list/watch on ONLY the
# `keystone-admin` secret in `yaook`, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openstack-exporter-reader
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openstack-exporter-keystone-admin-reader
  namespace: yaook
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keystone-admin"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openstack-exporter-keystone-admin-reader
  namespace: yaook
subjects:
  - kind: ServiceAccount
    name: openstack-exporter-reader
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openstack-exporter-keystone-admin-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: yaook-keystone-admin
  namespace: monitoring
spec:
  provider:
    kubernetes:
      remoteNamespace: yaook
      server:
        # caProvider reads kube-root-ca.crt from THIS (monitoring) namespace.
        # Must NOT set caProvider.namespace on a namespaced SecretStore — ESO
        # admission rejects it (same caveat as capo-identity's SecretStore).
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: openstack-exporter-reader
