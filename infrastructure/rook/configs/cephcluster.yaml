apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
    allowMultiplePerNode: false
  dashboard:
    enabled: true
  # Prometheus scraping of the Ceph mgr `prometheus` module (rook-ceph-mgr:9283).
  # WITHOUT this the mgr endpoint exists but NOTHING scrapes it: there was no
  # ServiceMonitor in rook-ceph and `spec.monitoring` was empty, so Mimir held
  # ZERO `ceph_*` metrics and every panel on the Ceph Storage Health dashboard
  # was permanently blank. `enabled: true` makes the Rook operator create the
  # `rook-ceph-mgr` ServiceMonitor (target rook-ceph-mgr:9283, the mgr
  # prometheus module which emits the standard `ceph_*` family:
  # ceph_health_status, ceph_osd_up, ceph_pool_bytes_used, ceph_pg_*, …).
  #
  # It is picked up automatically by the openstack kube-prometheus-stack: that
  # Prometheus uses an ALLOW-BY-DEFAULT `NotIn` serviceMonitorSelector keyed on
  # `state.yaook.cloud/component` (clusters/openstack/monitoring.yaml), so any
  # ServiceMonitor WITHOUT that yaook label is scraped — the Rook-generated one
  # has no such label, so no extra selector wiring is required.
  #
  # `metricsDisabled` is left false (default) — we want the metrics. No
  # `monitoring.rulesNamespaceOverride`/PrometheusRule is set: alerting is done
  # centrally via Grafana unified alerting against Mimir
  # (infrastructure/grafana/alerting), not per-cluster PrometheusRules.
  monitoring:
    enabled: true
  # Guaranteed scheduling for the storage daemons on the hyperconverged nodes
  # (they share the hosts with nova-compute VMs and the k8s control plane).
  # Without priorityClassNames the daemons are first in line for eviction under
  # node pressure — mon/osd get node-critical, mgr cluster-critical.
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical
  # Resource requests/limits (previously unset → BestEffort QoS, daemons were
  # the first OOM/eviction victims when VMs used memory — a direct stability
  # risk). Requests guarantee scheduling weight; memory limits bound blast
  # radius. No CPU limits (throttling an OSD/mon hurts tail latency).
  # osd_memory_target is derived from the OSD memory LIMIT, not the request
  # (osd_memory_target_cgroup_limit_ratio 0.8 x POD_MEMORY_LIMIT: 4Gi limit ->
  # 3435973836, verified live 2026-09-28) — keep the 4Gi limit; the request only
  # drives scheduling. mon keeps its 2Gi limit for recovery spikes.
  #
  # 2026-09-28 right-size from 72h Mimir (req ~ p95, no CPU limits): the
  # hypervisors also run Nova VMs the scheduler cannot see, so pod requests are
  # kept honest instead of padded. osd p95 ~260m/2.65Gi (max 325m/2.85Gi) ->
  # 300m/2688Mi; mon p95 ~30m/640Mi (floor 50m: quorum latency); mgr p95
  # ~20m/565Mi. Eviction protection comes from the `system-node-critical`
  # priorityClass above, not the request. History: a 2-CPU OSD request once
  # left <300m free on quinn (8 cores) and wedged the node-pinned OVN dataplane
  # rollout; with no CPU limit the OSD still bursts freely under recovery.
  resources:
    mon:
      requests:
        cpu: 50m
        memory: 656Mi
      limits:
        memory: 2Gi
    mgr:
      requests:
        cpu: 25m
        memory: 576Mi
      limits:
        memory: 1Gi
    osd:
      requests:
        cpu: 300m
        memory: 2688Mi
      limits:
        memory: 4Gi
    # ceph-exporter DaemonSet-style per-node pods (were BestEffort). 72h p95
    # ~15m/19Mi.
    exporter:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 192Mi
  # cluster level storage configuration and selection
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: "lucy"
        devices: # specific devices to use for storage can be specified for each node
          - name: "/dev/disk/by-id/nvme-SAMSUNG_MZVLB1T0HBLR-00000_S4GJNX0R204948" # Whole storage device
      - name: "makise"
        devices:
          - name: "/dev/disk/by-id/nvme-SAMSUNG_MZVLB1T0HALR-00000_S3W6NF0K600883"
      - name: "quinn"
        devices:
          - name: "/dev/disk/by-id/nvme-SAMSUNG_MZVLB1T0HBLR-00000_S4GJNX0R532561"
