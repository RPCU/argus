apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: traffictolicy-ceph-s3
  namespace: rook-ceph
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httproute-ceph-s3
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httproute-ceph-s3-external
  timeouts:
    streamIdle: 600s
