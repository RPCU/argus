# Gateway API + kgateway for OPT-IN workload clusters, delivered as a Flux
# takeover (same pattern as openstack-ccm/openstack-cinder-csi/external-dns).
#
# Deploys:
#   1. kgateway CRDs + controller
#   2. A workload-cluster Gateway (*.cluster.rpcu.lan) using the vault-issuer
#      ClusterIssuer from the cert-manager add-on for TLS
#
# The Gateway API CRDs (upstream experimental channel) are NOT deployed here —
# they are installed on ALL workload clusters by the gateway-api-crds
# ClusterProfile (no opt-in required).
#
# A manually-created Certificate (wildcard-tls) in kgateway-system is signed
# by the vault-issuer (pki-int/sign/cm-<cluster>). The per-cluster PKI role
# allows wildcard certificates and subdomains of <cluster>.rpcu.lan, so
# *.<cluster>.rpcu.lan is accepted. The Gateway references this Certificate's
# TLS secret for termination.
#
# HTTPRoutes attached to this Gateway are synced to Designate by the external-dns
# add-on (domainFilters scoped to <cluster>.rpcu.lan).
#
# Gated by the opt-in label sveltos.argus.rpcu.io/gateway-api: enabled.
#
# dependsOn the gateway-api-crds ClusterProfile: the Gateway API CRDs must
# exist before kgateway CRDs can be installed.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: gateway-api
  namespace: projectsveltos
spec:
  syncMode: ContinuousWithDriftDetection
  dependsOn:
    - gateway-api-crds
  clusterSelector:
    matchLabels:
      type: workload
      sveltos.argus.rpcu.io/gateway-api: enabled
  policyRefs:
    - name: gateway-api-flux-kustomizations
      namespace: projectsveltos
      kind: ConfigMap
---
# Workload resources (Gateway, GatewayParameters, Certificate, HTTPRoute,
# HTTPListenerPolicy) live in a SEPARATE ClusterProfile that dependsOn the ones
# below. This orders them after the Flux Kustomizations that install the Gateway
# API + kgateway CRDs — deploying the Gateway/GatewayParameters CRs before their
# CRDs exist fails with `no matches for kind "GatewayParameters"`. With
# ContinuousWithDriftDetection + this dependency, Sveltos retries until the CRDs
# land and then the CRs apply cleanly.
#
# dependsOn cert-manager: this profile pushes a `Certificate` (cert-manager.io/v1,
# `wildcard-tls`, issuerRef `vault-issuer`) and a Gateway HTTPS listener that
# terminates TLS with the secret cert-manager mints. Without cert-manager the
# `Certificate` kind + the `vault-issuer` ClusterIssuer don't exist, so the CR
# apply fails (`no matches for kind "Certificate"`) and the HTTPS listener has no
# usable cert. NO CYCLE: cert-manager itself only dependsOn `gateway-api-crds`
# (the always-on CRD-only profile), NOT this `gateway-api`/`gateway-api-resources`
# pair, so the edges stay acyclic
# (gateway-api-resources → {gateway-api → gateway-api-crds, cert-manager → gateway-api-crds}).
# Enable the cert-manager add-on (chihiro "Cert-Manager Vault Issuer") on any
# cluster that enables Gateway API.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: gateway-api-resources
  namespace: projectsveltos
spec:
  syncMode: ContinuousWithDriftDetection
  dependsOn:
    - gateway-api
    - cert-manager
  clusterSelector:
    matchLabels:
      type: workload
      sveltos.argus.rpcu.io/gateway-api: enabled
  policyRefs:
    - name: gateway-api-workload-resources
      namespace: projectsveltos
      kind: ConfigMap
---
# Flux Kustomization CRs for the Gateway API CRDs, kgateway CRDs, and
# kgateway controller. Deployed as raw manifests (not templated) because
# they don't need per-cluster values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-api-flux-kustomizations
  namespace: projectsveltos
data:
  kgateway-crds.yaml: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: kgateway-crds
      namespace: flux-system
    spec:
      interval: 10m
      dependsOn:
        - name: gateway-api
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      path: ./infrastructure/kgateway/crds
      prune: true
      wait: true
      timeout: 5m
  kgateway.yaml: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: kgateway
      namespace: flux-system
    spec:
      interval: 10m
      dependsOn:
        - name: kgateway-crds
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      path: ./infrastructure/kgateway
      prune: true
      patches:
        # Strip the openstack-specific Gateway + HTTPListenerPolicy from the base
        # kustomization — workload clusters get these from the templated ConfigMap
        # pushed by this ClusterProfile (hostname *.<cluster>.rpcu.lan, vault-issuer,
        # no Cilium lbipam annotation). Replace the resources list with only
        # helmrelease.yaml so kustomize build skips gateway.yaml and
        # httplistenerpolicy.yaml.
        - patch: |
            $patch: delete
            apiVersion: gateway.networking.k8s.io/v1
            kind: Gateway
            metadata:
              name: https
          target:
            kind: Gateway
            name: https
        - patch: |
            $patch: delete
            apiVersion: gateway.kgateway.dev/v1alpha1
            kind: HTTPListenerPolicy
            metadata:
              name: upgrades
          target:
            kind: Gateway
            name: https
---
# Gateway + Certificate + HTTPListenerPolicy for the workload cluster. The
# Gateway hostname is templated with the cluster name (*.cluster.rpcu.lan).
# Sveltos resolves {{ .Cluster.metadata.name }} before pushing to the workload
# cluster. A manually-created Certificate (wildcard-tls) is signed by the
# vault-issuer; the Gateway references its TLS secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-api-workload-resources
  namespace: projectsveltos
  annotations:
    projectsveltos.io/template: "true"
data:
  gateway.yaml: |
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: https
      namespace: kgateway-system
      annotations:
        cert-manager.io/cluster-issuer: vault-issuer
        kgateway.dev/per-connection-buffer-limit: "128Mi"
    spec:
      gatewayClassName: kgateway
      allowedListeners:
        namespaces:
          from: All
      infrastructure:
        parametersRef:
          group: gateway.kgateway.dev
          kind: GatewayParameters
          name: gwp-static-ip
      listeners:
        - protocol: HTTP
          port: 80
          name: http
          hostname: "*.{{ .Cluster.metadata.name }}.rpcu.lan"
          allowedRoutes:
            namespaces:
              from: All
        - protocol: HTTPS
          port: 443
          name: https
          hostname: "*.{{ .Cluster.metadata.name }}.rpcu.lan"
          allowedRoutes:
            namespaces:
              from: All
          tls:
            mode: Terminate
            certificateRefs:
              - name: wildcard-tls
        # Kamaji tenant control plane API servers — TLS Passthrough for SNI
        # routing. Each tenant cluster gets its own TLSRoute (created by the
        # Kamaji controller) with hostname <tenant>.kcp.<cluster>.rpcu.lan, all
        # routing through this single Gateway listener.
        #
        # PORT 6443 (not 443). Kamaji ALWAYS advertises networkProfile.port
        # (default 6443) in every kubeconfig it generates (the tenant admin
        # kubeconfig AND the CAPI-propagated one) — there is NO field in Kamaji
        # v0.20.0 to override the advertised apiserver port (network.gateway.port
        # only selects which listener the TLSRoute attaches to, it does NOT change
        # the kubeconfig host:port). So the Gateway listener MUST serve on 6443 to
        # match, or every client dials <fqdn>:6443 and times out against a :443
        # listener. Using 6443 also sidesteps the port-443 hostname-uniqueness
        # constraint entirely (it no longer shares a port with the https listener).
        - protocol: TLS
          port: 6443
          name: kcp
          hostname: "*.kcp.{{ .Cluster.metadata.name }}.rpcu.lan"
          allowedRoutes:
            namespaces:
              from: All
          tls:
            mode: Passthrough
        # Kamaji konnectivity server — when the konnectivity addon is enabled and
        # the TCP is exposed via Gateway API (serviceType: ClusterIP), Kamaji
        # creates a SECOND TLSRoute for the konnectivity tunnel. The listener name
        # (konnectivity-server) and port (8132) are HARDCODED by Kamaji; every
        # gateway in the TCP's parentRefs must carry this listener or the
        # worker-node agents can't establish the tunnel (breaks logs/exec/
        # port-forward/metrics). TLS Passthrough, same kcp hostname pattern.
        - protocol: TLS
          port: 8132
          name: konnectivity-server
          hostname: "*.kcp.{{ .Cluster.metadata.name }}.rpcu.lan"
          allowedRoutes:
            namespaces:
              from: All
          tls:
            mode: Passthrough
    ---
    apiVersion: gateway.kgateway.dev/v1alpha1
    kind: GatewayParameters
    metadata:
      name: gwp-static-ip
      namespace: kgateway-system
    spec:
      kube:
        deployment:
          replicas: 3
        envoyContainer:
          resources:
            limits:
              memory: 4Gi
            requests:
              # Envoy dataplane. 7d mem (Mimir): openstack (busiest) ~195Mi
              # max. 1Gi request was ~5x the busiest pod; trimmed to 256Mi
              # (~1.3x peak). Limit kept at 4Gi for burst headroom.
              memory: 256Mi
        service:
          type: LoadBalancer
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: https-redirect
      namespace: kgateway-system
    spec:
      parentRefs:
        - name: https
          sectionName: http
          namespace: kgateway-system
      rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301
  certificate.yaml: |
    # Wildcard certificate for the workload cluster's Gateway. Signed by the
    # vault-issuer (pki-int/sign/cm-<cluster>). The SAN is
    # *.<cluster>.rpcu.lan which matches the Gateway's listener hostname.
    # cert-manager renews at 2/3 of the 90-day lifetime.
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: wildcard-tls
      namespace: kgateway-system
    spec:
      secretName: wildcard-tls
      issuerRef:
        name: vault-issuer
        kind: ClusterIssuer
        group: cert-manager.io
      dnsNames:
        - "*.{{ .Cluster.metadata.name }}.rpcu.lan"
  httplistenerpolicy.yaml: |
    apiVersion: gateway.kgateway.dev/v1alpha1
    kind: HTTPListenerPolicy
    metadata:
      name: upgrades
      namespace: kgateway-system
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: https
      upgradeConfig:
        enabledUpgrades:
          - "websocket"
      accessLog:
        - fileSink:
            path: /dev/stdout
            jsonFormat:
              start_time: "%START_TIME%"
              method: "%REQ(X-ENVOY-ORIGINAL-METHOD?:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              total_duration: "%DURATION%"
              resp_backend_service_time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              req_x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
              user_agent: "%REQ(USER-AGENT)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              authority: "%REQ(:AUTHORITY)%"
              backendHost: "%UPSTREAM_HOST%"
              backendCluster: "%UPSTREAM_CLUSTER%"
