# Dynamic cert sync for kamaji-apiserver-proxy — Sveltos Event Framework.
#
# PROBLEM. The kamaji-apiserver-proxy Caddy daemon needs the TCP's API server
# cert + CA to terminate TLS and to verify its upstream (the tenant API server
# behind the shared SNI Gateway). These Secrets live on the PRODUCTION cluster
# (kamaji-tenants ns), but the proxy runs on WORKLOAD clusters.
#
# ⚠️ PER-TENANT CORRELATION (do NOT regress to a broadcast fan-out).
# Production hosts the Kamaji control planes of MANY workload clusters at once
# (test, lab, …), so its kamaji-tenants ns holds one cert Secret AND one CA
# Secret PER tenant. Each tenant has its OWN CA, so the sync MUST route each
# tenant's material to ITS OWN workload cluster. The ORIGINAL design watched the
# raw Secrets and used a `destinationClusterSelector` matching ALL proxy-enabled
# workload clusters with `oneForEvent` and NO guard, so every tenant's CA fanned
# out to every workload cluster — last event wins. That cross-contaminated `lab`
# with `test`'s CA: Caddy failed upstream TLS (`x509: certificate signed by
# unknown authority`), returned 502 for every request to `kubernetes.default`,
# CoreDNS could not reach the API server (stuck NotReady), the konnectivity agents
# could not resolve the control-plane FQDN (ClusterFirst DNS → dead CoreDNS), the
# tenant API server lost all node connectivity, and the whole cluster wedged.
#
# WHY A NAÏVE ONE-EVENTTRIGGER FIX IS IMPOSSIBLE (all verified live on Sveltos
# v1.13.0 — the tenant Secrets live on PRODUCTION, a workload cluster, while
# Sveltos' management cluster is MGMT):
#   - The raw cert/CA Secrets carry ONLY the opaque TCP UUID
#     (`kamaji.clastix.io/name`), NOT the CAPI cluster name — so a Secret event
#     cannot name a `destinationCluster`.
#   - `secretGenerator` and `templateResourceRefs` fetch from the MANAGEMENT
#     cluster (mgmt) — where `kamaji-tenants` does not even exist — so neither can
#     read the tenant Secrets on production. Only an EventSource `collectResources`
#     ships resource DATA off a source cluster (into `.Resource`/`.Resources`).
#   - `destinationClusterSelector.matchLabels` VALUES are NOT templated (taken
#     literally), so a Secret event cannot be routed by a templated UUID.
#   - The two template stages are mutually exclusive: the event-manager stage has
#     the event data (`.Resource`/`.Resources`) but `.Cluster` = the SOURCE; the
#     addon-controller (deploy) stage has `.Cluster` = the DESTINATION but NO
#     `.Resources` (`can't evaluate field Resources in type currentClusterObjects`).
#   Net: per-tenant routing needs `destinationCluster` templated from the event
#   resource, which needs the CAPI cluster-name ON the resource that ALSO carries
#   the DATA. Only the TenantControlPlane has the cluster-name; only the Secret has
#   the data. So we bridge them in two phases.
#
# SOLUTION (two-phase, both phases use ONLY proven primitives).
#
#   PHASE 1 — stamp the cluster-name onto the tenant Secrets (in place, on
#   production). `kamaji-tcp-label` watches the TenantControlPlane (it carries
#   `cluster.x-k8s.io/cluster-name` AND its `metadata.name` is the exact prefix of
#   the `-api-server-certificate` / `-ca` Secrets). It deploys BACK to the source
#   cluster (`destinationCluster` = production itself) two label patches that add
#   `cluster.x-k8s.io/cluster-name=<cluster>` to those two Secrets. (`.Resource` =
#   the TCP, so both the cluster-name and the secret names are known here.)
#
#   PHASE 2 — sync the now-labelled Secrets per tenant. `kamaji-tcp-certs` watches
#   the cert/CA Secrets (collectResources → `.Resource.data` bytes) and, because
#   PHASE 1 added the cluster-name label, routes each Secret to its OWN workload
#   cluster via `destinationCluster` templated from that label. The deployed
#   template renders the matching Caddy Secret by the source's
#   `kamaji.clastix.io/component` label:
#       - kamaji-apiserver-proxy-tls (cert.pem, key.pem)  ← apiserver.crt/.key
#       - kamaji-apiserver-proxy-ca  (ca.pem)             ← ca.crt
#   in the `default` namespace (forced by the LRP serviceMatcher — see
#   kamaji-apiserver-proxy.yaml). Cross-tenant contamination is now impossible:
#   each Secret is delivered to exactly one cluster.
#
# Kamaji rotation re-fires PHASE 2 (secret checksum change) → fresh material, no
# manual step. New tenants get labelled by PHASE 1 automatically.
#
# Requires cilium + gateway-api: CiliumLocalRedirectPolicy CRD + Gateway CRD.
#
# ─────────────────────────────────────────────────────────────────────────────
# PHASE 1: label the tenant Secrets with their CAPI cluster-name (on production).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: lib.projectsveltos.io/v1beta1
kind: EventSource
metadata:
  name: kamaji-tcp
  namespace: projectsveltos
spec:
  collectResources: true
  resourceSelectors:
    - group: "kamaji.clastix.io"
      version: "v1alpha1"
      kind: "TenantControlPlane"
      namespace: "kamaji-tenants"
      # Only CAPI-owned TCPs (carry the cluster-name label used for routing).
      evaluate: |
        function evaluate()
          hs = {}
          hs.matching = false
          if obj.metadata.labels ~= nil then
            local n = obj.metadata.labels["cluster.x-k8s.io/cluster-name"]
            if n ~= nil and n ~= "" then
              hs.matching = true
            end
          end
          return hs
        end
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: EventTrigger
metadata:
  name: kamaji-tcp-label
  namespace: projectsveltos
spec:
  # Source = production (hosts the TCPs). Deploy the patches BACK to production
  # (destinationCluster = the same cluster) so the Secrets get labelled in place.
  sourceClusterSelector:
    matchLabels:
      type: workload
      cluster.x-k8s.io/cluster-name: production
  destinationCluster:
    apiVersion: cluster.x-k8s.io/v1beta1
    kind: Cluster
    name: production
    namespace: mgmt
  eventSourceName: kamaji-tcp
  syncMode: ContinuousWithDriftDetection
  reloader: true
  oneForEvent: true
  policyRefs:
    - kind: ConfigMap
      name: kamaji-tcp-label-patch
      namespace: projectsveltos
---
# Two label patches (SSA) that stamp cluster.x-k8s.io/cluster-name onto this
# tenant's cert + CA Secrets. `.Resource` = the matched TCP: its metadata.name is
# the Secret name prefix and its label is the cluster name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kamaji-tcp-label-patch
  namespace: projectsveltos
  annotations:
    # instantiate (NOT template): the EventTrigger renders `.Resource` (the event
    # TCP) at the event-manager stage into a fresh ConfigMap; the addon-controller
    # then deploys that verbatim. `.Resource` is NOT available at deploy time.
    projectsveltos.io/instantiate: ok
data:
  patch.yaml: |
    {{- $tcp := .Resource.metadata.name }}
    {{- $cluster := index .Resource.metadata.labels "cluster.x-k8s.io/cluster-name" }}
    apiVersion: v1
    kind: Secret
    metadata:
      name: {{ $tcp }}-api-server-certificate
      namespace: kamaji-tenants
      labels:
        cluster.x-k8s.io/cluster-name: {{ $cluster }}
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: {{ $tcp }}-ca
      namespace: kamaji-tenants
      labels:
        cluster.x-k8s.io/cluster-name: {{ $cluster }}
---
# ─────────────────────────────────────────────────────────────────────────────
# PHASE 2: sync each labelled Secret to ITS OWN workload cluster.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: lib.projectsveltos.io/v1beta1
kind: EventSource
metadata:
  name: kamaji-tcp-certs
  namespace: projectsveltos
spec:
  collectResources: true
  resourceSelectors:
    - group: ""
      version: "v1"
      kind: "Secret"
      namespace: "kamaji-tenants"
      # Match the cert + CA Secrets, but ONLY once PHASE 1 has stamped the
      # cluster-name (otherwise there is no destination to route to).
      evaluate: |
        function evaluate()
          hs = {}
          hs.matching = false
          if obj.metadata.labels ~= nil then
            local c = obj.metadata.labels["kamaji.clastix.io/component"]
            local n = obj.metadata.labels["cluster.x-k8s.io/cluster-name"]
            if (c == "api-server-certificate" or c == "ca")
               and n ~= nil and n ~= "" then
              hs.matching = true
            end
          end
          return hs
        end
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: EventTrigger
metadata:
  name: kamaji-tcp-certs
  namespace: projectsveltos
spec:
  sourceClusterSelector:
    matchLabels:
      type: workload
      cluster.x-k8s.io/cluster-name: production
  # Route each Secret to the ONE workload cluster named by the label PHASE 1
  # stamped on it. This is the per-tenant guard that replaces the fan-out.
  destinationCluster:
    apiVersion: cluster.x-k8s.io/v1beta1
    kind: Cluster
    name: '{{ index .Resource.metadata.labels "cluster.x-k8s.io/cluster-name" }}'
    namespace: mgmt
  eventSourceName: kamaji-tcp-certs
  syncMode: ContinuousWithDriftDetection
  reloader: true
  oneForEvent: true
  policyRefs:
    - kind: ConfigMap
      name: kamaji-tcp-certs-deploy
      namespace: projectsveltos
---
# The workload-cluster payload. Instantiated in the EVENT context (so `.Resource`
# = the matched source Secret, incl. `.data`). Renders the matching Caddy Secret
# by the source's `kamaji.clastix.io/component` label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kamaji-tcp-certs-deploy
  namespace: projectsveltos
  annotations:
    # instantiate (NOT template): the EventTrigger renders `.Resource` (the event
    # Secret, incl. `.data`) at the event-manager stage into a fresh ConfigMap;
    # the addon-controller deploys that verbatim. `.Resource` is NOT available at
    # deploy time (`currentClusterObjects` has no `.Resource`).
    projectsveltos.io/instantiate: ok
data:
  secret.yaml: |
    {{- $component := index .Resource.metadata.labels "kamaji.clastix.io/component" }}
    {{- if eq $component "api-server-certificate" }}
    apiVersion: v1
    kind: Secret
    metadata:
      name: kamaji-apiserver-proxy-tls
      namespace: default
    type: Opaque
    data:
      cert.pem: {{ index .Resource.data "apiserver.crt" }}
      key.pem: {{ index .Resource.data "apiserver.key" }}
    {{- else if eq $component "ca" }}
    apiVersion: v1
    kind: Secret
    metadata:
      name: kamaji-apiserver-proxy-ca
      namespace: default
    type: Opaque
    data:
      ca.pem: {{ index .Resource.data "ca.crt" }}
    {{- end }}
