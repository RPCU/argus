# Kamaji tenant API server in-cluster reachability — Cilium Local Redirect
# Policy + node-local Caddy TLS-termination proxy.
#
# PROBLEM. With the openstack-kamaji-external ClusterClass the tenant API server
# runs as pods on the PRODUCTION cluster and is exposed to the outside world via
# a shared SNI Gateway (TLS Passthrough, hostname <tenant>.kcp.<cluster>.rpcu.lan).
# External clients (kubeconfig, worker kubelets joining, konnectivity agents)
# send that FQDN as TLS SNI, so the Gateway routes them correctly.
#
# But IN-CLUSTER clients reach the API server via kubernetes.default.svc:443.
# kube-proxy/socket-LB does L4 routing with NO SNI, so if that traffic hit the
# shared Gateway it would carry SNI=kubernetes.default.svc (or none) and the
# Gateway could not tell which tenant to route to.
#
# SOLUTION. Caddy terminates TLS with the TCP's API server cert (which has
# kubernetes.default.svc as a SAN — Kubernetes always adds it), then
# reverse-proxies to the Gateway over HTTPS. Caddy's reverse_proxy naturally
# sets the SNI to the upstream hostname, so the Gateway routes correctly via
# TLSRoute.
#
# Traffic flow: pod -> kubernetes.default.svc:443 -> (eBPF LRP) -> local
# Caddy:6443 -> (TLS termination + reverse_proxy with SNI) -> Gateway:6443
# -> TLSRoute -> TCP's kube-apiserver.
#
# CERT SYNC. The TCP's API server cert + CA are synced from the production
# cluster to the workload cluster via the Sveltos Event Framework (see
# kamaji-apiserver-proxy-certs.yaml). EventSources watch TCP Secrets on
# production; EventTriggers deploy them to the workload cluster as:
#   - kamaji-apiserver-proxy-tls (cert.pem, key.pem)
#   - kamaji-apiserver-proxy-ca (ca.pem)
#
# Requires Cilium localRedirectPolicies.enabled: true and kubeProxyReplacement: true.
#
# Gated by the opt-in label sveltos.argus.rpcu.io/kamaji-apiserver-proxy: enabled
# (set on tenant clusters created with the openstack-kamaji-external class).
#
# dependsOn cilium: CiliumLocalRedirectPolicy CRD must exist.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: kamaji-apiserver-proxy
  namespace: projectsveltos
spec:
  syncMode: ContinuousWithDriftDetection
  dependsOn:
    - cilium
  clusterSelector:
    matchLabels:
      type: workload
      sveltos.argus.rpcu.io/kamaji-apiserver-proxy: enabled
      sveltos.argus.rpcu.io/cilium: enabled
  policyRefs:
    - name: kamaji-apiserver-proxy-resources
      namespace: projectsveltos
      kind: ConfigMap
---
# Templated per-cluster: {{ .Cluster.spec.controlPlaneEndpoint.host }} is the
# tenant API server FQDN (e.g. test.kcp.rpcu.io) and doubles as both the
# proxy's upstream host and the SNI value the Gateway routes on. The upstream
# port is the Gateway kcp listener (TLS Passthrough, always 6443 — must match
# the kcp section in the Sveltos gateway-api profile).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kamaji-apiserver-proxy-resources
  namespace: projectsveltos
  annotations:
    projectsveltos.io/template: "true"
data:
  namespace.yaml: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: kamaji-apiserver-proxy
  caddyfile-configmap.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: kamaji-apiserver-proxy-caddyfile
      namespace: kamaji-apiserver-proxy
    data:
      Caddyfile: |
        :6443 {
          tls /etc/caddy/tls/cert.pem /etc/caddy/tls/key.pem
          reverse_proxy https://{{ .Cluster.spec.controlPlaneEndpoint.host }}:{{ .Cluster.spec.controlPlaneEndpoint.port }} {
            transport http {
              tls_trusted_ca_certs /etc/caddy/ca/ca.pem
            }
          }
        }
  daemonset.yaml: |
    # Caddy TLS-termination proxy. One pod per node (LRP backends must be
    # node-local). Caddy terminates TLS with the TCP's API server cert, then
    # reverse-proxies to the Gateway over HTTPS. The reverse_proxy directive
    # naturally sets the SNI to the upstream hostname, so the Gateway routes
    # correctly via TLSRoute.
    #
    # Mounts two Secrets synced from the production cluster via Event Framework:
    #   - kamaji-apiserver-proxy-tls (cert.pem, key.pem) — API server cert
    #   - kamaji-apiserver-proxy-ca (ca.pem) — CA bundle for upstream verification
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: kamaji-apiserver-proxy
      namespace: kamaji-apiserver-proxy
      labels:
        app.kubernetes.io/name: kamaji-apiserver-proxy
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: kamaji-apiserver-proxy
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kamaji-apiserver-proxy
        spec:
          priorityClassName: system-node-critical
          # Use the NODE's resolv.conf, NOT cluster CoreDNS. Caddy's upstream is
          # the DNS name {{ .Cluster.spec.controlPlaneEndpoint.host }}, which must
          # be resolvable to bootstrap the cluster. But CoreDNS itself depends on
          # this proxy to reach the API server (kubernetes.default), so resolving
          # the upstream via CoreDNS would deadlock: CoreDNS NotReady -> proxy 502
          # -> API server unreachable -> CoreDNS stays NotReady. dnsPolicy: Default
          # inherits the node resolver (populated by ExternalDNS/Designate), which
          # resolves the control-plane FQDN without any in-cluster dependency.
          dnsPolicy: Default
          # Tolerate all taints: this proxy is what makes the API server
          # reachable in-cluster, so it must schedule on nodes that are still
          # NotReady during bootstrap.
          tolerations:
            - operator: Exists
          containers:
            - name: caddy
              image: docker.io/library/caddy:2.9-alpine
              ports:
                - name: https
                  containerPort: 6443
                  protocol: TCP
              volumeMounts:
                - name: caddyfile
                  mountPath: /etc/caddy/Caddyfile
                  subPath: Caddyfile
                  readOnly: true
                - name: tls
                  mountPath: /etc/caddy/tls
                  readOnly: true
                - name: ca
                  mountPath: /etc/caddy/ca
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /config
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  # The caddy binary carries the file capability
                  # cap_net_bind_service=ep. Dropping ALL without re-adding it
                  # makes the kernel refuse to exec the binary (file-permitted
                  # caps not in the bounding set) → "exec /usr/bin/caddy:
                  # operation not permitted" → exit 255 CrashLoopBackOff.
                  add:
                    - NET_BIND_SERVICE
          volumes:
            - name: caddyfile
              configMap:
                name: kamaji-apiserver-proxy-caddyfile
            - name: tls
              secret:
                secretName: kamaji-apiserver-proxy-tls
            - name: ca
              secret:
                secretName: kamaji-apiserver-proxy-ca
            - name: tmp
              emptyDir: {}
            - name: config
              emptyDir: {}
            - name: data
              emptyDir: {}
  local-redirect-policy.yaml: |
    # Redirect in-cluster API server traffic to the node-local Caddy proxy.
    # Traffic flows: pod -> kubernetes.default ClusterIP:443 -> (eBPF LRP) ->
    # local Caddy:6443 -> (TLS termination + reverse_proxy) -> Gateway:6443 ->
    # TLSRoute -> TCP's kube-apiserver.
    #
    # MUST use addressMatcher, NOT serviceMatcher. Cilium silently refuses to
    # program an LRP whose serviceMatcher targets the special kubernetes.default
    # service (the apiserver-managed ClusterIP): `cilium-dbg lrp list` shows the
    # policy but no matching service, and the ClusterIP keeps routing to the
    # unreachable Kamaji endpoint. addressMatcher on the raw ClusterIP works.
    #
    # The kubernetes.default ClusterIP is ALWAYS the first host of the service
    # CIDR (network address + 1), so we derive it from the Cluster's
    # clusterNetwork.services.cidrBlocks[0] instead of hardcoding it — this stays
    # correct for any tenant cluster regardless of its service CIDR.
    #
    # NOTE: LRP updates are not supported by Cilium (delete+recreate). Sveltos
    # drift correction recreates it, which is fine.
    {{- $svcCidr := (index .Cluster.spec.clusterNetwork.services.cidrBlocks 0) }}
    {{- $octets := splitList "." (first (splitList "/" $svcCidr)) }}
    {{- $apiServerIP := printf "%s.%s.%s.1" (index $octets 0) (index $octets 1) (index $octets 2) }}
    apiVersion: cilium.io/v2
    kind: CiliumLocalRedirectPolicy
    metadata:
      name: kamaji-apiserver
      namespace: kamaji-apiserver-proxy
    spec:
      redirectFrontend:
        addressMatcher:
          ip: "{{ $apiServerIP }}"
          toPorts:
            - port: "443"
              protocol: TCP
      redirectBackend:
        localEndpointSelector:
          matchLabels:
            app.kubernetes.io/name: kamaji-apiserver-proxy
        toPorts:
          - port: "6443"
            protocol: TCP
  # -------------------------------------------------------------------
  # Cilium LRP bootstrap-ordering self-heal.
  #
  # Cilium does NOT re-evaluate an already-synced Service when a matching
  # CiliumLocalRedirectPolicy is created LATER. On a fresh tenant cluster
  # the Cilium agent syncs the kubernetes.default ClusterIP long before
  # this profile's LRP lands (the Caddy backend depends on the
  # Event-Framework cert sync, which waits on the external control plane).
  # Result: the ClusterIP stays a plain (backend-less, since
  # --endpoint-reconciler-type=none) ClusterIP service instead of a
  # LocalRedirect, so kubernetes.default:443 blackholes until the Cilium
  # agents are restarted by hand.
  #
  # This CronJob makes that restart automatic + idempotent: every 2 min
  # it probes the apiserver ClusterIP; if the redirect is NOT working it
  # rolls the Cilium agents ONCE so they re-sync with the LRP present,
  # then re-probes. Once the redirect works it is a no-op (the probe
  # succeeds and it exits without touching Cilium), so steady-state churn
  # is zero. Self-heals late-joining nodes too (their agent started
  # without the LRP -> same restart fixes them).
  #
  # NOTE: uses docker.io/alpine/k8s:1.36.1 (has kubectl + POSIX shell
  # + wget). Distroless kubectl images have no shell (see
  # nova-compute-ssh-fix).
  lrp-reconcile-rbac.yaml: |
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: kamaji-apiserver-lrp-reconcile
      namespace: kamaji-apiserver-proxy
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: kamaji-apiserver-lrp-reconcile
    rules:
      - apiGroups: ["apps"]
        resources: ["daemonsets"]
        verbs: ["get", "patch"]
      - apiGroups: [""]
        resources: ["services"]
        verbs: ["get"]
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]
      - apiGroups: [""]
        resources: ["pods/exec"]
        verbs: ["create"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: kamaji-apiserver-lrp-reconcile
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kamaji-apiserver-lrp-reconcile
    subjects:
      - kind: ServiceAccount
        name: kamaji-apiserver-lrp-reconcile
        namespace: kamaji-apiserver-proxy
  lrp-reconcile-cronjob.yaml: |
    {{- $svcCidr := (index .Cluster.spec.clusterNetwork.services.cidrBlocks 0) }}
    {{- $octets := splitList "." (first (splitList "/" $svcCidr)) }}
    {{- $apiServerIP := printf "%s.%s.%s.1" (index $octets 0) (index $octets 1) (index $octets 2) }}
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: kamaji-apiserver-lrp-reconcile
      namespace: kamaji-apiserver-proxy
    spec:
      schedule: "*/2 * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 1
      jobTemplate:
        spec:
          activeDeadlineSeconds: 90
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: kamaji-apiserver-lrp-reconcile
            spec:
              restartPolicy: Never
              serviceAccountName: kamaji-apiserver-lrp-reconcile
              tolerations:
                - operator: Exists
              containers:
                - name: reconcile
                  image: docker.io/alpine/k8s:1.36.1
                  imagePullPolicy: IfNotPresent
                  command:
                    - /bin/sh
                    - -ec
                    - |
                      API="{{ $apiServerIP }}"
                      # Wait for Caddy proxy DaemonSet to be Ready before
                      # probing — restarting Cilium before the LRP backend
                      # exists is pointless.
                      ready=$(kubectl get ds kamaji-apiserver-proxy \
                        -n kamaji-apiserver-proxy \
                        -o jsonpath='{.status.numberReady}' 2>/dev/null || echo 0)
                      if [ "${ready:-0}" -lt 1 ]; then
                        echo "caddy proxy not Ready yet (numberReady=${ready}); skipping"
                        exit 0
                      fi
                      # Check the LRP on EVERY node by exec-ing into each
                      # Cilium agent pod and reading its service list.
                      NEEDS_ROLL=false
                      for pod in $(kubectl get pods -n kube-system -l k8s-app=cilium \
                        -o jsonpath='{range .items[*]}{.metadata.name} {.spec.nodeName}{"\n"}{end}'); do
                        cilium_pod=$(echo "$pod" | awk '{print $1}')
                        node=$(echo "$pod" | awk '{print $2}')
                        svc_type=$(kubectl exec -n kube-system "$cilium_pod" -- \
                          cilium-dbg service list -o json 2>/dev/null \
                          | jq -r ".[] | select(.frontend.ip==\"${API}\" and .frontend.port==443) | .type" \
                          2>/dev/null || echo "error")
                        if [ "${svc_type}" != "LocalRedirect" ]; then
                          echo "node ${node}: service type=${svc_type} (NOT LocalRedirect)"
                          NEEDS_ROLL=true
                        else
                          echo "node ${node}: LocalRedirect OK"
                        fi
                      done
                      if [ "${NEEDS_ROLL}" = false ]; then
                        echo "LRP verified on all nodes; nothing to do"
                        exit 0
                      fi
                      echo "LRP not programmed on some nodes — rolling entire Cilium DaemonSet"
                      kubectl rollout restart daemonset/cilium -n kube-system
                      echo "cilium DaemonSet restarted; next schedule will re-probe"
