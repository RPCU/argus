# Kyverno + the OIDC guardrails, on workload clusters that grant OIDC access
# (sveltos.argus.rpcu.io/oidc-rbac: enabled): the guardrails travel with the
# oidc-cluster-admin role from oidc-rbac.yaml. Switch: the label
# sveltos.argus.rpcu.io/kyverno: enabled, which chihiro sets on every cluster
# it creates (label other clusters by hand). Delivered as a Flux
# takeover (same pattern as dragonfly / csi-driver-nfs / external-dns).
#
# TWO things are pushed, ordered by dependsOn so the policies never land
# before their CRDs:
#   1. `kyverno` — the Helm chart (CRDs + admission / background / reports /
#      cleanup controllers) from ./infrastructure/kyverno.
#   2. `kyverno-policies` — ./infrastructure/kyverno/policies (dependsOn
#      kyverno): the OIDC guardrails and the per-CRD role generator. They only
#      ever apply to OIDC humans (numeric Zitadel usernames); Sveltos, CAPI,
#      Flux and every ServiceAccount are filtered out by the API server before
#      any rule runs, and most rules are generated as native
#      ValidatingAdmissionPolicies, so Kyverno being down never blocks the
#      platform. See that directory for details.
#
# dependsOn flux-instance: the pushed Flux Kustomization CRs are reconciled by
# the kustomize controller, which only exists once Flux is installed.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: kyverno
  namespace: projectsveltos
spec:
  syncMode: ContinuousWithDriftDetection
  dependsOn:
    - flux-instance
  # Must match the guarded branch of oidc-rbac.yaml (same kyverno label).
  clusterSelector:
    matchLabels:
      type: workload
      sveltos.argus.rpcu.io/oidc-rbac: enabled
      sveltos.argus.rpcu.io/kyverno: enabled
  policyRefs:
    - name: kyverno-flux-kustomizations
      namespace: projectsveltos
      kind: ConfigMap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kyverno-flux-kustomizations
  namespace: projectsveltos
data:
  kyverno.yaml: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: kyverno
      namespace: flux-system
    spec:
      interval: 10m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      path: ./infrastructure/kyverno
      prune: true
      wait: true
      timeout: 10m
  kyverno-policies.yaml: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: kyverno-policies
      namespace: flux-system
    spec:
      interval: 10m
      dependsOn:
        - name: kyverno
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      path: ./infrastructure/kyverno/policies
      prune: true
      wait: true
      timeout: 5m
