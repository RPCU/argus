apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: oidc-rbac
  namespace: projectsveltos
spec:
  # Continuously reconcile and revert manual drift on the child clusters.
  syncMode: ContinuousWithDriftDetection
  clusterSelector:
    matchLabels:
      type: workload
      sveltos.argus.rpcu.io/oidc-rbac: enabled
  # Register the workload CAPI Cluster itself so the templated ConfigMap below
  # can read its annotations. .Cluster.metadata.* only reliably exposes
  # name/namespace/kind in Sveltos templates; arbitrary annotations (e.g.
  # chihiro.io/groups) must be read via getResource on an explicitly-registered
  # resource.
  templateResourceRefs:
    - resource:
        apiVersion: cluster.x-k8s.io/v1beta2
        kind: Cluster
        namespace: "{{ .Cluster.metadata.namespace }}"
        name: "{{ .Cluster.metadata.name }}"
      identifier: WorkloadCluster
  policyRefs:
    - name: oidc-rbac
      namespace: projectsveltos
      kind: ConfigMap
  # oidc-cluster-admin is an aggregated ClusterRole: Kubernetes fills its
  # rules from the labelled roles, so they must not count as drift.
  driftExclusions:
    - paths:
        - "/rules"
      target:
        group: rbac.authorization.k8s.io
        version: v1
        kind: ClusterRole
        name: oidc-cluster-admin
---
# The manifests Sveltos deploys to each matched child cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-rbac
  namespace: projectsveltos
  annotations:
    # Render this ConfigMap as a Sveltos template per matched cluster.
    projectsveltos.io/template: "true"
data:
  oidc-rbac.yaml: |
    {{- /*
      The guarded model (oidc-cluster-admin + the Kyverno guardrails from
      kyverno.yaml) applies where the cluster has
      sveltos.argus.rpcu.io/kyverno: enabled — chihiro sets it on every
      cluster it creates; label other clusters by hand. Elsewhere the legacy
      cluster-admin bindings stay exactly as they were.
      Bindings: kube-admin, plus one per group listed in the workload
      Cluster's `chihiro.io/groups` annotation (comma-separated, trimmed,
      empty entries skipped).
    */ -}}
    {{- $cluster := getResource "WorkloadCluster" }}
    {{- $groups := index ($cluster.metadata.annotations | default dict) "chihiro.io/groups" | default "" }}
    {{- if eq (index ($cluster.metadata.labels | default dict) "sveltos.argus.rpcu.io/kyverno" | default "") "enabled" }}
    # oidc-cluster-admin: what OIDC humans (kube-admin + the cluster's chihiro
    # access groups) get on workload clusters. Everything cluster-admin has,
    # minus the ways around the platform guardrails (infrastructure/kyverno/
    # policies):
    #   - no impersonate / escalate / bind / approve / sign verbs: no `--as`,
    #     no granting more than you hold, no approving certificates;
    #   - no writes to admission objects (webhooks, Validating/Mutating
    #     AdmissionPolicies and their bindings), APIServices or flow control:
    #     the API server exempts admission policies from admission, so RBAC is
    #     the only thing that stops a human deleting a guardrail or injecting
    #     into platform pods;
    #   - no cluster-wide Secret access (admission can't stop reads): Secrets
    #     are granted per namespace, only where no platform Secret lives
    #     (oidc-cluster-admin:secrets below).
    # Built-in API groups are listed here (they never change). CRD groups are
    # NOT: the Kyverno GeneratingPolicy `oidc-cluster-admin-crd-roles` creates
    # one ClusterRole per CRD, labelled for aggregation below, so a new CRD is
    # writable within seconds without touching this file.
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: oidc-cluster-admin
    aggregationRule:
      clusterRoleSelectors:
        - matchLabels:
            rbac.argus.rpcu.io/aggregate-to-oidc-cluster-admin: "true"
    # rules are filled in by the aggregation controller (see driftExclusions).
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: oidc-cluster-admin:base
      labels:
        rbac.argus.rpcu.io/aggregate-to-oidc-cluster-admin: "true"
    rules:
      # Read the built-in non-core APIs (CRDs are read through the per-CRD
      # roles). Core resources are listed explicitly below because Secrets
      # are NOT granted cluster-wide — see oidc-cluster-admin:secrets.
      - apiGroups:
          - admissionregistration.k8s.io
          - apiextensions.k8s.io
          - apiregistration.k8s.io
          - apps
          - authorization.k8s.io
          - autoscaling
          - batch
          - certificates.k8s.io
          - coordination.k8s.io
          - discovery.k8s.io
          - events.k8s.io
          - flowcontrol.apiserver.k8s.io
          - metrics.k8s.io
          - networking.k8s.io
          - node.k8s.io
          - policy
          - rbac.authorization.k8s.io
          - resource.k8s.io
          - scheduling.k8s.io
          - storage.k8s.io
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      # Core reads: every core resource except Secrets (and nodes/proxy).
      - apiGroups: [""]
        resources:
          - componentstatuses
          - configmaps
          - endpoints
          - events
          - limitranges
          - namespaces
          - namespaces/status
          - nodes
          - nodes/status
          - persistentvolumeclaims
          - persistentvolumeclaims/status
          - persistentvolumes
          - persistentvolumes/status
          # RBAC has no `pods/*` form: subresources are listed one by one.
          - pods
          - pods/log
          - pods/status
          - pods/ephemeralcontainers
          - pods/resize
          - podtemplates
          - replicationcontrollers
          - replicationcontrollers/scale
          - replicationcontrollers/status
          - resourcequotas
          - resourcequotas/status
          - serviceaccounts
          - services
          - services/status
        verbs: ["get", "list", "watch"]
      - nonResourceURLs: ["*"]
        verbs: ["get"]
      # Core writes: every core resource except Secrets, Nodes and pod
      # binding (the platform's and the scheduler's).
      - apiGroups: [""]
        resources:
          - configmaps
          - endpoints
          - events
          - limitranges
          - namespaces
          - namespaces/finalize
          - persistentvolumeclaims
          - persistentvolumes
          - pods
          - pods/attach
          - pods/ephemeralcontainers
          - pods/eviction
          - pods/exec
          - pods/portforward
          - pods/proxy
          - pods/resize
          - podtemplates
          - replicationcontrollers
          - replicationcontrollers/scale
          - resourcequotas
          - serviceaccounts
          - serviceaccounts/token
          - services
          - services/proxy
        verbs: ["create", "update", "patch", "delete", "deletecollection"]
      # Write the other built-in API groups (all resources and subresources).
      # RBAC objects are still subject to the escalation check, so bindings
      # can only grant what the user holds.
      - apiGroups:
          - apps
          - autoscaling
          - batch
          - policy
          - apiextensions.k8s.io
          - coordination.k8s.io
          - discovery.k8s.io
          - events.k8s.io
          - networking.k8s.io
          - node.k8s.io
          - rbac.authorization.k8s.io
          - resource.k8s.io
          - scheduling.k8s.io
          - storage.k8s.io
        resources: ["*"]
        verbs: ["create", "update", "patch", "delete", "deletecollection"]
      # `kubectl auth can-i`, token/access reviews.
      - apiGroups: ["authentication.k8s.io", "authorization.k8s.io"]
        resources: ["*"]
        verbs: ["create"]
      # Submit certificate requests, but not approve/sign them, nor the
      # nodeclient pseudo-resources the kubelet auto-approver checks.
      - apiGroups: ["certificates.k8s.io"]
        resources: ["certificatesigningrequests"]
        verbs: ["create", "update", "patch", "delete"]
    ---
    # Secrets are granted per namespace, never cluster-wide: the Kyverno
    # GeneratingPolicy oidc-tenant-secret-access binds this role (RoleBinding
    # `oidc-cluster-admin:secrets`) in namespaces that are not platform or
    # add-on namespaces and hold no Secret pushed by Sveltos, so OIDC users
    # can't read the platform's Secrets. Deliberately NOT aggregated.
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: oidc-cluster-admin:secrets
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: oidc-cluster-admin:kube-admin
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: oidc-cluster-admin
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: kube-admin
    {{- range (splitList "," $groups) }}
    {{- $group := trim . }}
    {{- if $group }}
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: oidc-cluster-admin:group:{{ $group }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: oidc-cluster-admin
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: {{ $group }}
    {{- end }}
    {{- end }}
    {{- else -}}
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: oidc-kube-admin
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-admin
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: kube-admin
    {{- range (splitList "," $groups) }}
    {{- $group := trim . }}
    {{- if $group }}
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: oidc-group-{{ $group }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-admin
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: {{ $group }}
    {{- end }}
    {{- end }}
    {{- end }}
    # ---------------------------------------------------------------
    # Kamaji kube-apiserver -> kubelet RBAC (workaround).
    # Kamaji does not call kubeadm's AllowAPIServerToAccessKubeletAPI
    # phase, so the ClusterRole + ClusterRoleBinding that let the
    # kube-apiserver proxy logs/exec/port-forward to node kubelets
    # are never created. Upstream: clastix/kamaji#1171
    # Remove once Kamaji ships the fix.
    # ---------------------------------------------------------------
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: system:kube-apiserver-to-kubelet
    rules:
      - apiGroups: [""]
        resources:
          - nodes/proxy
          - nodes/log
          - nodes/spec
          - nodes/metrics
          - pods/log
          - pods/exec
          - pods/portforward
        verbs: ["*"]
      - apiGroups: ["metrics.k8s.io"]
        resources:
          - nodes
          - pods
        verbs: ["get", "list"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: system:kube-apiserver-kubelet
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:kube-apiserver-to-kubelet
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: User
        name: kube-apiserver-kubelet-client
