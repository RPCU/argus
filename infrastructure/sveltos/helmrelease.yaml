# Sveltos core controllers (addon-controller, classifier, sveltos-manager,
# event-manager, etc.). The mgmt cluster is registered as a managed cluster of
# itself (managementCluster: true) so Sveltos can drive add-ons onto the
# workload clusters CAPI provisions, and onto the mgmt cluster directly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: projectsveltos
  namespace: projectsveltos
spec:
  interval: 1h
  chart:
    spec:
      chart: projectsveltos
      version: 1.16.0
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: projectsveltos
        namespace: projectsveltos
  values:
    kubernetesClusterDomain: mgmt.local
    # Run the drift-detection / classifier agents in the management cluster
    # (no per-managed-cluster agent push). Appropriate while Sveltos only
    # manages the mgmt cluster + CAPI children from here.
    agent:
      managementCluster: true
    # Expose Prometheus metrics from all controllers. The chart creates
    # ServiceMonitors in projectsveltos; postRenderers below patches them
    # with `release: kube-prometheus-stack` so kube-prometheus-stack's
    # default ServiceMonitorSelector picks them up.
    prometheus:
      enabled: true
    # Label the auto-registered management cluster so ClusterProfiles can
    # target it with clusterSelector: type=mgmt.
    registerMgmtClusterJob:
      registerMgmtCluster:
        args:
          - --labels=type=mgmt
    # Per-controller resources sized from 72h Mimir history on the mgmt cluster
    # (max/P95 memory + cpu). Policy: memory request ~= P95, memory limit ~= 2x
    # max, CPU request-only (no CPU limit — throttling controllers hurts
    # reconcile latency, same convention as the Ceph/OVN/DB daemons in AGENTS.md
    # Section 8). The chart defaults capped memory at 512Mi, but several
    # controllers peaked above that (addon-controller 469Mi, access/event 362-369Mi)
    # and addonController.controller shipped with only a 512Mi request and no
    # limit / no CPU request. Re-sized 2026-09 from 72h P95/max (addon
    # 309/331Mi, event 334/387Mi, classifier 216/266Mi, access 182/249Mi);
    # `cpu: null` drops the chart-merged 500m CPU limit (request-only policy).
    # The per-cluster sveltos-agent / drift-detection Deployments are generated
    # by classifier / addon-controller; their resources are set through the
    # agent patch ConfigMaps below (`--sveltos-agent-config` /
    # `--drift-detection-config`, JSON6902 applied via kustomize, default
    # target Deployment).
    addonController:
      controller:
        resources:
          requests:
            cpu: 10m
            memory: 320Mi
          limits:
            memory: 768Mi
      # drift-detection-manager, one per managed cluster. 72h Mimir across all
      # 5: CPU avg <=4m / P95 21m / max 23m; memory P95 110Mi / max 142Mi. Was
      # the built-in 100m/128Mi with a 500m CPU limit.
      driftDetectionManagerPatchConfigMap:
        data:
          resources: |-
            - op: replace
              path: /spec/template/spec/containers/0/resources
              value:
                requests:
                  cpu: 20m
                  memory: 112Mi
                limits:
                  memory: 288Mi
    accessManager:
      manager:
        resources:
          requests:
            cpu: 5m
            memory: 192Mi
          limits:
            cpu: null
            memory: 512Mi
    eventManager:
      manager:
        resources:
          requests:
            cpu: 10m
            memory: 336Mi
          limits:
            cpu: null
            memory: 832Mi
    classifierManager:
      manager:
        resources:
          requests:
            cpu: 5m
            memory: 224Mi
          limits:
            cpu: null
            memory: 576Mi
      # sveltos-agent, one per managed cluster. 72h Mimir across all 5: CPU
      # avg <=20m / P95 43m / max 44m; memory 280-477Mi per pod (P95 377Mi).
      # The built-in 128Mi request / 512Mi limit was UNDER-sized for memory
      # (peaks within 35Mi of the limit), 100m CPU over-sized.
      agentPatchConfigMap:
        data:
          resources: |-
            - op: replace
              path: /spec/template/spec/containers/0/resources
              value:
                requests:
                  cpu: 45m
                  memory: 384Mi
                limits:
                  memory: 1Gi
    hcManager:
      manager:
        resources:
          requests:
            cpu: 5m
            memory: 192Mi
          limits:
            cpu: null
            memory: 448Mi
    shardController:
      manager:
        resources:
          requests:
            cpu: 5m
            memory: 128Mi
          limits:
            cpu: null
            memory: 256Mi
    scManager:
      manager:
        resources:
          requests:
            cpu: 5m
            memory: 80Mi
          limits:
            cpu: null
            memory: 256Mi
    # Idle on mgmt (72h P95 <1m CPU, ~28-39Mi); chart default was 100m/128Mi.
    mcpServer:
      controller:
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: null
            memory: 192Mi
    techsupportController:
      controller:
        resources:
          requests:
            cpu: 5m
            memory: 48Mi
          limits:
            cpu: null
            memory: 192Mi
  # Patch chart-created ServiceMonitors to add the label kube-prometheus-stack
  # uses as its default serviceMonitorSelector.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: ServiceMonitor
              namespace: projectsveltos
            patch: |
              - op: add
                path: /metadata/labels/release
                value: kube-prometheus-stack
