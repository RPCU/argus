# Sveltos core controllers (addon-controller, classifier, sveltos-manager,
# event-manager, etc.). The mgmt cluster is registered as a managed cluster of
# itself (managementCluster: true) so Sveltos can drive add-ons onto the
# workload clusters CAPI provisions, and onto the mgmt cluster directly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: projectsveltos
  namespace: projectsveltos
spec:
  interval: 1h
  chart:
    spec:
      chart: projectsveltos
      version: 1.14.0
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: projectsveltos
        namespace: projectsveltos
  values:
    kubernetesClusterDomain: mgmt.local
    # Run the drift-detection / classifier agents in the management cluster
    # (no per-managed-cluster agent push). Appropriate while Sveltos only
    # manages the mgmt cluster + CAPI children from here.
    agent:
      managementCluster: true
    # Expose Prometheus metrics from all controllers. The chart creates
    # ServiceMonitors in projectsveltos; postRenderers below patches them
    # with `release: kube-prometheus-stack` so kube-prometheus-stack's
    # default ServiceMonitorSelector picks them up.
    prometheus:
      enabled: true
    # Label the auto-registered management cluster so ClusterProfiles can
    # target it with clusterSelector: type=mgmt.
    registerMgmtClusterJob:
      registerMgmtCluster:
        args:
          - --labels=type=mgmt
    # Per-controller resources sized from 72h Mimir history on the mgmt cluster
    # (max/P95 memory + cpu). Policy: memory request ~= P95, memory limit ~= 2x
    # max, CPU request-only (no CPU limit — throttling controllers hurts
    # reconcile latency, same convention as the Ceph/OVN/DB daemons in AGENTS.md
    # Section 8). The chart defaults capped memory at 512Mi, but several
    # controllers peaked above that (addon-controller 469Mi, access/event 362-369Mi)
    # and addonController.controller shipped with only a 512Mi request and no
    # limit / no CPU request. sveltos-agents and driftDetectionManager do NOT
    # expose a `resources` key in this chart version, so they can't be tuned here.
    addonController:
      controller:
        resources:
          requests:
            cpu: 80m
            memory: 448Mi
          limits:
            memory: 1536Mi
    accessManager:
      manager:
        resources:
          requests:
            cpu: 15m
            memory: 320Mi
          limits:
            memory: 768Mi
    eventManager:
      manager:
        resources:
          requests:
            cpu: 15m
            memory: 320Mi
          limits:
            memory: 768Mi
    classifierManager:
      manager:
        resources:
          requests:
            cpu: 20m
            memory: 288Mi
          limits:
            memory: 704Mi
    hcManager:
      manager:
        resources:
          requests:
            cpu: 15m
            memory: 256Mi
          limits:
            memory: 576Mi
    shardController:
      manager:
        resources:
          requests:
            cpu: 15m
            memory: 224Mi
          limits:
            memory: 576Mi
    scManager:
      manager:
        resources:
          requests:
            cpu: 15m
            memory: 128Mi
          limits:
            memory: 256Mi
  # Patch chart-created ServiceMonitors to add the label kube-prometheus-stack
  # uses as its default serviceMonitorSelector.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: ServiceMonitor
              namespace: projectsveltos
            patch: |
              - op: add
                path: /metadata/labels/release
                value: kube-prometheus-stack
