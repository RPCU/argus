apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: trust-manager
      version: v0.25.0
      sourceRef:
        kind: HelmRepository
        name: trust-manager
      interval: 1h
  values:
    replicaCount: 1
    # 72h Mimir (openstack/production): mem P95/max ~38Mi, CPU P95 ~2m. Was
    # BestEffort (chart default `resources: {}`).
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 192Mi
    secretTargets:
      authorizedSecretsAll: true
      enabled: true
