---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: designate-operator
spec:
  interval: 5m
  dependsOn:
    - name: crds
  chart:
    spec:
      chart: designate-operator
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: yaook-operator
        namespace: yaook
  install:
    createNamespace: true
  values:
    operator:
      # Was BestEffort. 72h p95 3m/173Mi, max 39m/174Mi (2026-09-28).
      resources:
        requests:
          cpu: 10m
          memory: 176Mi
        limits:
          memory: 384Mi
