---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infra-operator
spec:
  interval: 5m
  dependsOn:
    - name: crds
  chart:
    spec:
      chart: infra-operator
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: yaook-operator
        namespace: yaook
  install:
    createNamespace: true
  values:
    operator:
      # Was BestEffort. 72h p95 35m/165Mi, max 40m/166Mi (2026-09-28).
      resources:
        requests:
          cpu: 35m
          memory: 176Mi
        limits:
          memory: 384Mi
