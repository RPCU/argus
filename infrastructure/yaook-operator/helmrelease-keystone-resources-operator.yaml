---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keystone-resources-operator
spec:
  interval: 5m
  dependsOn:
    - name: crds
  chart:
    spec:
      chart: keystone-resources-operator
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: yaook-operator
        namespace: yaook
  install:
    createNamespace: true
  values:
    operator:
      # Was BestEffort. 72h p95 2m/289Mi, max 12m/289Mi (2026-09-28).
      resources:
        requests:
          cpu: 10m
          memory: 304Mi
        limits:
          memory: 640Mi
