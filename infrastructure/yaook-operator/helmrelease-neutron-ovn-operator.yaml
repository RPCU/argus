---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: neutron-ovn-operator
spec:
  interval: 5m
  dependsOn:
    - name: crds
  chart:
    spec:
      chart: neutron-ovn-operator
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: yaook-operator
        namespace: yaook
  install:
    createNamespace: true
  values:
    operator:
      # Was BestEffort. 72h p95 6m/875Mi, max 8m/876Mi (2026-09-28).
      resources:
        requests:
          cpu: 10m
          memory: 880Mi
        limits:
          memory: 1792Mi
