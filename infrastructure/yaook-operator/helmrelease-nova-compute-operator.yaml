---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nova-compute-operator
spec:
  interval: 5m
  dependsOn:
    - name: crds
  chart:
    spec:
      chart: nova-compute-operator
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: yaook-operator
        namespace: yaook
  install:
    createNamespace: true
  values:
    operator:
      # Was BestEffort. 72h p95 9m/814Mi, max 11m/827Mi (2026-09-28).
      resources:
        requests:
          cpu: 10m
          memory: 816Mi
        limits:
          memory: 1664Mi
