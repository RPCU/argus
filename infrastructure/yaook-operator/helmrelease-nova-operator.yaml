---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nova-operator
spec:
  interval: 5m
  dependsOn:
    - name: crds
  chart:
    spec:
      chart: nova-operator
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: yaook-operator
        namespace: yaook
  install:
    createNamespace: true
  values:
    operator:
      # Was BestEffort. 72h p95 12m/184Mi, max 24m/186Mi (2026-09-28).
      resources:
        requests:
          cpu: 15m
          memory: 192Mi
        limits:
          memory: 384Mi
