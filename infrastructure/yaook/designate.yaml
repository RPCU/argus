# NOTE: This file serves as an example only!
# It demonstrates a subset of the API features which are available and
# is NOT FIT FOR PRODUCTIVE USE. You need to adapt them to your
# specific environment, needs and scale.
# DO NOT DEPLOY THIS FILE WITH THE EXPECTATION THAT YOU WILL GET A
# YAOOK DEPLOYMENT FIT FOR ANY USE EXCEPT LOOKING AT IT.
apiVersion: yaook.cloud/v1
kind: DesignateDeployment
metadata:
  name: designate
spec:
  api:
    ingress:
      createIngress: false
      fqdn: designate.rpcu.vpn
      ingressClassName: nginx
      port: 443
    publishEndpoint: true
    replicas: 1
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
  database:
    backup:
      mysqldump: false
      schedule: 0 * * * *
      warmKeepMax: "3"
    proxy:
      replicas: 1
      resources:
        haproxy:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            memory: 512Mi
        service-reload:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        create-ca-bundle:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    replicas: 1
    resources:
      mariadb-galera:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    storageSize: 8Gi
    timeoutClient: 300
    tolerateNodeDown: false
  designateConfig:
    DEFAULT:
      debug: false
    service:api:
      api_paste_config: /usr/local/etc/designate/api-paste-audit.ini
  issuerRef:
    name: yaook-internal
  keystoneRef:
    kind: KeystoneDeployment
    name: keystone
  memcached:
    connections: 1024
    memory: 512
    replicas: 1
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
  messageQueue:
    replicas: 1
    resources:
      rabbitmq:
        requests:
          cpu: 250m
          memory: 1G
        limits:
          # Yaook maps this into rabbitmq.conf default_worker_pool_size /
          # schedulers_online (NOT a CFS throttle). Without it RabbitMQ sizes
          # its Erlang scheduler pool to the node's core count (12). Pin the
          # worker pool for this lighter service.
          cpu: 750m
          memory: 1G
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    storageSize: 8Gi
    tolerateNodeDown: false
  nsRecords:
    - hostname: powerdns.rpcu.vpn.
      priority: 1
  policy:
    admin: role:admin
    # ---------------------------------------------------------------------
    # ExternalDNS (workload clusters) least-privilege access.
    #
    # Workload clusters run ExternalDNS (inovex Designate webhook) that
    # authenticates with a per-project `cloud-controller` Application
    # Credential (scoped to the cluster's TENANT project) and must manage
    # recordsets in the SHARED `rpcu.lan` zone, which is owned by the
    # ADMIN/yaook project. The default Designate policy only allows a token
    # to write a zone its OWN project owns (or role:admin), so a tenant token
    # cannot touch rpcu.lan.
    #
    # Instead of granting admin to tenant credentials, we OR-in a narrow
    # custom role `role:dns_manager` on ONLY the recordset CRUD + zone/
    # recordset READ targets, regardless of zone ownership. dns_manager is
    # assigned to the cloud-controller user per project and added to the
    # app-cred `roles` restriction (see
    # clusters/mgmt/crossplane/openstack/dns-manager-role.yaml and
    # infrastructure/crossplane-compositions/composition-ccm-credential.yaml).
    #
    # Zone create/update/delete are intentionally NOT granted to dns_manager
    # (ExternalDNS manages recordsets, not zones — the zone is pre-created by
    # admin). The write rules keep the ('PRIMARY':%(zone_type)s) guard so
    # dns_manager can only write recordsets in PRIMARY zones (rpcu.lan is
    # PRIMARY), never SECONDARY.
    #
    # check_str values below mirror the upstream Designate defaults with
    # `role:dns_manager[...]` OR-ed in (see designate/common/policies/{zone,
    # recordset}.py).
    # ---------------------------------------------------------------------
    # Zone listing / read (so the webhook can discover rpcu.lan).
    get_zones: "role:dns_manager or rule:admin_or_owner"
    find_zones: "role:dns_manager or rule:admin_or_owner"
    get_zone: "role:dns_manager or rule:admin_or_owner or 'True':%(zone_shared)s"
    # Recordset listing / read.
    find_recordsets: "role:dns_manager or rule:admin_or_owner"
    get_recordsets: "role:dns_manager or rule:admin_or_owner"
    get_recordset: "role:dns_manager or rule:admin_or_owner or 'True':%(zone_shared)s"
    # Recordset CRUD (PRIMARY zones only), OR-ed onto the upstream default.
    create_recordset: >-
      (role:dns_manager and 'PRIMARY':%(zone_type)s)
      or (rule:admin_or_owner and 'PRIMARY':%(zone_type)s)
      or (is_admin:True and 'SECONDARY':%(zone_type)s)
      or ('True':%(zone_shared)s and 'PRIMARY':%(zone_type)s)
    update_recordset: >-
      (role:dns_manager and 'PRIMARY':%(zone_type)s)
      or (rule:admin_or_owner and 'PRIMARY':%(zone_type)s)
      or (is_admin:True and 'SECONDARY':%(zone_type)s)
      or (role:member and project_id:%(recordset_project_id)s and 'PRIMARY':%(zone_type)s)
    delete_recordset: >-
      (role:dns_manager and 'PRIMARY':%(zone_type)s)
      or (rule:admin_or_owner and 'PRIMARY':%(zone_type)s)
      or (is_admin:True and 'SECONDARY':%(zone_type)s)
      or (role:member and project_id:%(recordset_project_id)s and 'PRIMARY':%(zone_type)s)
  # PowerDNS is the AUTHORITATIVE nameserver for the Designate zones, including
  # `rpcu.lan`. Every consumer of a `*.rpcu.lan` name depends on it: the mgmt
  # cluster, workload clusters, the host dnsmasq forwarder in hephaestus
  # (`/rpcu.lan/10.0.0.241`), and Prometheus remote_write to
  # `mimir.mgmt.rpcu.lan`. If PowerDNS cannot answer, `rpcu.lan` resolution
  # fails CLUSTER-WIDE.
  #
  # 2026-07-26: every container in this stack shipped with `resources: {}`,
  # i.e. QoS BestEffort, i.e. cgroup v2 `cpu.weight` of 1 (the minimum). On
  # these hyperconverged hosts that means they lose every scheduling contest
  # against the Ceph OSDs (2 CPU / 5Gi requests) and the tenant qemu processes.
  # With `lucy` at 91% CPU (10953m of 12 cores) the effect was:
  #
  #   1. The galera pod's `ssl-terminator` was starved and stopped answering,
  #      so its readiness probe failed (`connect: connection refused` :9101).
  #   2. kubelet recreated the pod -> 18 restarts over 47h.
  #   3. While the DB was gone PowerDNS could not reach its backend and
  #      answered SERVFAIL for every query:
  #        "Backend error: Unable to launch gmysql connection: ... ERROR 2013
  #         (HY000): Lost connection to MySQL server at 'handshake...'"
  #   4. `rpcu.lan` therefore resolved INTERMITTENTLY - the classic "works, then
  #      doesn't, then works again" signature.
  #
  # This is the SAME failure mode as the OVN control plane (see "OVN control
  # plane must not be BestEffort" in AGENTS.md Section 8) and takes the same
  # shape of fix. Measured usage is tiny (galera 51m CPU / 301Mi, haproxy
  # 160Mi) - the problem was never capacity, it was PRIORITY. A CPU request
  # costs nothing on an idle node and only binds under contention, which is
  # exactly when DNS must keep working.
  #
  # NO CPU LIMITS anywhere: CFS-throttling a database or a proxy destroys tail
  # latency and would re-create the probe-timeout death spiral this fixes (same
  # rationale as the Ceph and OVN daemons). Memory limits are a generous
  # runaway backstop (~5-7x observed RSS), not a target.
  #
  # NOT FIXABLE HERE: the CRD exposes no `resources` for the PowerDNS SERVER
  # pod itself (`spec.powerdns` has only database/loadBalancerIP/replicas/
  # scheduleRuleWhenUnsatisfiable/subnetCidr), nor for the galera pod's
  # `ssl-terminator` sidecar - the very container whose probe failed. Those
  # stay BestEffort until yaook exposes them upstream. Fixing the DB removes
  # the trigger, but the sidecar gap is why this needs an upstream change to be
  # fully closed.
  powerdns:
    database:
      backup:
        mysqldump: false
        schedule: 0 * * * *
        warmKeepMax: "3"
      proxy:
        replicas: 1
        resources:
          # haproxy fronts the galera DB for PowerDNS. Starved, it drops the
          # backend connection and PowerDNS SERVFAILs just as if the DB were
          # down.
          haproxy:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          service-reload:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          create-ca-bundle:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      replicas: 1
      resources:
        # The single-replica Galera node backing PowerDNS. `replicas: 1` means
        # there is NO redundancy: if this pod is evicted or OOM-killed, rpcu.lan
        # resolution stops until it comes back. Sized ~2x observed RSS with a
        # 2Gi backstop.
        mariadb-galera:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
        backup-creator:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        backup-shifter:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 256Mi
        mysqld-exporter:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        replication-ports-blackbox-exporter:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      storageSize: 8Gi
      timeoutClient: 300
      tolerateNodeDown: false
    replicas: 1
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    subnetCidr: 10.244.0.0/16
  region:
    name: hetzner
  targetRelease: "2026.1"
