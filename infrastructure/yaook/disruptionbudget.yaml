---
# Disruption budget for the nova compute rollout.
#
# WHY THIS EXISTS
# ---------------
# The nova operator renders one `NovaComputeNode` per node from
# `NovaDeployment.spec.compute.configTemplates[]`. Whenever the rendered spec
# stops matching the live instance — i.e. after ANY edit to
# `novaComputeConfig`, however trivial — the operator marks the instance
# `RequiresRecreation` and DELETES it to force the update (yaook
# `statemachine/resources/instancing.py`, `_compile_full_state`). Deleting a
# `NovaComputeNode` runs the eviction job, which drains the node by migrating
# every VM off it, one node at a time (gated by `maxUnavailable`).
#
# WHAT THIS BUDGET CONTROLS
# -------------------------
# Without SOME budget matching a node, that node falls into the operator's
# implicit default group. This budget pins the two knobs deliberately:
#
#   * `disruptiveMaintenance: true` — ACTIVE instances are COLD migrated (shut
#     off, disk copied node-to-node, restarted), not live migrated. This is the
#     intended migration mode for this cluster. NOTE: cold migration copies the
#     LOCAL qcow2 root disk over the locked-down `nova` ssh account, which has
#     two known yaook-image bugs (missing `IdentityFile`, scp/SFTP transport) —
#     see "Nova cold-migration / node eviction fails" in AGENTS.md section 8.
#     Apply the ssh IdentityFile live-patch to the nova-compute pods and verify
#     `remote_filesystem_transport = rsync` BEFORE any eviction runs, or the
#     drain wedges and cascades across lucy -> makise -> quinn.
#   * `preventDeletion: false` — the operator AUTO-evicts on any
#     `novaComputeConfig` change (does not merely flag the node). Combined with
#     `maxUnavailable: 1` this rolls one node at a time automatically.
#
# NOTES
# -----
# * `matchLabels: {}` matches every node, deliberately mirroring the
#   match-all selector in `nova.yaml`'s `configTemplates[].nodeSelectors`.
#   Coverage must be total: any compute node NOT matched by a
#   YaookDisruptionBudget falls into the operator's implicit default group.
# * A node may match at most ONE YaookDisruptionBudget; a second overlapping
#   budget makes the operator raise `ConfigurationInvalid`. Do not add another
#   match-all budget in this namespace. (The out-of-band `compute-cold-migrate`
#   budget that used to carry these same settings was superseded by this one and
#   deleted from the live cluster.)
# * `spareNodes` is intentionally unset: this cluster has no spare-capacity
#   host aggregate to drain into.
apiVersion: yaook.cloud/v1
kind: YaookDisruptionBudget
metadata:
  name: nova-compute
spec:
  nodeSelectors:
    - matchLabels: {}
  # Only ever recreate one compute node at a time.
  maxUnavailable: 1
  # ACTIVE instances are cold migrated (not live migrated) when an eviction runs.
  disruptiveMaintenance: true
  # Auto-evict on config change (do not merely flag the node).
  preventDeletion: false
