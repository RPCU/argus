apiVersion: yaook.cloud/v1
kind: GlanceDeployment
metadata:
  name: glance
spec:
  keystoneRef:
    name: keystone
  database:
    mysqlConfig:
      mysqld:
        max_statement_time: 60
    replicas: 1
    resources:
      mariadb-galera:
        requests:
          cpu: 50m
          memory: 208Mi
        limits:
          memory: 2Gi
    timeoutClient: 300
    proxy:
      replicas: 1
      resources:
        haproxy:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 320Mi
        service-reload:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
        create-ca-bundle:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    backup:
      schedule: "0 * * * *"
  memcached:
    connections: 1024
    memory: 512
    replicas: 1
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
  api:
    replicas: 2
    ingress:
      createIngress: false
      fqdn: "glance.rpcu.vpn"
      port: 443
    resources:
      glance-api:
        requests:
          cpu: 15m
          memory: 272Mi
        # Kept at 2Gi (72h max only ~274Mi): image uploads/imports stream
        # through glance-api, so leave room for bursts.
        limits:
          memory: 2Gi
  glanceConfig:
    DEFAULT:
      # Expose the RBD location of images so cinder/nova can create volumes
      # as instant copy-on-write clones inside Ceph instead of streaming a
      # full copy through the glance API (biggest VM-provisioning I/O win;
      # images must be raw format for COW cloning to kick in). Safe here:
      # glance and cinder share the same Ceph cluster/pool.
      show_image_direct_url: true
      # Max bytes per image upload. Yaook's default is 5 GiB, below the raw
      # hephaestus-kaas images (~5.5 GB, published by hephaestus CI): Glance
      # rejected them with 413 "The provided image is too large".
      image_size_cap: 21474836480 # 20 GiB
    glance_store:
      default_store: "rbd"
  backends:
    ceph:
      keyringReference: rook-ceph-client-glance
      keyringUsername: glance
      keyringPoolname: rdb-pool
      cephConfig:
        global:
          "mon_host": "rook-ceph-mon-a.rook-ceph:6789,rook-ceph-mon-d.rook-ceph:6789,rook-ceph-mon-f.rook-ceph:6789"
  policy:
    "context_is_admin": "role:admin"
  region:
    name: hetzner
  issuerRef:
    name: yaook-internal
  targetRelease: "2026.1"
