apiVersion: yaook.cloud/v1
kind: KeystoneDeployment
metadata:
  name: keystone
spec:
  api:
    ingress:
      createIngress: false
      fqdn: keystone.rpcu.vpn
      ingressClassName: nginx
      port: 443
    replicas: 2
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    wsgiProcesses: 10
    resources:
      # The container inside the keystone-api Deployment is named "keystone",
      # not "keystone-api" — yaook source confirms this naming.
      keystone:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi
  database:
    mysqlConfig:
      mysqld:
        max_statement_time: 60
    backup:
      mysqldump: false
      schedule: 0 * * * *
      warmKeepMax: "3"
    proxy:
      replicas: 1
      resources:
        haproxy:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            memory: 512Mi
        service-reload:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        create-ca-bundle:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    replicas: 1
    resources:
      mariadb-galera:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    storageSize: 8Gi
    timeoutClient: 300
    tolerateNodeDown: false
  extraProjected:
    sources:
      - secret:
          name: keystone-vhost-conf
  issuerRef:
    name: yaook-internal
  keyRotationSchedule: 0 0 * * *
  keystoneConfig:
    DEFAULT:
      notification_format: cadf
    auth:
      methods:
        - password
        - token
        - openid
        - application_credential
    database:
      connection_recycle_time: 280
    federation:
      trusted_dashboard:
        - https://os.rpcu.vpn/auth/websso/
    openid:
      remote_id_attribute: HTTP_OIDC_ISS
    oslo_messaging_notifications:
      driver:
        - log
    token:
      expiration: 86400
  memcached:
    connections: 2000
    memory: 512
    replicas: 2
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
  policy:
    admin_required: role:admin or is_admin:1
  region:
    name: hetzner
  targetRelease: "2026.1"
