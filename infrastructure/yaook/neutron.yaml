apiVersion: yaook.cloud/v1
kind: NeutronDeployment
metadata:
  name: neutron-ovn
spec:
  api:
    ingress:
      createIngress: false
      fqdn: "neutron.rpcu.vpn"
      port: 443
    replicas: 6
    resources:
      neutron-api:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 3Gi
  database:
    proxy:
      replicas: 1
    backup:
      schedule: "0 * * * *"
    replicas: 1
    timeoutClient: 300
    # -------------------------------------------------------------------------
    # DB connection ceiling. MUST stay comfortably above the worst-case client
    # demand computed in the `neutronConfig.database` block below, otherwise
    # Neutron wedges HARD — see that comment for the 2026-07-26 outage.
    #
    # MariaDB's default here was 500, which the API fleet exhausted
    # (`Threads_connected 501 / max_connections 500`). Once saturated, even
    # `root` could not connect, the OVN mech driver's
    # `touch_hash_ring_node` periodic could not register its node, the hash ring
    # went empty, and EVERY network/port write returned HTTP 500 — which in turn
    # fails CAPI/CAPO machine provisioning.
    #
    # nova already pins 1337 for the same reason (infrastructure/yaook/nova.yaml).
    # -------------------------------------------------------------------------
    mysqlConfig:
      mysqld:
        max_connections: 2000
  issuerRef:
    name: yaook-internal
  keystoneRef:
    name: keystone
  messageQueue:
    replicas: 1
    resources:
      rabbitmq:
        requests:
          memory: 1G
          cpu: 1000m
        limits:
          memory: 2G
  memcached:
    connections: 1024
    memory: 512
    replicas: 3
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
  neutronConfig:
    # -------------------------------------------------------------------------
    # DB CONNECTION BUDGET — read before changing `api.replicas` or the pool.
    #
    # 2026-07-26 outage: the Neutron DB hit `(1040, 'Too many connections')`,
    # the OVN mech driver could not touch its hash-ring node, the ring went
    # empty and every network/port write 500'd (breaking CAPI provisioning).
    #
    # The cause was unbounded client demand, from THREE compounding defaults:
    #   * `api_workers` was unset, so Neutron defaults it to the CPU count seen
    #     in the container. These pods have NO cpu limit, so that is the HOST's
    #     core count (12 here) — not the 200m request. 12 API workers per pod.
    #   * yaook's default pool was `max_pool_size 5` + `max_overflow 50`, i.e.
    #     up to 55 connections per worker PROCESS (each worker has its own
    #     engine/pool).
    #   * `api.replicas: 6`.
    # Worst case: 6 x 12 x 55 = ~3960 connections against a 500 limit.
    #
    # Budget now (keep this arithmetic true when editing):
    #     procs/pod  = api_workers 4 + rpc_workers 2 + ~1 periodic  = 7
    #     conns/proc = max_pool_size 5 + max_overflow 10            = 15
    #     worst case = 6 replicas x 7 x 15                          = 630
    #     server cap = database.mysqlConfig.mysqld.max_connections  = 2000
    # ~3x headroom. If you raise `api.replicas`, re-check this against the cap.
    #
    # Pinning the worker counts explicitly is the important part: it decouples
    # Neutron from the hypervisor's core count, so moving to a bigger host can
    # no longer silently multiply DB load. This mirrors what nova already does
    # (`osapi_compute_workers`, `conductor.workers`, ... in nova.yaml).
    # -------------------------------------------------------------------------
    database:
      max_pool_size: 5
      # Was effectively 50 (yaook default) — the main amplifier.
      max_overflow: 10
      # Fail a starved request fast instead of queueing forever and turning
      # pool exhaustion into an API-wide hang.
      pool_timeout: 30
      # Recycle below MariaDB's wait_timeout so dead sockets are not reused.
      connection_recycle_time: 280
    DEFAULT:
      debug: false
      # Do NOT remove: unset means "one worker per host CPU" (see budget above).
      api_workers: 4
      rpc_workers: 2
      global_physnet_mtu: 1400
      advertise_mtu: True
      enable_tcp_mss_clamping: True
      dnsmasq_dns_servers:
        - 172.16.0.254
    ovn:
      dns_servers:
        - 172.16.0.254
      ovn_emit_need_to_frag: True
  neutronML2Config:
    ml2:
      # -----------------------------------------------------------------------
      # TENANT (geneve) MTU — sized from MEASUREMENT, not arithmetic. DO NOT
      # RAISE back to 1400 without re-running the DF sweep documented below.
      #
      # Neutron derives a geneve network's MTU as
      #     mtu = min(global_physnet_mtu, path_mtu) - 58   # geneve header
      # so this knob (not global_physnet_mtu) is what tenant VMs receive over
      # DHCP. With path_mtu 1400 VMs got 1400-58 = 1342.
      #
      # WHY 1342 WAS WRONG — measured 2026-07-26 with DF-set pings
      # (`ping -M do -s <payload>`, totalIP = payload+28):
      #
      #   underlay, hypervisor->hypervisor over eno1.4000 (the Hetzner vSwitch):
      #       totalIP 1400 .......... OK      <- vSwitch really is 1400
      #   tenant east-west, VM->VM:
      #       totalIP 1342 .......... OK
      #       totalIP 1358 .......... DROP    <- matches advertised 1342
      #   tenant north-south, VM->internet (via the OVN gateway/SNAT):
      #       totalIP 1284 .......... OK
      #       totalIP 1292 .......... DROP    <- 58 BYTES LESS THAN ADVERTISED
      #
      # East-west is correct at 1342 (1342 + 58 geneve = 1400 = the vSwitch
      # limit, exactly). But north-south crosses the OVN distributed gateway
      # port, and with `ovn_emit_need_to_frag: True` (set above) OVN reserves a
      # further tunnel header on that path, enforcing 1342 - 58 = 1284. So
      # Neutron ADVERTISED 1342 while the router ENFORCED 1284: every VM
      # overshot by 58 bytes on every flow leaving the tenant network.
      #
      # TCP then depended entirely on PMTUD to recover, which fails silently
      # wherever ICMP frag-needed is filtered. Measured from a mgmt worker,
      # IPv4, 10 TLS handshakes each:
      #     registry.k8s.io   ok=10 fail=0   (ICMP honoured; cache learned 1284)
      #     ghcr.io           ok=10 fail=0   (ICMP honoured; cache learned 1284)
      #     xpkg.upbound.io   ok=0  fail=10  (ICMP filtered -> HARD BLACK HOLE)
      # The same 10 handshakes from the hypervisor host netns (MTU 1500, no
      # geneve) were ok=10 fail=0, proving the internet path is healthy and the
      # loss is purely the tenant-MTU overshoot.
      #
      # This is the real source of the recurring `net/http: TLS handshake
      # timeout` on image pulls and the long-standing "flaky etcd / works after
      # a retry" symptoms: a TLS ServerHello+Certificate is several full-MSS
      # segments, so it is the first thing to hit the black hole while the tiny
      # SYN/ACK sail through.
      #
      # 1342 here => tenant MTU 1342 - 58 = 1284, matching what the gateway
      # actually forwards. `enable_tcp_mss_clamping` then clamps MSS off the
      # correct value too (it previously clamped to 1302 against a real ceiling
      # of 1244).
      #
      # NOT A vSWITCH CHANGE: hephaestus `nixosModules/vlanConfiguration.nix`
      # keeps eno1.4000 at MTU 1400. That is CORRECT per Hetzner's vSwitch docs
      # and is confirmed by the DF sweep above — do not lower it.
      #
      # ROLLOUT: Neutron fixes a port's MTU at CREATION time, so existing VMs
      # keep 1342 until their ports are recreated (roll the machines via CAPI).
      # Stopgap on a running VM: `ip link set dev enp3s0 mtu 1284`.
      # Cilium is pinned to MTU 1200 in-cluster (1200 + 50 vxlan = 1250 < 1284)
      # so it needs no change.
      # -----------------------------------------------------------------------
      path_mtu: 1342
      # physnet `public` is a FLAT network on enp3s0 (a 1500-MTU NIC that does
      # not cross the vSwitch). NOTE: this key is matched by PHYSNET name, and
      # the physnet is called `public`, not `enp3s0` — so this entry never
      # matches and the flat net falls back to global_physnet_mtu. Left as-is
      # (the live `ext` network is already stored at 1342); fixing the name
      # would silently resize the external network, which is a separate change.
      physical_network_mtus: enp3s0:1400
    ml2_type_flat:
      flat_networks:
        - public
  novaRef:
    name: nova
  policy:
    "context_is_admin": "role:admin"
    "create_floatingip": "rule:context_is_admin or role:member"
    "create_floatingip:floating_ip_address": "rule:context_is_admin or role:member"
    "update_floatingip": "rule:context_is_admin or role:member"
    "delete_floatingip": "rule:context_is_admin or role:member"
    "get_floatingip": ""
  region:
    name: hetzner
  setup:
    ovn:
      northboundOVSDB:
        replicas: 3
        backup:
          schedule: 0 12 * * *
      northd:
        # northd remote probe interval (to nb or nb relay) can be adjusted individually
        remoteInactivityProbeMs: 60000
      southboundOVSDB:
        # recommended to increase inactivityProbe and raftElectionTimer at scale (default 5s/1s)
        inactivityProbeMs: 60000
        raftElectionTimerMs: 60000
        ovnRelay: # add this section to deploy ovn-relays
          # in large scale deployments, tune probe intervals separately for the ovsdb relays
          inactivityProbeMs: 120000
          remoteInactivityProbeMs: 60000
          replicas: 3
        replicas: 3
        backup:
          schedule: 0 12 * * *
      controller:
        # ovn-controller remote probe interval (to sb or sb relay) can be adjusted individually
        remoteInactivityProbeMs: 60000
        configTemplates:
          - nodeSelectors:
              - matchLabels: {}
            bridgeConfig:
              - bridgeName: br-ex
                uplinkDevice: enp3s0
                openstackPhysicalNetwork: "public"
  targetRelease: "2025.1"
