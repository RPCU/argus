apiVersion: yaook.cloud/v1
kind: NeutronDeployment
metadata:
  name: neutron-ovn
spec:
  api:
    ingress:
      createIngress: false
      fqdn: "neutron.rpcu.vpn"
      port: 443
    replicas: 2
    resources:
      neutron-api:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 3Gi
  database:
    proxy:
      replicas: 1
      resources:
        haproxy:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            memory: 512Mi
        service-reload:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        create-ca-bundle:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    backup:
      schedule: "0 * * * *"
    replicas: 1
    resources:
      mariadb-galera:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi
    timeoutClient: 300
    # -------------------------------------------------------------------------
    # DB connection ceiling. MUST stay comfortably above the worst-case client
    # demand computed in the `neutronConfig.database` block below, otherwise
    # Neutron wedges HARD — see that comment for the 2026-07-26 outage.
    #
    # MariaDB's default here was 500, which the API fleet exhausted
    # (`Threads_connected 501 / max_connections 500`). Once saturated, even
    # `root` could not connect, the OVN mech driver's
    # `touch_hash_ring_node` periodic could not register its node, the hash ring
    # went empty, and EVERY network/port write returned HTTP 500 — which in turn
    # fails CAPI/CAPO machine provisioning.
    #
    # nova already pins 1337 for the same reason (infrastructure/yaook/nova.yaml).
    # -------------------------------------------------------------------------
    mysqlConfig:
      mysqld:
        max_connections: 2000
        max_statement_time: 60
  issuerRef:
    name: yaook-internal
  keystoneRef:
    name: keystone
  messageQueue:
    replicas: 1
    resources:
      rabbitmq:
        requests:
          memory: 1G
          cpu: 250m
        limits:
          # Yaook maps this into rabbitmq.conf default_worker_pool_size /
          # schedulers_online (NOT a CFS throttle). Without it RabbitMQ sizes
          # its Erlang scheduler pool to the node's core count (12) → ~1.1
          # cores idle. Pin to 1 core: right-sizes the worker pool.
          cpu: 1000m
          memory: 2G
  memcached:
    connections: 1024
    memory: 512
    replicas: 3
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
  neutronConfig:
    # -------------------------------------------------------------------------
    # DB CONNECTION BUDGET — read before changing `api.replicas` or the pool.
    #
    # 2026-07-26 outage: the Neutron DB hit `(1040, 'Too many connections')`,
    # the OVN mech driver could not touch its hash-ring node, the ring went
    # empty and every network/port write 500'd (breaking CAPI provisioning).
    #
    # The cause was unbounded client demand, from THREE compounding defaults:
    #   * `api_workers` was unset, so Neutron defaults it to the CPU count seen
    #     in the container. These pods have NO cpu limit, so that is the HOST's
    #     core count (12 here) — not the 200m request. 12 API workers per pod.
    #   * yaook's default pool was `max_pool_size 5` + `max_overflow 50`, i.e.
    #     up to 55 connections per worker PROCESS (each worker has its own
    #     engine/pool).
    #   * `api.replicas: 6`.
    # Worst case: 6 x 12 x 55 = ~3960 connections against a 500 limit.
    #
    # Budget now (keep this arithmetic true when editing):
    #     procs/pod  = api_workers 4 + rpc_workers 2 + ~1 periodic  = 7
    #     conns/proc = max_pool_size 5 + max_overflow 10            = 15
    #     worst case = 6 replicas x 7 x 15                          = 630
    #     server cap = database.mysqlConfig.mysqld.max_connections  = 2000
    # ~3x headroom. If you raise `api.replicas`, re-check this against the cap.
    #
    # Pinning the worker counts explicitly is the important part: it decouples
    # Neutron from the hypervisor's core count, so moving to a bigger host can
    # no longer silently multiply DB load. This mirrors what nova already does
    # (`osapi_compute_workers`, `conductor.workers`, ... in nova.yaml).
    # -------------------------------------------------------------------------
    database:
      max_pool_size: 5
      # Was effectively 50 (yaook default) — the main amplifier.
      max_overflow: 10
      # Fail a starved request fast instead of queueing forever and turning
      # pool exhaustion into an API-wide hang.
      pool_timeout: 30
      # Recycle below MariaDB's wait_timeout so dead sockets are not reused.
      connection_recycle_time: 280
    DEFAULT:
      debug: false
      # Do NOT remove: unset means "one worker per host CPU" (see budget above).
      api_workers: 4
      rpc_workers: 2
      global_physnet_mtu: 1400
      advertise_mtu: True
      enable_tcp_mss_clamping: True
      dnsmasq_dns_servers:
        - 172.16.0.254
    ovn:
      dns_servers:
        - 172.16.0.254
      ovn_emit_need_to_frag: True
  neutronML2Config:
    ml2:
      # -----------------------------------------------------------------------
      # TENANT (geneve) MTU — sized from MEASUREMENT, not arithmetic. DO NOT
      # RAISE back to 1400 without re-running the DF sweep documented below.
      #
      # Neutron derives a geneve network's MTU as
      #     mtu = min(global_physnet_mtu, path_mtu) - 58   # geneve header
      # so this knob (not global_physnet_mtu) is what tenant VMs receive over
      # DHCP. With path_mtu 1400 VMs got 1400-58 = 1342.
      #
      # WHY 1342 WAS WRONG — measured 2026-07-26 with DF-set pings
      # (`ping -M do -s <payload>`, totalIP = payload+28):
      #
      #   underlay, hypervisor->hypervisor over eno1.4000 (the Hetzner vSwitch):
      #       totalIP 1400 .......... OK      <- vSwitch really is 1400
      #   tenant east-west, VM->VM:
      #       totalIP 1342 .......... OK
      #       totalIP 1358 .......... DROP    <- matches advertised 1342
      #   tenant north-south, VM->internet (via the OVN gateway/SNAT):
      #       totalIP 1284 .......... OK
      #       totalIP 1292 .......... DROP    <- 58 BYTES LESS THAN ADVERTISED
      #
      # East-west is correct at 1342 (1342 + 58 geneve = 1400 = the vSwitch
      # limit, exactly). But north-south crosses the OVN distributed gateway
      # port, and with `ovn_emit_need_to_frag: True` (set above) OVN reserves a
      # further tunnel header on that path, enforcing 1342 - 58 = 1284. So
      # Neutron ADVERTISED 1342 while the router ENFORCED 1284: every VM
      # overshot by 58 bytes on every flow leaving the tenant network.
      #
      # TCP then depended entirely on PMTUD to recover, which fails silently
      # wherever ICMP frag-needed is filtered. Measured from a mgmt worker,
      # IPv4, 10 TLS handshakes each:
      #     registry.k8s.io   ok=10 fail=0   (ICMP honoured; cache learned 1284)
      #     ghcr.io           ok=10 fail=0   (ICMP honoured; cache learned 1284)
      #     xpkg.upbound.io   ok=0  fail=10  (ICMP filtered -> HARD BLACK HOLE)
      # The same 10 handshakes from the hypervisor host netns (MTU 1500, no
      # geneve) were ok=10 fail=0, proving the internet path is healthy and the
      # loss is purely the tenant-MTU overshoot.
      #
      # This is the real source of the recurring `net/http: TLS handshake
      # timeout` on image pulls and the long-standing "flaky etcd / works after
      # a retry" symptoms: a TLS ServerHello+Certificate is several full-MSS
      # segments, so it is the first thing to hit the black hole while the tiny
      # SYN/ACK sail through.
      #
      # 1342 here => tenant MTU 1342 - 58 = 1284, matching what the gateway
      # actually forwards. `enable_tcp_mss_clamping` then clamps MSS off the
      # correct value too (it previously clamped to 1302 against a real ceiling
      # of 1244).
      #
      # NOT A vSWITCH CHANGE: hephaestus `nixosModules/vlanConfiguration.nix`
      # keeps eno1.4000 at MTU 1400. That is CORRECT per Hetzner's vSwitch docs
      # and is confirmed by the DF sweep above — do not lower it.
      #
      # ROLLOUT: Neutron fixes a port's MTU at CREATION time, so existing VMs
      # keep 1342 until their ports are recreated (roll the machines via CAPI).
      # Stopgap on a running VM: `ip link set dev enp3s0 mtu 1284`.
      # Cilium is pinned to MTU 1200 in-cluster (1200 + 50 vxlan = 1250 < 1284)
      # so it needs no change.
      # -----------------------------------------------------------------------
      path_mtu: 1342
      # physnet `public` is a FLAT network on enp3s0 (a 1500-MTU NIC that does
      # not cross the vSwitch). NOTE: this key is matched by PHYSNET name, and
      # the physnet is called `public`, not `enp3s0` — so this entry never
      # matches and the flat net falls back to global_physnet_mtu. Left as-is
      # (the live `ext` network is already stored at 1342); fixing the name
      # would silently resize the external network, which is a separate change.
      physical_network_mtus: enp3s0:1400
    ml2_type_flat:
      flat_networks:
        - public
  novaRef:
    name: nova
  policy:
    "context_is_admin": "role:admin"
    "create_floatingip": "rule:context_is_admin or role:member"
    "create_floatingip:floating_ip_address": "rule:context_is_admin or role:member"
    "update_floatingip": "rule:context_is_admin or role:member"
    "delete_floatingip": "rule:context_is_admin or role:member"
    "get_floatingip": ""
  region:
    name: hetzner
  setup:
    ovn:
      # =========================================================================
      # RESOURCE REQUESTS — the OVN control plane must NEVER be BestEffort.
      #
      # 2026-07-26 outage. Every OVN pod (NB ovsdb, SB ovsdb, relay, northd,
      # ovn-controller) shipped with `resources: {}` => QoS BestEffort => cgroup
      # v2 `cpu.weight` of 1, the minimum. On these hyperconverged hosts that
      # means they lose every scheduling contest against the Ceph OSDs (which
      # DO request 2 CPU / 5Gi, see rook/configs/cephcluster.yaml) and against
      # the qemu processes of the tenant VMs.
      #
      # lucy was measured at load average 69 on 12 cores (69/37/20 over
      # 1/5/15min) when this was written. Under that contention:
      #
      #   1. `ovsdb-server` (single-threaded, latency-critical) is starved so
      #      hard it cannot answer even a LOCAL unix-socket appctl — a manual
      #      `ovs-appctl cluster/status OVN_Northbound` hung for >120s.
      #   2. The ovsdb liveness probe IS that command, with a 20s timeout. It
      #      fails, so kubelet kills the container.
      #   3. The member rejoins and must replay its uncommitted raft log
      #      (`Log: [285404, 289300]` ~ 3.9k entries), which costs more CPU, so
      #      the probe fails again. Death spiral.
      #   4. Quorum is never reached: NB sat at `Role: candidate`, `Term: 676`,
      #      `Leader: unknown`, peers unheard for 167s. Restart counts were
      #      nb-2=12, sb-2=21.
      #   5. With no NB leader, `ovn-northd` can never attach ("clustered
      #      database server is not cluster leader; trying another server", in a
      #      loop over all three servers) so it fails ITS probes and goes 0/1 —
      #      northd was the visible symptom but never the cause.
      #   6. No logical-network change compiles into the dataplane => Neutron
      #      cannot bind ports => new VMs never get a vif-plugged event and fail
      #      to boot.
      #
      # NOTE this is why the raftElectionTimerMs tuning below was NOT enough on
      # its own: the timer was correctly applied (`Election timer: 60000`) yet
      # peers were still unheard for ~3x that. You cannot tune your way out of a
      # process that cannot get scheduled.
      #
      # NO CPU LIMITS ANYWHERE, deliberately — same rationale as the Ceph
      # daemons: CFS throttling of a single-threaded raft/dataplane process
      # destroys tail latency, which is the exact failure we are fixing.
      # CPU *requests* cost nothing when the node is idle; they only bind under
      # contention, which is precisely when OVN must win.
      #
      # Memory limits are set ~100x observed RSS (northd peaked at 18MB; NB
      # idl-cells 2751, SB idl-cells 14818) purely as a runaway backstop —
      # EXCEPT ovs-vswitchd, which is deliberately left unlimited because an
      # OOM-kill there takes down the whole node's dataplane.
      #
      # LIMITATION: the NeutronDeployment CRD exposes no `priorityClassName` /
      # scheduling knob for these components, so they can NOT be marked
      # `system-cluster-critical` declaratively the way the Ceph mons/mgr/osd
      # are. Requests are the only lever available here; the priority-class half
      # of this fix needs an upstream yaook change.
      # =========================================================================
      northboundOVSDB:
        # Same tuning as southboundOVSDB below — the OVN defaults (raft election
        # timer 1s, inactivity probe 5s) are far too aggressive for these
        # hyperconverged hosts, which routinely sit at load 30-40 because they
        # run the OpenStack control plane, Ceph AND the tenant VMs.
        #
        # 2026-07-26: northbound was the ONLY OVSDB left on the defaults (the
        # southbound block had already been tuned). It lost RAFT quorum and sat
        # in a re-election loop — `cluster/status OVN_Northbound` showed
        # `Status: disconnected from the cluster (election timeout)`,
        # `Role: candidate`, `Leader: unknown` at term 662, with members having
        # restarted 4 and 7 times. All three `ovn-northd` pods went 0/1 with
        # "clustered database server is disconnected from cluster", so no
        # logical-network change could be compiled into the dataplane.
        #
        # A 1s election timer means a single CPU-starvation stall longer than
        # one second costs a leader election; at load 40 that is constant.
        inactivityProbeMs: 60000
        raftElectionTimerMs: 60000
        replicas: 3
        resources:
          # The raft member itself. Single-threaded, so a 500m request is a real
          # half-core of weight rather than a token value.
          ovsdb:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
          # In the connection path for EVERY northd/neutron client (TLS is
          # terminated here, not in ovsdb). Starving this stalls connections
          # just as effectively as starving ovsdb.
          ssl-terminator:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
        backup:
          schedule: 0 12 * * *
      northd:
        # northd remote probe interval (to nb or nb relay) can be adjusted individually
        remoteInactivityProbeMs: 60000
        resources:
          northd:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              memory: 1Gi
      southboundOVSDB:
        # recommended to increase inactivityProbe and raftElectionTimer at scale (default 5s/1s)
        inactivityProbeMs: 60000
        raftElectionTimerMs: 60000
        ovnRelay: # add this section to deploy ovn-relays
          # in large scale deployments, tune probe intervals separately for the ovsdb relays
          inactivityProbeMs: 120000
          remoteInactivityProbeMs: 60000
          replicas: 3
          resources:
            # Every ovn-controller in the cloud reads SB THROUGH the relay, so a
            # starved relay stalls the dataplane on all nodes at once.
            ovn-relay:
              requests:
                cpu: 300m
                memory: 256Mi
              limits:
                memory: 1Gi
            ssl-terminator:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                memory: 256Mi
        replicas: 3
        resources:
          # SB is the larger of the two DBs (idl-cells 14818 vs NB's 2751) and
          # is read by every ovn-controller, hence more headroom than NB.
          ovsdb:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 3Gi
          ssl-terminator:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
        backup:
          schedule: 0 12 * * *
      controller:
        # ovn-controller remote probe interval (to sb or sb relay) can be adjusted individually
        remoteInactivityProbeMs: 60000
        # These are the per-node DATAPLANE agents, not strictly "control plane",
        # but they were BestEffort too and were visibly suffering for it:
        # neutron-ovn-controller-* had restarted 9-11 times. A starved
        # ovs-vswitchd does not just flap a probe, it drops packets.
        resources:
          # Translates SB logical flows into OpenFlow. Starved => the node's
          # flows go stale => VMs silently lose connectivity.
          ovn-controller:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              memory: 2Gi
          # NO memory limit on purpose: vswitchd growth scales with port/flow
          # count, and an OOM-kill here severs the whole node's dataplane
          # (every tenant VM on it). A request without a limit gives it
          # scheduling weight while keeping that failure mode impossible.
          #
          # 2026-07-30: dropped from 500m to 300m. quinn is an 8-core node (lucy
          # and makise are 12-core) and already carries a Ceph OSD (2000m
          # request) plus an OVN control-plane ovsdb+relay replica set (~1400m),
          # leaving it ~94-96% CPU-requested — the per-node dataplane's own
          # `ovs-vswitchd` (at 500m) then would NOT fit on quinn and sat Pending
          # `Insufficient cpu`, taking quinn's OVN dataplane down entirely (and
          # blocking `ovn-controller`, which has a required podAffinity to
          # co-locate with it). 300m still gives real scheduling weight (well
          # above the BestEffort cgroup weight of 1 this block exists to escape)
          # and matches `ovn-controller` above.
          #
          # NOTE: the yaook operator clamps this to a FLOOR of 300m — a lower
          # value (250m was tried) is silently rendered back up to 300m in the
          # generated StatefulSet, so 300m is the effective minimum. Fitting it
          # on quinn ALSO required relieving quinn's CPU pressure by rescheduling
          # movable Deployment-owned OpenStack API pods (glance/cinder/horizon/
          # neutron/nova-api) onto the 12-core nodes; those float and drift back,
          # so the durable capacity fix is upstream node sizing, not this value.
          ovs-vswitchd:
            requests:
              cpu: 300m
              memory: 512Mi
          ovs-vswitchd-monitoring:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          # Local (non-raft) conf.db for the node's own OVS instance.
          ovsdb-server:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          neutron-ovn-metadata-agent:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        configTemplates:
          - nodeSelectors:
              - matchLabels: {}
            bridgeConfig:
              - bridgeName: br-ex
                uplinkDevice: enp3s0
                openstackPhysicalNetwork: "public"
  targetRelease: "2026.1"
