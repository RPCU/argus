# TACTICAL WORKAROUND for the nova cold-migration ssh bug (AGENTS.md section 8,
# "Nova cold-migration / node eviction fails", bug #2).
#
# THE BUG
# -------
# The yaook `nova-compute-<release>-ubuntu` image ships an `/etc/ssh/ssh_config`
# with NO `IdentityFile` line, and the `nova` user's passwd home is `/var/empty`
# (which does not exist in the container). ssh's `~/.ssh/id_ed25519` default
# therefore expands to `/var/empty/.ssh/id_ed25519` (missing) instead of the
# real key the `keygen` init container writes to `/home/nova/.ssh/id_ed25519`.
# Result: every cold migration (rsync of the local qcow2 root disk over the
# locked-down `nova` ssh account on port 8022) fails with
# `nova@<ip>: Permission denied (publickey)`, so any NovaComputeNode eviction
# (rolling recreate, node teardown, or ANY `novaComputeConfig` edit that trips
# the disruption budget) wedges. Setting `$HOME` does NOT help — ssh uses the
# passwd home (`getpwuid`), not `$HOME`, for `~` expansion.
#
# WHY THIS IS A CRONJOB AND NOT A CR FIELD
# ----------------------------------------
# The nova-compute pods are StatefulSets whose template is GENERATED by the
# nova operator (owned by the `NovaComputeNode` CRs), so it cannot be edited in
# Git. The NovaDeployment CRD's `compute` section exposes only `configTemplates`
# and `resources` (verified against operator 4.1.208 / release 2025.1) — no
# ssh_config / IdentityFile / extraVolumes / lifecycle / command override. So
# there is no declarative NovaDeployment fix; the only durable fix is upstream
# (fix the image's ssh_config or the nova user's home) — reported separately.
#
# Until the image is fixed, this CronJob re-applies the one-line `ssh_config`
# patch to every nova-compute pod, so a freshly (re)scheduled pod is corrected
# without a human running the live `sed` from the runbook. It is idempotent
# (skips a pod already carrying the line), so steady state is a no-op.
#
# LIMITATION (why this is "tactical", not a real fix): it is RACY. A pod that
# is recreated and immediately targeted by a migration can attempt the rsync
# before the next CronJob tick patches it. If an eviction is failing with
# `Permission denied (publickey)`, run the patch NOW rather than waiting:
#   kubectl create job -n yaook --from=cronjob/nova-compute-ssh-fix nova-ssh-fix-now
# (or apply the live `sed` loop from the runbook). The durable fix is the
# upstream image change.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nova-compute-ssh-fix
  namespace: yaook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-compute-ssh-fix
  namespace: yaook
rules:
  # List the nova-compute pods to patch.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Exec into the nova-compute container to append the IdentityFile line.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-compute-ssh-fix
  namespace: yaook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-compute-ssh-fix
subjects:
  - kind: ServiceAccount
    name: nova-compute-ssh-fix
    namespace: yaook
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nova-compute-ssh-fix
  namespace: yaook
  labels:
    app: nova-compute-ssh-fix
spec:
  # Every 5 minutes: small window between a pod (re)appearing and being usable
  # as a migration source/target. Trigger manually for an in-flight eviction.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: nova-compute-ssh-fix
        spec:
          restartPolicy: OnFailure
          serviceAccountName: nova-compute-ssh-fix
          containers:
            # alpine/k8s (NOT registry.k8s.io/kubectl or rancher/kubectl —
            # both are DISTROLESS with no /bin/sh, so a shell loop can't run in
            # them). This image is Alpine-based: it has kubectl + a POSIX shell.
            # The loop below runs in THIS container; the sed/grep that edit the
            # ssh_config run INSIDE each nova-compute pod via `kubectl exec`.
            - name: ssh-fix
              image: docker.io/alpine/k8s:1.36.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  # nova-compute StatefulSet pods carry these operator labels.
                  # NOTE the component label value is `compute` (not
                  # `nova-compute`); pinning parent-plural=novacomputenodes keeps
                  # the selector unambiguous.
                  pods=$(kubectl get pods -n yaook \
                    -l 'state.yaook.cloud/component=compute,state.yaook.cloud/parent-plural=novacomputenodes' \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
                  if [ -z "${pods}" ]; then
                    echo "no nova-compute pods found — nothing to do"
                    exit 0
                  fi
                  rc=0
                  for p in ${pods}; do
                    # Idempotent: only append the line if it is missing. The
                    # `Host *` stanza and the real key path are image constants.
                    if kubectl exec -n yaook "${p}" -c nova-compute -- sh -c \
                      'grep -q "IdentityFile /home/nova/.ssh/id_ed25519" /etc/ssh/ssh_config'; then
                      echo "${p}: already patched"
                      continue
                    fi
                    if kubectl exec -n yaook "${p}" -c nova-compute -- sh -c \
                      'sed -i "/Host \*/a\    IdentityFile /home/nova/.ssh/id_ed25519" /etc/ssh/ssh_config'; then
                      echo "${p}: patched (added IdentityFile)"
                    else
                      echo "${p}: FAILED to patch" >&2
                      rc=1
                    fi
                  done
                  exit ${rc}
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
