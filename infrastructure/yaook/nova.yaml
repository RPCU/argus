apiVersion: yaook.cloud/v1
kind: NovaDeployment
metadata:
  name: nova
spec:
  api:
    ingress:
      createIngress: false
      fqdn: nova.rpcu.vpn
      ingressClassName: nginx
      port: 443
    publishEndpoint: true
    replicas: 2
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    resources:
      nova-api:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi
  compute:
    configTemplates:
      - nodeSelectors:
          - matchLabels: {}
        novaComputeConfig:
          DEFAULT:
            initialState: "Enabled"
            debug: false
            max_concurrent_builds: 5
            block_device_allocate_retries: 180
            block_device_allocate_retries_interval: 10
            cpu_allocation_ratio: 4.0
            ram_allocation_ratio: 1.0
            disk_allocation_ratio: 1.5
            reserved_host_memory_mb: 8192
            reserved_host_cpus: 2
            live_migration_permit_auto_converge: true
            # Bring guests back up automatically after a hypervisor reboot.
            # On nova-compute init, any instance whose Nova DB vm_state is
            # ACTIVE but whose libvirt domain is not running is started again.
            # Without this, a node reboot (kernel update, power event, the
            # 2026-07 node incidents) leaves every VM that was running on it
            # SHUTOFF until someone manually `openstack server start`s it —
            # which for the CAPO-provisioned mgmt/workload clusters means the
            # Kubernetes nodes silently never come back.
            # Scope: only instances Nova believes should be ACTIVE are
            # resumed. A VM stopped through the Nova API has vm_state=stopped
            # and stays down, so this does not fight deliberate shutdowns.
            # Note: this triggers on nova-compute *service* start, not only on
            # host boot, so it also applies when the nova-compute pod restarts.
            resume_guests_state_on_host_boot: true
          cinder:
            timeout: 600
          keystone_authtoken:
            os_region_name: hetzner
          libvirt:
            virt_type: kvm
            cpu_mode: host-passthrough
            # librbd writeback cache for network (RBD) disks — large guest
            # write-latency improvement; safe with virtio: the cache is
            # flushed on guest fsync/barrier requests.
            disk_cachemodes:
              - network=writeback
            # Pass guest TRIM/discard through to Ceph so deleted blocks are
            # reclaimed in the pool (needs virtio-scsi or virtio-blk w/ recent
            # machine types; harmless otherwise).
            hw_disk_discard: unmap
            # Use rsync (not the default scp) for remote file operations during
            # COLD migration / resize of instances with LOCAL qcow2 root disks
            # (images_type is unset → default qcow2, so root disks live in
            # /var/lib/nova/instances and MUST be copied node-to-node). The
            # yaook compute image's SSH `nova` user is locked down by
            # `restricted-ssh-commands`, whose allow-list only permits the
            # legacy SCP wire protocol (`scp -r -[ft] …`) and rsync — NOT the
            # SFTP subsystem. Modern OpenSSH (9+) `scp` defaults to SFTP, so
            # nova's default scp transport is rejected (exit 124 →
            # `scp: Connection closed`) and every cold migration fails, wedging
            # the nova-compute operator's node eviction/rollout. rsync IS in the
            # restricted-ssh-commands allow-list and works, so force it here.
            # (choices: ssh|rsync — nova conf `[libvirt]`.)
            remote_filesystem_transport: rsync
        volumeBackends:
          ceph:
            cephConfig: {}
            enabled: true
            keyringSecretName: rook-ceph-client-cinder
            user: cinder
            uuid: b3ab713d-912b-49ed-adaf-bd74368e567a
  conductor:
    replicas: 2
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    resources:
      nova-conductor:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi
  database:
    api:
      backup:
        mysqldump: false
        schedule: 0 * * * *
        warmKeepMax: "3"
      mysqlConfig:
        mysqld:
          max_connections: 1337
          max_heap_table_size: 64M
          max_statement_time: 60
      proxy:
        replicas: 1
        resources:
          haproxy:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          service-reload:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          create-ca-bundle:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      replicas: 1
      resources:
        mariadb-galera:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
      scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      storageSize: 8Gi
      timeoutClient: 300
      tolerateNodeDown: false
    cell0:
      backup:
        mysqldump: false
        schedule: 0 * * * *
        warmKeepMax: "3"
      mysqlConfig:
        galera:
          wsrep_slave_threads: 3
        mysqld:
          max_statement_time: 60
      proxy:
        replicas: 1
        resources:
          haproxy:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          service-reload:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          create-ca-bundle:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      replicas: 1
      resources:
        mariadb-galera:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
      scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      storageSize: 8Gi
      timeoutClient: 300
      tolerateNodeDown: false
    cell1:
      backup:
        mysqldump: false
        schedule: 0 * * * *
        warmKeepMax: "3"
      mysqlConfig:
        galera:
          wsrep_slave_threads: 3
        mysqld:
          max_statement_time: 60
      proxy:
        replicas: 1
        resources:
          haproxy:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          service-reload:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          create-ca-bundle:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      replicas: 1
      resources:
        mariadb-galera:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
      scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      storageSize: 8Gi
      timeoutClient: 300
      tolerateNodeDown: false
    placement:
      backup:
        mysqldump: false
        schedule: 0 * * * *
        warmKeepMax: "3"
      mysqlConfig:
        mysqld:
          max_connections: 1337
          max_heap_table_size: 64M
          max_statement_time: 60
      proxy:
        replicas: 1
        resources:
          haproxy:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          service-reload:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          create-ca-bundle:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      replicas: 1
      resources:
        mariadb-galera:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
      scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      storageSize: 8Gi
      timeoutClient: 300
      tolerateNodeDown: false
  databaseCleanup:
    clearAllEvents: false
    clearOnlyMigrationEvents: false
    deletionTimeRange: 60
    schedule: 0 0 * * *
  eviction:
    manager:
      deleteNode: true
      enabled: false
      interval: 15
      max_per_hour: 5
    maxParallelMigrations: 2
    netboxSetFailed: false
    volumeLockDurationSeconds: 30
  issuerRef:
    name: yaook-internal
  keystoneRef:
    kind: KeystoneDeployment
    name: keystone
  memcached:
    connections: 1024
    memory: 512
    replicas: 2
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
  messageQueue:
    cell1:
      replicas: 1
      resources:
        rabbitmq:
          requests:
            cpu: 250m
            memory: 1G
          limits:
            # Yaook maps this into rabbitmq.conf default_worker_pool_size /
            # schedulers_online (NOT a CFS throttle). Without it RabbitMQ sizes
            # its Erlang scheduler pool to the node's core count (12) → ~1.0
            # core idle. Pin to 1 core: right-sizes the worker pool.
            cpu: 1000m
            memory: 2G
      scheduleRuleWhenUnsatisfiable: ScheduleAnyway
      storageSize: 8Gi
      tolerateNodeDown: false
  metadata:
    replicas: 2
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    resources:
      nova-metadata:
        requests:
          cpu: 100m
          memory: 512Mi
        # 2026-07-30: raised 1Gi -> 1536Mi. After the 2025.1 -> 2025.2 upgrade
        # the nova-metadata container OOMKilled (exit 137) on startup on all 3
        # replicas — it ran ~2Gi against a 1Gi limit because it forked
        # `metadata_workers` WSGI workers (each loads the full nova stack,
        # ~500Mi). The real fix is fewer workers (metadata_workers 4 -> 2 in
        # novaConfig below, since this API only serves cloud-init at VM boot and
        # sits at ~15m CPU); 2 workers land at ~1-1.2Gi, and 1536Mi leaves
        # headroom so a transient spike doesn't re-trigger the OOM loop.
        limits:
          memory: 1536Mi
  novaConfig:
    DEFAULT:
      debug: false
      osapi_compute_workers: 4
      # 2 (not 4): the metadata API only serves cloud-init/instance metadata at
      # VM boot and idles at ~15m CPU. Each worker forks the full nova stack
      # (~500Mi), so 4 workers pushed the container to ~2Gi and OOMKilled it
      # against its limit after the 2025.2 upgrade. See the nova-metadata
      # resources block above.
      metadata_workers: 2
    conductor:
      workers: 4
    scheduler:
      workers: 4
    database:
      max_pool_size: 20
      max_overflow: 30
  placement:
    ingress:
      createIngress: false
      fqdn: placement.rpcu.vpn
      ingressClassName: nginx
      port: 443
    publishEndpoint: true
    replicas: 2
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    resources:
      placement:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 2Gi
  placementCleanup:
    schedule: 0 0 1 * *
  policy:
    context_is_admin: role:admin
  region:
    name: hetzner
  scheduler:
    replicas: 2
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    resources:
      nova-scheduler:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
  targetRelease: "2026.1"
  vnc:
    ingress:
      createIngress: false
      fqdn: vnc.rpcu.vpn
      ingressClassName: nginx
      port: 443
    publishEndpoint: true
    replicas: 1
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    resources:
      nova-novncproxy:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
