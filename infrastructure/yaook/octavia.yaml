apiVersion: yaook.cloud/v1
kind: OctaviaDeployment
metadata:
  name: octavia
spec:
  keystoneRef:
    name: keystone
  neutronRef:
    name: neutron-ovn
  api:
    replicas: 1
    ingress:
      createIngress: false
      fqdn: "octavia.rpcu.vpn"
      port: 443
    # api/worker/health_manager/housekeeping were BestEffort. Sized from 72h
    # Mimir p95 (request) / 2x max (limit), 2026-09-28. No CPU limits.
    resources:
      octavia-api:
        requests:
          cpu: 65m
          memory: 176Mi
        limits:
          memory: 384Mi
      octavia-driver-agent:
        requests:
          cpu: 35m
          memory: 256Mi
        limits:
          memory: 576Mi
  worker:
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    resources:
      octavia-worker:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
  health_manager:
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
    resources:
      octavia-health-manager:
        requests:
          cpu: 10m
          memory: 192Mi
        limits:
          memory: 448Mi
  housekeeping:
    replicas: 1
    resources:
      octavia-housekeeping:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
  networking:
    # CIDR of the Neutron network to be used to connect Octavia management
    # services and the Amphora VMs. Will be exposed via OVS internal ports
    # on Kubernetes nodes and must not collide with Kubernetes IP ranges!
    managementSubnetCIDR: "172.31.0.0/16"
  database:
    mysqlConfig:
      mysqld:
        max_statement_time: 60
    replicas: 1
    resources:
      mariadb-galera:
        requests:
          cpu: 50m
          memory: 288Mi
        limits:
          memory: 2Gi
    timeoutClient: 300
    proxy:
      replicas: 1
      resources:
        haproxy:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 320Mi
        service-reload:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
        create-ca-bundle:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    backup:
      schedule: "0 * * * *"
  memcached:
    connections: 1024
    memory: 512
    replicas: 1
    scheduleRuleWhenUnsatisfiable: ScheduleAnyway
  messageQueue:
    replicas: 1
    resources:
      rabbitmq:
        requests:
          cpu: 290m
          memory: 240Mi
        limits:
          # Yaook maps this into rabbitmq.conf default_worker_pool_size /
          # schedulers_online (NOT a CFS throttle). Without it RabbitMQ sizes
          # its Erlang scheduler pool to the node's core count (12). Pin the
          # worker pool for this lighter service.
          cpu: 750m
          memory: 2G
  issuerRef:
    name: yaook-internal
  targetRelease: "2026.1"
  region:
    name: hetzner
  policy:
    "context_is_admin": "role:load-balancer_admin or role:admin"
  octaviaConfig:
    DEFAULT:
      debug: false
    api_settings:
      enabled_provider_drivers: "ovn:OVN provider"
      default_provider_driver: "ovn"
    # (optional) enable audit logging
    audit:
      enabled: True
      audit_map_file: "/usr/local/etc/octavia/octavia_api_audit_map.conf"
    audit_middleware_notifications:
      use_oslo_messaging: True
      driver: "log"
    # controller_worker:
    #   # (optional) value of the 'owner' attribute of the Amphora image in
    #   # Glance, defaults to the ID of the 'service' project.
    #   amp_image_owner_id: "98a3c44385de48ddba045d8c19340451"
    #   # (optional) ID of the flavor in Nova to use for the Amphora VMs,
    #   # defaults to 'octavia-amphora'.
    #   amp_flavor_id: "my-flavor-id"
    #   # (optional) Name of the image tag for Amphora images, defaults to
    #   # 'amphora'.
    #   amp_image_tag: "custom-amphora-images"
